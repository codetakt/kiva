route_coverage_projection:
  description: 'Route coverage projection generated from the surface catalog. It verifies that every OpenAPI operation has a matching Axum route registration and records whether the path is bound by literal route text or a shared path constant.

    '
  targets:
  - openapi_contract: spec/openapi/kiva-analytics.yaml
    route_file: crates/kiva-server/src/surfaces/analytics/routes.rs
    path_binding: path-constant
    path_constants_file: crates/kiva-server/src/core/paths.rs
  - openapi_contract: spec/openapi/kiva-xapi.yaml
    route_file: crates/kiva-server/src/surfaces/xapi/routes.rs
    path_binding: literal
  - openapi_contract: spec/openapi/kiva-pds.yaml
    route_file: crates/kiva-server/src/surfaces/pds/routes.rs
    path_binding: path-constant
    path_constants_file: crates/kiva-server/src/core/paths.rs
  - openapi_contract: spec/openapi/kiva-confidential.yaml
    route_file: crates/kiva-server/src/surfaces/confidential/routes.rs
    path_binding: path-constant
    path_constants_file: crates/kiva-server/src/core/paths.rs
