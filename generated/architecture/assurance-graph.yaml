schema_version: 1
kind: kiva-assurance-graph
status: active
description: Primary generated AssuranceGraph review surface over claims, declared evidence receipts, capability bindings, and verification obligations.
primary_review_surface: true
authority_level_policy:
  claim:
    authority_level: public-claim
    rule: Public implementation claims are the only claim-authoritative AssuranceGraph nodes.
  evidence_receipt:
    authority_level: declared-evidence
    rule: Evidence receipts discharge or declare evidence and cannot create public claim semantics.
  capability:
    authority_level: capability-context
    rule: Capability nodes provide confidential-computation context and require claim edges for public assertions.
  verification_obligation:
    authority_level: verification-boundary
    rule: Verification obligations discharge boundary properties below the claim authority layer.
derived_view_policy:
  rule: EvidenceSet, EvidenceReceipt, ClaimGraph, and VerificationObligation remain materialized inputs to the AssuranceGraph review surface.
  materialized_inputs:
  - generated/architecture/claim-graph.yaml
generated_from:
- generated/architecture/claim-graph.yaml
- spec/evidence/assurance-primitive.source.yaml
generated_artifacts:
