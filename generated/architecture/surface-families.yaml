  pds_assignment: source_pds_resource_family-must-match-pds_resource_family
  prefix_assignment: longest-path-prefix-wins
  empty_family_policy: reject-empty-family
implementation_anchor_policy:
  role: review-anchors-not-assignment-inputs
  assignment_fields:
  - source_pds_resource_family
  - path_prefixes
  review_anchor_fields:
  - implementation_files
  description: 'Surface-family ownership is assigned only by PDS resource-family inheritance or OpenAPI path prefixes. implementation_files are review anchors carried into generated ledgers; they do not participate in route classification.

    '
