[graph]
targets = []

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "chrono", reason = "Use the time crate for new code." },
    { name = "native-tls", reason = "Use rustls-based TLS when TLS is introduced." },
    { name = "openssl", reason = "Use rustls or a reviewed verified-crypto boundary." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The runner isolates arbitrary_precision from production feature unification.
# Cargo.toml and Cargo.lock pin the exact upstream serde_json 1.0.150 revision.
allow-git = ["https://github.com/serde-rs/json"]
