        Content-Type: application/json
        X-Experience-API-Version: 2.0.0
      body:
        id: 00000000-0000-4000-8000-000000000203
        actor:
          objectType: Agent
          mbox: mailto:kiva-conformance-validation@example.org
        verb:
          id: https://adlnet.gov/expapi/verbs/experienced
        object:
          objectType: Activity
          id: https://example.org/kiva/conformance/activity/invalid-extension-key
        context:
          extensions:
            not-an-iri: value
        version: 2.0.0
    expect:
      status: 400
      headers:
        X-Experience-API-Version:
          equals: 2.0.0
        X-Experience-API-Consistent-Through:
          iso8601: true
