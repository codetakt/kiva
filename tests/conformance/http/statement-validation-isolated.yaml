suite:
  id: xapi-lrs-statement-validation-isolated
  standard: IEEE/ISO/IEC 39274-1-1-2025
  description: Destructive Statement validation rejection checks for disposable isolated LRS targets.
cases:
  - id: statement-post-rejects-duplicate-json-properties
    requirements:
      - xapi-lrs-4.2.1-statement-duplicate-properties
      - xapi-lrs-4.1.5-error-most-appropriate
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    request:
      method: POST
      path: /statements
      headers:
        Content-Type: application/json
        X-Experience-API-Version: 2.0.0
      raw_body: '{"id":"00000000-0000-4000-8000-000000000201","actor":{"objectType":"Agent","mbox":"mailto:kiva-conformance-validation@example.org"},"actor":{"objectType":"Agent","mbox":"mailto:kiva-conformance-duplicate@example.org"},"verb":{"id":"https://adlnet.gov/expapi/verbs/experienced"},"object":{"objectType":"Activity","id":"https://example.org/kiva/conformance/activity/duplicate-properties"},"version":"2.0.0"}'
    expect:
      status: 400
      headers:
        X-Experience-API-Version:
          equals: 2.0.0
        X-Experience-API-Consistent-Through:
          iso8601: true
  - id: statement-post-rejects-top-level-extra-property
    requirements:
      - xapi-lrs-4.2.1-statement-extra-properties
      - xapi-lrs-4.1.5-error-most-appropriate
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    request:
      method: POST
      path: /statements
      headers:
        Content-Type: application/json
        X-Experience-API-Version: 2.0.0
      body:
        id: 00000000-0000-4000-8000-000000000202
        actor:
          objectType: Agent
          mbox: mailto:kiva-conformance-validation@example.org
        verb:
          id: https://adlnet.gov/expapi/verbs/experienced
        object:
          objectType: Activity
          id: https://example.org/kiva/conformance/activity/extra-property
        kivaExtraOutsideExtensions: true
        version: 2.0.0
    expect:
      status: 400
      headers:
        X-Experience-API-Version:
          equals: 2.0.0
        X-Experience-API-Consistent-Through:
          iso8601: true
