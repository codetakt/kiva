suite:
  id: xapi-lrs-statement-normalization-isolated
  standard: IEEE/ISO/IEC 39274-1-1-2025
  description: Destructive Statement normalization checks for disposable isolated LRS targets.
cases:
  - id: statement-defaults-and-overwrites-lrs-managed-fields
    requirements:
      - xapi-lrs-4.2.4.2-timestamp-default
      - xapi-lrs-4.2.4.2-stored-set-by-lrs
      - xapi-lrs-4.2.4.2-authority-present
      - xapi-lrs-4.2.4.3-version-retention
      - xapi-lrs-4.1.6.1-statement-consistent-through
      - xapi-lrs-4.1.6.1-statement-last-modified
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-statement-with-submitted-stored
        request:
          method: PUT
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000111
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            id: 00000000-0000-4000-8000-000000000111
            actor:
              objectType: Agent
              mbox: mailto:kiva-conformance-normalization@example.org
            verb:
              id: https://adlnet.gov/expapi/verbs/experienced
              display:
                en-US: experienced
            object:
              objectType: Activity
              id: https://example.org/kiva/conformance/activity/statement-normalization-defaults
            stored: '2000-01-01T00:00:00Z'
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
      - id: get-managed-fields
        request:
          method: GET
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000111
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
          await_retrieval_ms: 5000
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
            Last-Modified:
              present: true
          json:
            pointers:
              /stored:
                not_equals: '2000-01-01T00:00:00Z'
              /authority:
                present: true
              /version:
                equals: 2.0.0
          capture:
            stored_timestamp:
              pointer: /stored
          checks:
            - kind: header-time
              header: Last-Modified
              equals_pointer: /stored
      - id: get-defaulted-timestamp
        request:
          method: GET
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000111
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
          await_retrieval_ms: 5000
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
            Last-Modified:
              present: true
          checks:
            - kind: json-time
              pointer: /stored
              equals_capture: stored_timestamp
              utc: true
            - kind: json-time
              pointer: /timestamp
              equals_capture: stored_timestamp
              utc: true
            - kind: header-time
              header: Last-Modified
              equals_pointer: /stored
  - id: statement-context-activities-single-object-returns-array
    requirements:
      - xapi-lrs-4.2.4.2-context-activities-array
      - xapi-lrs-4.1.6.1-statement-consistent-through
      - xapi-lrs-4.1.6.1-statement-last-modified
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-statement-with-single-context-activity
        request:
          method: PUT
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000112
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            id: 00000000-0000-4000-8000-000000000112
            actor:
              objectType: Agent
              mbox: mailto:kiva-conformance-normalization@example.org
            verb:
              id: https://adlnet.gov/expapi/verbs/experienced
              display:
                en-US: experienced
            object:
              objectType: Activity
              id: https://example.org/kiva/conformance/activity/statement-context-activity-object
            context:
              contextActivities:
                parent:
                  objectType: Activity
                  id: https://example.org/kiva/conformance/activity/context-parent
            version: 2.0.0
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
      - id: get-statement
        request:
          method: GET
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000112
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
          await_retrieval_ms: 5000
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
            Last-Modified:
              present: true
          json:
            pointers:
              /context/contextActivities/parent/0/id:
                equals: https://example.org/kiva/conformance/activity/context-parent
              /context/contextActivities/parent/1:
                present: false
          checks:
            - kind: header-time
              header: Last-Modified
              equals_pointer: /stored
  - id: statement-object-without-objecttype-is-activity
    requirements:
      - xapi-lrs-4.2.2.3-object-default-activity
      - xapi-lrs-4.1.6.1-statement-consistent-through
      - xapi-lrs-4.1.6.1-statement-last-modified
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-statement-with-activity-object-shorthand
        request:
          method: PUT
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000113
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            id: 00000000-0000-4000-8000-000000000113
            actor:
              objectType: Agent
              mbox: mailto:kiva-conformance-normalization@example.org
            verb:
              id: https://adlnet.gov/expapi/verbs/experienced
            object:
              id: https://example.org/kiva/conformance/activity/object-default-activity
            version: 2.0.0
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
      - id: get-statement
        request:
          method: GET
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000113
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
          await_retrieval_ms: 5000
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
            Last-Modified:
              present: true
          json:
            pointers:
              /object/id:
                equals: https://example.org/kiva/conformance/activity/object-default-activity
          checks:
            - kind: header-time
              header: Last-Modified
              equals_pointer: /stored
