suite:
  id: xapi-lrs-state-document-isolated
  standard: IEEE/ISO/IEC 39274-1-1-2025
  description: Destructive State document checks for disposable isolated LRS targets.
cases:
  - id: state-put-get-without-prior-activity-or-agent-knowledge
    requirements:
      - xapi-lrs-4.1.4-etag-on-document-get
      - xapi-lrs-4.1.6-document-no-prior-knowledge
      - xapi-lrs-4.1.6.2-state-get-last-modified
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-state
        request:
          method: PUT
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-put-get
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-put-get
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            alpha: one
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: get-state
        request:
          method: GET
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-put-get
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-put-get
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            ETag:
              present: true
            Last-Modified:
              present: true
          json:
            pointers:
              /alpha:
                equals: one
      - id: head-state
        request:
          method: HEAD
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-put-get
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-put-get
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            ETag:
              present: true
            Last-Modified:
              present: true
          body:
            non_empty: false
  - id: state-put-get-text-document
    requirements:
      - xapi-lrs-4.1.4-etag-on-document-get
      - xapi-lrs-4.1.6-document-no-prior-knowledge
      - xapi-lrs-4.1.6.2-state-get-last-modified
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-text-state
        request:
          method: PUT
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-put-get-text
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-put-get-text
          headers:
            Content-Type: text/plain
            X-Experience-API-Version: 2.0.0
          raw_body: state text document payload
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: get-text-state
        request:
          method: GET
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-put-get-text
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-put-get-text
          headers:
            Accept: text/plain
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            Content-Type:
              contains: text/plain
            ETag:
              present: true
            Last-Modified:
              present: true
          checks:
            - kind: bytes
              hex: 7374617465207465787420646f63756d656e74207061796c6f6164
  - id: state-put-existing-without-condition-conflicts
    requirements:
      - xapi-lrs-4.1.4-put-conflict
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-original
        request:
          method: PUT
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-put-conflict
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-put-conflict
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            value: original
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: put-conflicting-replacement
        request:
          method: PUT
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-put-conflict
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-put-conflict
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            value: changed
        expect:
          status: 409
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
          body:
            non_empty: true
      - id: get-original
        request:
          method: GET
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-put-conflict
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-put-conflict
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
          json:
            pointers:
              /value:
                equals: original
  - id: state-put-failed-if-match-preserves-original
    requirements:
      - xapi-lrs-4.1.4-if-match
      - xapi-lrs-4.1.4-precondition-failed
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-original
        request:
          method: PUT
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-if-match
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-if-match
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            value: original
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: put-with-failing-if-match
        request:
          method: PUT
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-if-match
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-if-match
          headers:
            Content-Type: application/json
            If-Match: '"kiva-conformance-nonmatching-etag"'
            X-Experience-API-Version: 2.0.0
          body:
            value: changed
        expect:
          status: 412
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: get-original
        request:
          method: GET
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-if-match
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-if-match
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
          json:
            pointers:
              /value:
                equals: original
  - id: state-put-successful-if-match-updates-document
    requirements:
      - xapi-lrs-4.1.4-etag-on-document-get
      - xapi-lrs-4.1.4-if-match
      - xapi-lrs-4.1.6.2-state-get-last-modified
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-original
        request:
          method: PUT
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-if-match-success
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-if-match-success
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            value: original
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: get-etag
        request:
          method: GET
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-if-match-success
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-if-match-success
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            ETag:
              present: true
            Last-Modified:
              present: true
          json:
            pointers:
              /value:
                equals: original
          capture:
            state_etag:
              header: ETag
      - id: put-with-matching-if-match
        request:
          method: PUT
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-if-match-success
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-if-match-success
          headers:
            Content-Type: application/json
            If-Match: '{{state_etag}}'
            X-Experience-API-Version: 2.0.0
          body:
            value: changed
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: get-changed
        request:
          method: GET
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-if-match-success
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-if-match-success
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            ETag:
              present: true
            Last-Modified:
              present: true
          json:
            pointers:
              /value:
                equals: changed
  - id: state-post-json-object-merges-top-level
    requirements:
      - xapi-lrs-4.1.6.2-state-post-json-merge
      - xapi-lrs-4.1.6.2-state-post-merge-success
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-original
        request:
          method: PUT
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-post-merge
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-post-merge
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            alpha: one
            nested:
              old: true
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: post-merge
        request:
          method: POST
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-post-merge
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-post-merge
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            beta: two
            nested:
              new: true
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: get-merged
        request:
          method: GET
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-post-merge
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-post-merge
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
          json:
            pointers:
              /alpha:
                equals: one
              /beta:
                equals: two
              /nested/old:
                present: false
              /nested/new:
                equals: true
  - id: state-post-json-merge-rejects-existing-non-json
    requirements:
      - xapi-lrs-4.1.6.2-state-post-merge-reject-invalid
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-text-original
        request:
          method: PUT
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-post-non-json-existing
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-post-non-json-existing
          headers:
            Content-Type: text/plain
            X-Experience-API-Version: 2.0.0
          raw_body: original text document
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: post-json-merge-to-text
        request:
          method: POST
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-post-non-json-existing
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-post-non-json-existing
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            replaced: true
        expect:
          status: 400
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: get-text-original
        request:
          method: GET
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-post-non-json-existing
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-post-non-json-existing
          headers:
            Accept: text/plain
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            Content-Type:
              contains: text/plain
          checks:
            - kind: bytes
              hex: 6f726967696e616c207465787420646f63756d656e74
  - id: state-post-invalid-json-merge-preserves-original
    requirements:
      - xapi-lrs-4.1.6.2-state-post-merge-reject-invalid
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-original
        request:
          method: PUT
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-post-invalid-merge
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-post-invalid-merge
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            alpha: one
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: post-invalid-merge
        request:
          method: POST
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-post-invalid-merge
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-post-invalid-merge
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            - invalid
            - merge
        expect:
          status: 400
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: get-original
        request:
          method: GET
          path: /activities/state
          query:
            activityId: https://example.org/kiva/conformance/activity/state-post-invalid-merge
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-state@example.org"}'
            stateId: kiva-state-post-invalid-merge
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
          json:
            pointers:
              /alpha:
                equals: one
