suite:
  id: xapi-lrs-agent-activity-fallback
  standard: IEEE/ISO/IEC 39274-1-1-2025
  description: Low-side-effect fallback checks for Agents and Activities resources.
cases:
  - id: agents-get-returns-person-for-requested-agent
    requirements:
      - xapi-lrs-4.1.6.3-agents-person-fallback
      - xapi-lrs-4.1.6.3-person-arrays
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: false
      requires_isolated_lrs: false
    steps:
      - id: get-agent-person
        request:
          method: GET
          path: /agents
          query:
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-agent-fallback@example.org"}'
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
          json:
            pointers:
              /objectType:
                equals: Person
              /mbox:
                contains: mailto:kiva-conformance-agent-fallback@example.org
      - id: head-agent-person
        request:
          method: HEAD
          path: /agents
          query:
            agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-agent-fallback@example.org"}'
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
          body:
            non_empty: false
  - id: activities-get-returns-activity-for-requested-id
    requirements:
      - xapi-lrs-4.1.6.4-activity-fallback
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: false
      requires_isolated_lrs: false
    steps:
      - id: get-activity
        request:
          method: GET
          path: /activities
          query:
            activityId: https://example.org/kiva/conformance/activity/fallback
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
          json:
            pointers:
              /id:
                equals: https://example.org/kiva/conformance/activity/fallback
      - id: head-activity
        request:
          method: HEAD
          path: /activities
          query:
            activityId: https://example.org/kiva/conformance/activity/fallback
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
          body:
            non_empty: false
  - id: activities-get-returns-requested-activity-after-definition-writes
    requirements:
      - xapi-lrs-4.1.6.4-activity-complete
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: post-english-activity-definition
        request:
          method: POST
          path: /statements
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            actor:
              mbox: mailto:kiva-activity-complete@example.org
            verb:
              id: https://example.org/verbs/experienced
            object:
              id: https://example.org/kiva/conformance/activity/complete
              definition:
                name:
                  en-US: Complete activity
        expect:
          status: 200
          headers:
            X-Experience-API-Consistent-Through:
              iso8601: true
      - id: post-japanese-activity-definition
        request:
          method: POST
          path: /statements
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            actor:
              mbox: mailto:kiva-activity-complete@example.org
            verb:
              id: https://example.org/verbs/experienced
            object:
              id: https://example.org/kiva/conformance/activity/complete
              definition:
                name:
                  ja-JP: Complete activity ja
        expect:
          status: 200
          headers:
            X-Experience-API-Consistent-Through:
              iso8601: true
      - id: get-complete-activity-definition
        request:
          method: GET
          path: /activities
          query:
            activityId: https://example.org/kiva/conformance/activity/complete
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          json:
            pointers:
              /id:
                equals: https://example.org/kiva/conformance/activity/complete
          checks:
            - kind: json-shape
              shape:
                type: object
                required: [id]
                properties:
                  id: {type: string}
                  objectType: {type: string, enum: [Activity]}
                  definition: {type: object}
          headers: {}
