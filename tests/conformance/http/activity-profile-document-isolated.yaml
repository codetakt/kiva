suite:
  id: xapi-lrs-activity-profile-document-isolated
  standard: IEEE/ISO/IEC 39274-1-1-2025
  description: Destructive Activity Profile document checks for disposable isolated LRS targets.
cases:
  - id: activity-profile-put-get-without-prior-activity-knowledge
    requirements:
      - xapi-lrs-4.1.4-etag-on-document-get
      - xapi-lrs-4.1.6-document-no-prior-knowledge
      - xapi-lrs-4.1.6.6-activity-profile-get-last-modified
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-profile
        request:
          method: PUT
          path: /activities/profile
          query:
            activityId: https://example.org/kiva/conformance/activity/activity-profile-put-get
            profileId: kiva-activity-profile-put-get
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            alpha: one
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: get-profile
        request:
          method: GET
          path: /activities/profile
          query:
            activityId: https://example.org/kiva/conformance/activity/activity-profile-put-get
            profileId: kiva-activity-profile-put-get
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            ETag:
              present: true
            Last-Modified:
              present: true
          json:
            pointers:
              /alpha:
                equals: one
      - id: head-profile
        request:
          method: HEAD
          path: /activities/profile
          query:
            activityId: https://example.org/kiva/conformance/activity/activity-profile-put-get
            profileId: kiva-activity-profile-put-get
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            ETag:
              present: true
            Last-Modified:
              present: true
          body:
            non_empty: false
  - id: activity-profile-put-get-octet-stream-document
    requirements:
      - xapi-lrs-4.1.4-etag-on-document-get
      - xapi-lrs-4.1.6-document-no-prior-knowledge
      - xapi-lrs-4.1.6.6-activity-profile-get-last-modified
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-octet-stream-profile
        request:
          method: PUT
          path: /activities/profile
          query:
            activityId: https://example.org/kiva/conformance/activity/activity-profile-octet-stream
            profileId: kiva-activity-profile-octet-stream
          headers:
            Content-Type: application/octet-stream
            X-Experience-API-Version: 2.0.0
          raw_body: activity-profile-byte-payload
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: get-octet-stream-profile
        request:
          method: GET
          path: /activities/profile
          query:
            activityId: https://example.org/kiva/conformance/activity/activity-profile-octet-stream
            profileId: kiva-activity-profile-octet-stream
          headers:
            Accept: application/octet-stream
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            Content-Type:
              contains: application/octet-stream
            ETag:
              present: true
            Last-Modified:
              present: true
          checks:
            - kind: bytes
              hex: 61637469766974792d70726f66696c652d627974652d7061796c6f6164
  - id: activity-profile-post-json-object-merges-top-level
    requirements:
      - xapi-lrs-4.1.6.6-activity-profile-post-json-merge
      - xapi-lrs-4.1.6.6-activity-profile-post-merge-success
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-original
        request:
          method: PUT
          path: /activities/profile
          query:
            activityId: https://example.org/kiva/conformance/activity/activity-profile-post-merge
            profileId: kiva-activity-profile-post-merge
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            alpha: one
            nested:
              old: true
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: post-merge
        request:
          method: POST
          path: /activities/profile
          query:
            activityId: https://example.org/kiva/conformance/activity/activity-profile-post-merge
            profileId: kiva-activity-profile-post-merge
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            beta: two
            nested:
              new: true
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: get-merged
        request:
          method: GET
          path: /activities/profile
          query:
            activityId: https://example.org/kiva/conformance/activity/activity-profile-post-merge
            profileId: kiva-activity-profile-post-merge
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
          json:
            pointers:
              /alpha:
                equals: one
              /beta:
                equals: two
              /nested/old:
                present: false
              /nested/new:
                equals: true
  - id: activity-profile-post-invalid-json-merge-preserves-original
    requirements:
      - xapi-lrs-4.1.6.6-activity-profile-post-merge-reject-invalid
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-original
        request:
          method: PUT
          path: /activities/profile
          query:
            activityId: https://example.org/kiva/conformance/activity/activity-profile-post-invalid-merge
            profileId: kiva-activity-profile-post-invalid-merge
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            alpha: one
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: post-invalid-merge
        request:
          method: POST
          path: /activities/profile
          query:
            activityId: https://example.org/kiva/conformance/activity/activity-profile-post-invalid-merge
            profileId: kiva-activity-profile-post-invalid-merge
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            - invalid
            - merge
        expect:
          status: 400
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
      - id: get-original
        request:
          method: GET
          path: /activities/profile
          query:
            activityId: https://example.org/kiva/conformance/activity/activity-profile-post-invalid-merge
            profileId: kiva-activity-profile-post-invalid-merge
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
          json:
            pointers:
              /alpha:
                equals: one
