suite:
  id: xapi-lrs-statement-datatypes-isolated
  standard: IEEE/ISO/IEC 39274-1-1-2025
  description: Destructive Statement datatype checks for disposable isolated LRS targets.
cases:
  - id: statement-admission-preserves-valid-json-properties
    requirements:
      - xapi-lrs-4.2-statement-immutability-preserve
      - xapi-lrs-4.2.4.2-return-serialization
      - xapi-lrs-4.2.7-extension-values
      - xapi-lrs-4.1.6.1-statement-consistent-through
      - xapi-lrs-4.1.6.1-statement-last-modified
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-statement
        request:
          method: PUT
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000307
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            id: 00000000-0000-4000-8000-000000000307
            actor:
              objectType: Agent
              mbox: mailto:kiva-conformance-preservation@example.org
            verb:
              id: https://adlnet.gov/expapi/verbs/experienced
            object:
              objectType: Activity
              id: https://example.org/kiva/conformance/activity/json-preservation
              definition:
                extensions:
                  https://example.org/kiva/conformance/extensions/activity-value:
                    source: learner
                    sequence: 7
            context:
              extensions:
                https://example.org/kiva/conformance/extensions/context-value:
                  enabled: true
                  label: retained-opaque-value
            version: 2.0.0
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
      - id: get-statement
        request:
          method: GET
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000307
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
          await_retrieval_ms: 5000
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
            Last-Modified:
              present: true
          json:
            pointers:
              ? ''
              : contains:
                  id: 00000000-0000-4000-8000-000000000307
                  actor:
                    objectType: Agent
                    mbox: mailto:kiva-conformance-preservation@example.org
                  verb:
                    id: https://adlnet.gov/expapi/verbs/experienced
                  object:
                    objectType: Activity
                    id: https://example.org/kiva/conformance/activity/json-preservation
                    definition:
                      extensions:
                        https://example.org/kiva/conformance/extensions/activity-value:
                          source: learner
                          sequence: 7
                  context:
                    extensions:
                      https://example.org/kiva/conformance/extensions/context-value:
                        enabled: true
                        label: retained-opaque-value
                  version: 2.0.0
              /actor/name:
                present: false
              /verb/display:
                present: false
              /result:
                present: false
              /attachments:
                present: false
          checks:
            - kind: header-time
              header: Last-Modified
              equals_pointer: /stored
  - id: statement-extension-values-are-not-rejected
    requirements:
      - xapi-lrs-4.2.7-extension-values
      - xapi-lrs-4.1.6.1-statement-consistent-through
      - xapi-lrs-4.1.6.1-statement-last-modified
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-statement
        request:
          method: PUT
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000301
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            id: 00000000-0000-4000-8000-000000000301
            actor:
              objectType: Agent
              mbox: mailto:kiva-conformance-datatypes@example.org
            verb:
              id: https://adlnet.gov/expapi/verbs/experienced
            object:
              objectType: Activity
              id: https://example.org/kiva/conformance/activity/extension-values
            context:
              extensions:
                https://example.org/kiva/conformance/extensions/opaque:
                  nullValue: null
                  objectValue:
                    nested: true
                  arrayValue:
                    - 1
                    - two
                    - false
            version: 2.0.0
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
      - id: get-statement
        request:
          method: GET
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000301
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
          await_retrieval_ms: 5000
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
            Last-Modified:
              present: true
          json:
            pointers:
              /context/extensions:
                equals:
                  https://example.org/kiva/conformance/extensions/opaque:
                    nullValue: null
                    objectValue:
                      nested: true
                    arrayValue:
                      - 1
                      - two
                      - false
          checks:
            - kind: header-time
              header: Last-Modified
              equals_pointer: /stored
  - id: statement-timestamp-offset-is-returned-in-utc
    requirements:
      - xapi-lrs-4.2.7-timestamps-utc
      - xapi-lrs-4.2.4.2-return-serialization
      - xapi-lrs-4.1.6.1-statement-consistent-through
      - xapi-lrs-4.1.6.1-statement-last-modified
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-statement
        request:
          method: PUT
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000302
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            id: 00000000-0000-4000-8000-000000000302
            actor:
              objectType: Agent
              mbox: mailto:kiva-conformance-datatypes@example.org
            verb:
              id: https://adlnet.gov/expapi/verbs/experienced
            object:
              objectType: Activity
              id: https://example.org/kiva/conformance/activity/timestamp-utc
            timestamp: '2025-01-01T09:00:00+09:00'
            version: 2.0.0
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
      - id: get-statement
        request:
          method: GET
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000302
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
          await_retrieval_ms: 5000
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
            Last-Modified:
              present: true
          checks:
            - kind: json-time
              pointer: /timestamp
              expected: '2025-01-01T09:00:00+09:00'
              utc: true
              allow_truncation_or_rounding: true
            - kind: header-time
              header: Last-Modified
              equals_pointer: /stored
  - id: statement-future-timestamp-is-not-rejected
    requirements:
      - xapi-lrs-4.2.4.1-future-timestamp-not-rejected
      - xapi-lrs-4.2.4.2-return-serialization
      - xapi-lrs-4.1.6.1-statement-consistent-through
      - xapi-lrs-4.1.6.1-statement-last-modified
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-statement
        request:
          method: PUT
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000305
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            id: 00000000-0000-4000-8000-000000000305
            actor:
              objectType: Agent
              mbox: mailto:kiva-conformance-datatypes@example.org
            verb:
              id: https://adlnet.gov/expapi/verbs/experienced
            object:
              objectType: Activity
              id: https://example.org/kiva/conformance/activity/future-timestamp
            timestamp: '{{kiva_now_plus_30s}}'
            version: 2.0.0
        expect:
          # The source deliberately leaves the acceptable future margin open.
          # Observe this probe's acceptance/rejection; the declared-margin
          # procedure supplies the policy oracle. Preserve accepted values.
          status: 204
          status_in: [400]
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
      - id: get-statement
        when_previous_status: 204
        request:
          method: GET
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000305
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
          await_retrieval_ms: 5000
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
            Last-Modified:
              present: true
          json:
            pointers:
              /timestamp:
                present: true
          checks:
            - kind: header-time
              header: Last-Modified
              equals_pointer: /stored
  - id: statement-number-precision-is-preserved
    requirements:
      - xapi-lrs-4.2.4.2-number-precision
      - xapi-lrs-4.2.4.2-return-serialization
      - xapi-lrs-4.1.6.1-statement-consistent-through
      - xapi-lrs-4.1.6.1-statement-last-modified
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-statement
        request:
          method: PUT
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000303
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            id: 00000000-0000-4000-8000-000000000303
            actor:
              objectType: Agent
              mbox: mailto:kiva-conformance-datatypes@example.org
            verb:
              id: https://adlnet.gov/expapi/verbs/scored
            object:
              objectType: Activity
              id: https://example.org/kiva/conformance/activity/number-precision
            result:
              score:
                raw: 3.1415927
                scaled: 0.33333334
            version: 2.0.0
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
      - id: get-statement
        request:
          method: GET
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000303
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
          await_retrieval_ms: 5000
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
            Last-Modified:
              present: true
          checks:
            - kind: header-time
              header: Last-Modified
              equals_pointer: /stored
            - kind: numeric-precision
              pointer: /result/score/raw
              expected: 3.1415927
            - kind: numeric-precision
              pointer: /result/score/scaled
              expected: 0.33333334
  - id: statement-duration-comparison-ignores-sub-centisecond-precision
    requirements:
      - xapi-lrs-4.2.7-duration-format
      - xapi-lrs-4.2.4.2-return-serialization
      - xapi-lrs-4.1.6.1-statement-consistent-through
      - xapi-lrs-4.1.6.1-statement-last-modified
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
      - id: put-original-statement
        request:
          method: PUT
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000304
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            id: 00000000-0000-4000-8000-000000000304
            actor:
              objectType: Agent
              mbox: mailto:kiva-conformance-datatypes@example.org
            verb:
              id: https://adlnet.gov/expapi/verbs/experienced
            object:
              objectType: Activity
              id: https://example.org/kiva/conformance/activity/duration-precision
            result:
              duration: PT1.231S
            version: 2.0.0
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
      - id: put-equivalent-duration-statement
        request:
          method: PUT
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000304
          headers:
            Content-Type: application/json
            X-Experience-API-Version: 2.0.0
          body:
            id: 00000000-0000-4000-8000-000000000304
            actor:
              objectType: Agent
              mbox: mailto:kiva-conformance-datatypes@example.org
            verb:
              id: https://adlnet.gov/expapi/verbs/experienced
            object:
              objectType: Activity
              id: https://example.org/kiva/conformance/activity/duration-precision
            result:
              duration: PT1.232S
            version: 2.0.0
        expect:
          status: 204
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
          status_in:
            - 409
      - id: get-original-statement
        request:
          method: GET
          path: /statements
          query:
            statementId: 00000000-0000-4000-8000-000000000304
          headers:
            Accept: application/json
            X-Experience-API-Version: 2.0.0
          await_retrieval_ms: 5000
        expect:
          status: 200
          headers:
            X-Experience-API-Version:
              equals: 2.0.0
            X-Experience-API-Consistent-Through:
              iso8601: true
            Last-Modified:
              present: true
          checks:
            - kind: header-time
              header: Last-Modified
              equals_pointer: /stored
            - kind: json-shape
              pointer: /result/duration
              shape:
                type: string
  - id: statement-activity-filter-does-not-use-scheme-based-iri-equivalence
    requirements:
    - xapi-lrs-4.2.7-iri-comparison
    - xapi-lrs-4.1.6.1-statement-consistent-through
    - xapi-lrs-4.1.6.1-statement-last-modified
    - xapi-lrs-4.1.7-version-header-every-response
    - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
    - id: put-statement
      request:
        method: PUT
        path: /statements
        query:
          statementId: 00000000-0000-4000-8000-000000000306
        headers:
          Content-Type: application/json
          X-Experience-API-Version: 2.0.0
        body:
          id: 00000000-0000-4000-8000-000000000306
          actor:
            objectType: Agent
            mbox: mailto:kiva-conformance-datatypes@example.org
          verb:
            id: https://adlnet.gov/expapi/verbs/experienced
          object:
            objectType: Activity
            id: http://example.org:80/kiva/conformance/activity/iri-default-port
          version: 2.0.0
      expect:
        status: 204
        headers:
          X-Experience-API-Version:
            equals: 2.0.0
          X-Experience-API-Consistent-Through:
            iso8601: true
    - id: visible-put-statement-0
      request:
        method: GET
        path: /statements
        query:
          statementId: 00000000-0000-4000-8000-000000000306
        headers:
          X-Experience-API-Version: 2.0.0
        await_retrieval_ms: 5000
      expect:
        status: 200
        headers:
          X-Experience-API-Version:
            equals: 2.0.0
          X-Experience-API-Consistent-Through:
            iso8601: true
        json:
          pointers:
            /id:
              equals: 00000000-0000-4000-8000-000000000306
    - id: get-statements-by-identical-activity-iri
      request:
        method: GET
        path: /statements
        query:
          activity: http://example.org:80/kiva/conformance/activity/iri-default-port
          limit: '10'
        headers:
          Accept: application/json
          X-Experience-API-Version: 2.0.0
        await_retrieval_ms: 5000
      expect:
        status: 200
        headers:
          X-Experience-API-Version:
            equals: 2.0.0
          X-Experience-API-Consistent-Through:
            iso8601: true
        json:
          pointers:
            /statements:
              contains:
                id: 00000000-0000-4000-8000-000000000306
                object:
                  id: http://example.org:80/kiva/conformance/activity/iri-default-port
        checks:
        - kind: header-time
          header: Last-Modified
          max_pointer: /statements
          optional_if_empty: true
        - kind: json-order
          pointer: /statements
          by: stored
          descending: true
    - id: get-statements-by-default-port-normalized-activity-iri
      request:
        method: GET
        path: /statements
        query:
          activity: http://example.org/kiva/conformance/activity/iri-default-port
          limit: '10'
        headers:
          Accept: application/json
          X-Experience-API-Version: 2.0.0
        await_retrieval_ms: 5000
      expect:
        status: 200
        headers:
          X-Experience-API-Version:
            equals: 2.0.0
          X-Experience-API-Consistent-Through:
            iso8601: true
        json:
          pointers:
            /statements:
              not_contains:
                id: 00000000-0000-4000-8000-000000000306
        checks:
        - kind: header-time
          header: Last-Modified
          max_pointer: /statements
          optional_if_empty: true
        - kind: json-order
          pointer: /statements
          by: stored
          descending: true
