suite:
  id: xapi-lrs-statement-query-filter-isolated
  standard: IEEE/ISO/IEC 39274-1-1-2025
  description: Destructive Statement query filter checks for disposable isolated LRS targets.
cases:
  - id: statement-query-filters-agent-verb-activity-registration
    requirements:
    - xapi-lrs-4.1.6.1-statement-query-filters
    - xapi-lrs-4.1.6.1-statement-consistent-through
    - xapi-lrs-4.1.6.1-statement-last-modified
    - xapi-lrs-4.1.7-version-header-every-response
    - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    steps:
    - id: put-matching-statement
      request:
        method: PUT
        path: /statements
        query:
          statementId: 00000000-0000-4000-8000-000000001001
        headers:
          Content-Type: application/json
          X-Experience-API-Version: 2.0.0
        body:
          id: 00000000-0000-4000-8000-000000001001
          actor:
            objectType: Agent
            mbox: mailto:kiva-conformance-query-filter@example.org
          verb:
            id: https://adlnet.gov/expapi/verbs/completed
          object:
            objectType: Activity
            id: https://example.org/kiva/conformance/activity/query-filter-target
          context:
            registration: 10000000-0000-4000-8000-000000000001
          version: 2.0.0
      expect:
        status: 204
        headers:
          X-Experience-API-Version:
            equals: 2.0.0
          X-Experience-API-Consistent-Through:
            iso8601: true
    - id: visible-put-matching-statement-0
      request:
        method: GET
        path: /statements
        query:
          statementId: 00000000-0000-4000-8000-000000001001
        headers:
          X-Experience-API-Version: 2.0.0
        await_retrieval_ms: 5000
      expect:
        status: 200
        headers:
          X-Experience-API-Version:
            equals: 2.0.0
          X-Experience-API-Consistent-Through:
            iso8601: true
        json:
          pointers:
            /id:
              equals: 00000000-0000-4000-8000-000000001001
    - id: put-nonmatching-statement
      request:
        method: PUT
        path: /statements
        query:
          statementId: 00000000-0000-4000-8000-000000001002
        headers:
          Content-Type: application/json
          X-Experience-API-Version: 2.0.0
        body:
          id: 00000000-0000-4000-8000-000000001002
          actor:
            objectType: Agent
            mbox: mailto:kiva-conformance-query-filter-other@example.org
          verb:
            id: https://adlnet.gov/expapi/verbs/completed
          object:
            objectType: Activity
            id: https://example.org/kiva/conformance/activity/query-filter-target
          context:
            registration: 10000000-0000-4000-8000-000000000001
          version: 2.0.0
      expect:
        status: 204
        headers:
          X-Experience-API-Version:
            equals: 2.0.0
          X-Experience-API-Consistent-Through:
            iso8601: true
    - id: visible-put-nonmatching-statement-0
      request:
        method: GET
        path: /statements
        query:
          statementId: 00000000-0000-4000-8000-000000001002
        headers:
          X-Experience-API-Version: 2.0.0
        await_retrieval_ms: 5000
      expect:
        status: 200
        headers:
          X-Experience-API-Version:
            equals: 2.0.0
          X-Experience-API-Consistent-Through:
            iso8601: true
        json:
          pointers:
            /id:
              equals: 00000000-0000-4000-8000-000000001002
    - id: query-combined-filters
      request:
        method: GET
        path: /statements
        query:
          agent: '{"objectType":"Agent","mbox":"mailto:kiva-conformance-query-filter@example.org"}'
          verb: https://adlnet.gov/expapi/verbs/completed
          activity: https://example.org/kiva/conformance/activity/query-filter-target
          registration: 10000000-0000-4000-8000-000000000001
          limit: '10'
        headers:
          Accept: application/json
          X-Experience-API-Version: 2.0.0
        await_retrieval_ms: 5000
      expect:
        status: 200
        headers:
          X-Experience-API-Version:
            equals: 2.0.0
          X-Experience-API-Consistent-Through:
            iso8601: true
        json:
          pointers:
            /statements/0/id:
              equals: 00000000-0000-4000-8000-000000001001
            /statements:
              not_contains:
                id: 00000000-0000-4000-8000-000000001002
        checks:
        - kind: header-time
          header: Last-Modified
          max_pointer: /statements
          optional_if_empty: true
        - kind: json-order
          pointer: /statements
          by: stored
          descending: true
