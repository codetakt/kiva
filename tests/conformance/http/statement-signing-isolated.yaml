      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch
    safety:
      destructive: true
      requires_isolated_lrs: true
    request:
      method: POST
      path: /statements
      headers:
        Content-Type: multipart/mixed; boundary=kiva-conformance-signed-rs256
        X-Experience-API-Version: 2.0.0
      raw_body_crlf_lines:
