suite:
  id: xapi-lrs-statement-signing-isolated
  standard: IEEE/ISO/IEC 39274-1-1-2025
  description: Destructive signed Statement checks for disposable isolated LRS targets.
cases:
  - id: signed-statement-with-rs256-compact-jws-is-accepted
    requirements:
      - xapi-lrs-4.2.6-signed-statement-attachment
      - xapi-lrs-4.2.6-jws-compact
      - xapi-lrs-4.2.6-jws-payload
      - xapi-lrs-4.2.6-jws-algorithm
