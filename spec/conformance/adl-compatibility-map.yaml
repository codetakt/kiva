  - id: adl-v2-0-context-revision-platform-object-scope-obsolete
    relationship: obsolete
    rationale: >
      ADL v2.0 treats context.revision and context.platform as invalid when the
      Statement object is not an Activity. IEEE/ISO/IEC 39274-1-1-2025
      clause 4.2.2.5 defines both properties as optional Strings in the Context
      table, and clause 4.2.4.2's LRS-specific rejection requirements do not
      include this object-scope rejection. Kiva therefore enforces the IEEE
      type requirements without adding the obsolete ADL object-scope rule.
    adl_sources:
      - path: test/v2_0/4.2.2.5-Context-Requirements.js
      - path: test/v2_0/configs/contexts.js
    kiva_requirements:
      - xapi-lrs-4.2.2.5-context-properties

