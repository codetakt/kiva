  - id: adl-v2-0-basic-auth-assumption-obsolete
    relationship: obsolete
    rationale: >
      ADL v2.0's Axios request helper injects HTTP Basic credentials into many
      resource tests even when the console runner is not invoked with
      --basicAuth. IEEE/ISO/IEC 39274-1-1-2025 keeps the Authorization header
      but does not define HTTP Basic as a required authentication mechanism.
      Kiva therefore treats those injected Basic credentials as an obsolete ADL
      harness assumption rather than a normative IEEE requirement. This entry
      is retained as historical classification evidence. Its expectation-ledger
      references were retired after the opt-in ADL compatibility translation
      allowed the affected resource assertions to execute successfully.
    adl_sources:
      - path: test/v2_0/util/requests.js
      - path: test/v2_0/H.Communication4.0-Authentication.js
    kiva_requirements:
      - xapi-lrs-4.1.5-unauthorized
      - xapi-lrs-4.1.8-authorization-decisions

  - id: adl-v2-0-legacy-oauth-authority-shape-obsolete
    relationship: obsolete
    rationale: >
      ADL requires an OAuth-era authority Group to be anonymous and to contain
      exactly two OAuth Agents. IEEE/ISO/IEC 39274-1-1-2025 clause 4.2.4.2
      instead says that the LRS "should overwrite the authority on all
      Statements it stores" and "shall apply a deterministic process" when it
      does so; it does not retain the legacy two-member OAuth Group rule. Kiva
      validates authority as the Agent or Group type defined by clause 4.2.2.1
      and then applies its deterministic credential projection.
    adl_sources:
      - path: test/v2_0/4.2.4.2-Authority-Requirements.js
      - path: test/v2_0/configs/authorities.js
    kiva_requirements:
      - xapi-lrs-4.2.4.2-authority-present
      - xapi-lrs-4.2.4.2-authority-deterministic

  - id: adl-v2-0-legacy-statement-version-rejection-obsolete
    relationship: obsolete
    rationale: >
      ADL rejects syntactically valid Semantic Versioning values outside the
      1.0 family, including 0.9.9 and 1.1.0.
      IEEE/ISO/IEC 39274-1-1-2025 clause 4.2.4.2 says an LRS "should not reject
      a Statement that is otherwise valid except the version", and clause
      4.2.4.3 requires returned Statements to retain an accepted version. Kiva
      follows those IEEE rules instead of the legacy 1.0-only rejection. This
      mapping does not cover malformed values, which Kiva rejects under the
      Semantic Versioning format requirement in clauses 4.2.1 and 4.2.2.
    adl_sources:
      - path: test/v2_0/4.2.4.3-Version-Requirements.js
    kiva_requirements:
      - xapi-lrs-4.2.2-statement-version-format
      - xapi-lrs-4.2.4.3-version-retention

  - id: adl-v2-0-legacy-two-component-version-obsolete
    relationship: obsolete
    rationale: >
      ADL accepts the legacy two-component Statement version value 1.0.
      IEEE/ISO/IEC 39274-1-1-2025 clauses 4.2.1 and 4.2.2 instead require the
      Version property to follow Semantic Versioning 1.0.0 format, whose normal
      version form contains major, minor, and patch components. Kiva therefore
      rejects 1.0 as malformed while accepting syntactically valid versions
      outside ADL's legacy 1.0 family under clauses 4.2.4.2 and 4.2.4.3.
    adl_sources:
      - path: test/v2_0/4.2.4.3-Version-Requirements.js
      - path: test/v2_0/configs/version.js
    kiva_requirements:
      - xapi-lrs-4.2.2-statement-version-format
      - xapi-lrs-4.2.4.3-version-retention

  - id: adl-v2-0-missing-version-header-legacy-obsolete
    relationship: obsolete
    rationale: >
      ADL accepts legacy 0.9/0.95 response behavior when a request omits the
      version header. IEEE/ISO/IEC 39274-1-1-2025 clause 4.1.7 instead requires
      the LRS to "include the X-Experience-API-Version header in every
      response" and defines the supported 2.0 boundaries without prescribing
      a legacy response version for an omitted request header. Kiva responds
      using 2.0.0 and does not emulate pre-2.0 behavior.
    adl_sources:
      - path: test/v2_0/H.Communication3.3-Versioning.js
      - path: test/v2_0/4.1.6.7-About-Resource.js
    kiva_requirements:
      - xapi-lrs-4.1.7-version-header-every-response
      - xapi-lrs-4.1.7-version-header-latest-patch

  - id: adl-v2-0-duration-truncation-optional
    relationship: absent
    rationale: >
      The ADL assertion requires observable truncation beyond 0.01 second.
      IEEE/ISO/IEC 39274-1-1-2025 clause 4.2.7 says the LRS "may truncate" that
      precision and only mandates that it not reject the request and ignore
      excess precision during comparison. Kiva preserves the accepted value,
      so mandatory truncation is absent from the IEEE requirement set.
    adl_sources:
      - path: test/v2_0/4.2.7-Additional-Requirements-for-Data-Types.js
    kiva_requirements:
      - xapi-lrs-4.2.7-duration-format

  - id: adl-v2-0-iri-normalization-choice
    relationship: absent
    rationale: >
      The ADL assertion assumes syntax-based IRI normalization.
      IEEE/ISO/IEC 39274-1-1-2025 clause 4.2.7 permits "one or more" of RFC
      3987 section 5.3.1 simple string comparison and section 5.3.2
      syntax-based normalization. Kiva uses the permitted simple string
      comparison, so the normalization-only assertion is not equivalent.
    adl_sources:
      - path: test/v2_0/4.2.7-Additional-Requirements-for-Data-Types.js
    kiva_requirements:
      - xapi-lrs-4.2.7-iri-comparison

  - id: adl-v2-0-raw-attachment-fixture-length-mismatch
    relationship: obsolete
    rationale: >
      The pinned ADL fixture hashes a hexadecimal text representation of its
      JPEG while declaring the binary file byte length, so its multipart body
      and Attachment metadata disagree. IEEE/ISO/IEC 39274-1-1-2025 clause
      4.2.2.6 defines length as "the length of the Attachment data in octets",
      and clauses 4.1.3 and 4.2.2.6 require the body to match its metadata. Kiva
      therefore rejects this inconsistent fixture rather than weakening its
      attachment integrity checks.
    adl_sources:
      - path: test/v2_0/4.1.3-Content-Types.js
    kiva_requirements:
      - xapi-lrs-4.1.3-attachment-sha2-match
      - xapi-lrs-4.1.3-attachment-header-property-match

