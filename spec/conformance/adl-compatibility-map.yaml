schema_version: 1
standard: IEEE/ISO/IEC 39274-1-1-2025
requirement_catalog: spec/requirements/ieee-39274-1-1-2025.yaml
title: ADL xAPI LRS Conformance Test Suite compatibility map
notes:
  - >
    This map treats ADL's xAPI 2.0 LRS Conformance Test Suite as an external
    compatibility gate, not as normative evidence for an
    IEEE/ISO/IEC 39274-1-1-2025 conformance claim.
  - >
    Relationship values are intentionally conservative. partial means ADL has
    useful related coverage but does not fully discharge the Kiva requirement
    catalog entry.

adl_suite:
  id: adl-lrs-conformance-test-suite-v2-0
  upstream: https://github.com/adlnet/lrs-conformance-test-suite
  local_reference: /home/claude/Codex/github.com/adlnet/lrs-conformance-test-suite
  test_root: test/v2_0
  role: external-compatibility-gate
  license: MIT

