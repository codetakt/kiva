schema_version: 1
standard: IEEE/ISO/IEC 39274-1-1-2025
source:
  repository: xapi-base-standard-documentation
  document: 9274.1.1 xAPI Base Standard for LRSs.md
notes:
  - >
    This file classifies IEEE xAPI LRS source clauses that do not have a
    one-to-one row in Kiva's requirement catalog. It prevents parent,
    explanatory, recommendation, and delegated data-model sections from being
    mistaken for unreviewed gaps.
  - >
    The requirement catalog remains clause-indexed and paraphrased; this triage
    does not copy restricted standard text.

triage:
  - clause: "4"
    classification: parent-section
    rationale: Top-level LRS scope section; concrete LRS requirements are covered by child clauses.
    covered_by:
      - spec/requirements/ieee-39274-1-1-2025.yaml
  - clause: "4.1"
    classification: parent-section
    rationale: Communication parent section; concrete HTTP requirements are covered by 4.1.1 through 4.1.8.
    covered_by:
      - spec/requirements/ieee-39274-1-1-2025.yaml
      - spec/openapi/kiva-xapi.yaml
  - clause: "4.1.9"
    classification: security-guidance
    rationale: Security is implementation-specific guidance and explicitly outside the core xAPI LRS interface conformance claim.
    covered_by:
      - docs/architecture/conformance-claim.md
      - docs/architecture/postgres-persistence.md
  - clause: "4.2.2"
    classification: data-model-subsection
    rationale: Statement table requirements are discharged through LRS processing, validation, storage, and retrieval requirements in 4.2 and 4.2.4.x rows.
    covered_by:
      - xapi-lrs-4.2-statement-immutability-preserve
      - xapi-lrs-4.2.1-statement-type-validation
      - xapi-lrs-4.2.4.2-return-serialization
  - clause: "4.2.2.1"
    classification: data-model-subsection
    rationale: Actor object shape is validated through LRS Statement rejection and authority processing rows rather than a separate standalone clause row.
    covered_by:
      - xapi-lrs-4.2.1-statement-type-validation
      - xapi-lrs-4.2.4.2-actor-single-ifi
      - xapi-lrs-4.2.4.2-no-group-member-group
      - xapi-lrs-4.2.4.2-authority-present
  - clause: "4.2.2.2"
    classification: data-model-subsection
    rationale: Verb object shape is covered by generic Statement validation, IRI comparison, and language-map requirements.
    covered_by:
      - xapi-lrs-4.2.1-statement-type-validation
      - xapi-lrs-4.2.7-iri-comparison
      - xapi-lrs-4.2.7-language-tags
  - clause: "4.2.2.4"
    classification: data-model-subsection
    rationale: Result object shape is covered by generic Statement validation, number precision, duration, and extension-value requirements.
    covered_by:
      - xapi-lrs-4.2.1-statement-type-validation
      - xapi-lrs-4.2.4.2-number-precision
      - xapi-lrs-4.2.7-duration-format
      - xapi-lrs-4.2.7-extension-values
  - clause: "4.2.2.5"
    classification: data-model-subsection
    rationale: Context object behavior is covered by context activity normalization, related-agent/activity query behavior, and generic validation rows.
    covered_by:
      - xapi-lrs-4.1.6.1-statement-query-related-agents
      - xapi-lrs-4.1.6.1-statement-query-related-activities
      - xapi-lrs-4.2.4.2-context-activities-array
      - xapi-lrs-4.2.7-extension-values
  - clause: "4.2.2.6"
    classification: data-model-subsection
    rationale: Attachment object shape is covered by attachment transmission, hashing, multipart, retrieval, and signing rows.
    covered_by:
      - xapi-lrs-4.1.3-attachment-sha2-match
      - xapi-lrs-4.1.3-attachment-transmission-criteria
      - xapi-lrs-4.1.3-multipart-attachment-headers
      - xapi-lrs-4.1.6.1-statement-get-attachments-true
      - xapi-lrs-4.2.6-signed-statement-attachment
  - clause: "4.2.3"
    classification: non-normative-guidance
    rationale: Metadata discussion is explanatory for hosted metadata and does not define a required LRS resource beyond the interface and data processing rows.
    covered_by:
      - docs/architecture/conformance-claim.md
  - clause: "4.2.3.1"
    classification: recommendation
    rationale: LRS metadata recommendations are should/may guidance and are outside the mandatory xAPI LRS conformance claim.
    covered_by:
      - docs/architecture/conformance-claim.md
  - clause: "4.2.4"
    classification: composite-processing-section
    rationale: LRS processing parent section; concrete rejection, normalization, authority, version, and response recommendations are covered by 4.2.4.x rows.
    covered_by:
      - xapi-lrs-4.2.4.1-voided-target-missing-not-rejected
      - xapi-lrs-4.2.4.2-return-serialization
      - xapi-lrs-4.2.4.3-version-retention
