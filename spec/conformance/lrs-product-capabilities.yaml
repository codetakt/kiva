schema_version: 1
requirements_baseline: IEEE Std 9274.1.1-2023
international_adoption:
  designation: ISO/IEC/IEEE 39274-1-1:2025
  source: https://standards.ieee.org/ieee/39274-1-1/12268/
  relationship: Adoption of 9274.1.1-2023
purpose: Positive implementation gates for useful recommended and optional LRS capabilities.
boundaries:
- Existing adopted IEEE cases and procedure expectations remain unchanged.
- A capability requires execution on memory and PostgreSQL with its enabling configuration.
- Advisory observations, an unavailable fixture, a disabled feature or an external peer cannot pass a product capability.
- Choices that reduce information, such as optional precision truncation, need not be enabled to support full-fidelity
  storage.
- Both live and snapshot pagination are product choices; every enabled mode must preserve current authorization
  and void suppression.
- Statement signer, global identity provider and arbitrary third-party document formats are not universal LRS roles.
capabilities:
- id: negotiated-errors
  rules:
  - IP-error-negotiation
  - IP-error-format-text-plain
  - IP-error-format-text-html
  - IP-error-format-application-json
  - IP-error-explanation
  required: true
  fixtures:
  - memory
  - postgres
  procedure:
  - Trigger real protocol, authentication, validation, conflict, size/rate and storage errors.
  - Request plain, HTML and JSON with preference weights, exclusions and fallback.
  - Check the selected representation, the actual cause, required status/headers, HEAD and HTML escaping.
  native_controls:
  - kiva-server::tests::xapi_capabilities::{backend}_xapi_product_error_negotiation
  implementation:
  - crates/kiva-server/src/surfaces/xapi/error_representation.rs
- id: canonical-inventory
  rules:
  - IP-canonical-update-authority
  - IP-canonical-small-corrections
  - IP-canonical-major-changes
  - IP-canonical-map-maintenance
  - IP-format-canonical
  required: true
  procedure:
  - Declare independent canonical inventory and providers allowed to correct it.
  - Admit authorized and unauthorized competing definitions in sequential and concurrent requests.
  - Check small corrections and missing-language additions while preserving major semantics and extension-owned
    values.
  - Compare Activities and canonical Statement responses; exact Statements and original signature bytes remain unchanged.
  - Combine individually valid but incompatible interaction definitions, including partial pattern/component updates.
    Preserve coherent established interaction fields and independent language additions in both the default Activities
    projection and the enabled canonical inventory; exact Statements retain each submitted definition.
  - For compatible component lists, match descriptions by component ID, preserve order and established translations,
    and add missing languages or descriptions in choices, scale, source, target and steps, including reordered input.
  fixtures:
  - memory
  - postgres
  native_controls:
  - kiva-server::tests::xapi_capabilities::metadata::{backend}_xapi_product_canonical_and_authority
  implementation:
  - crates/kiva-server/src/surfaces/xapi/capabilities/canonical.rs
- id: resolvable-metadata
  rules:
  - IP-metadata-fetch
  - IP-metadata-incorporate
  - IP-metadata-other-document
  required: true
  procedure:
  - Use a controlled allowlisted HTTP host serving JSON and an HTML document with an embedded Activity Definition.
  - Observe first-encounter request timing and Accept; verify incorporation and preservation of omitted information.
  - Exercise invalid data, failure, redirects, retries, concurrency and persisted retrieval after restart.
  - Enable fetching after initial admission and verify PUT/POST replays leave metadata work and definitions unchanged; mixed batches schedule only new Statements.
  fixtures:
  - memory
  - postgres
  native_controls:
  - kiva-server::tests::xapi_capabilities::fetch::{backend}_xapi_product_metadata_fetch
  - kiva-server::tests::xapi_capabilities::replay::{backend}_xapi_replay_does_not_schedule_metadata
  implementation:
  - crates/kiva-server/src/surfaces/xapi/capabilities/fetch.rs
- id: metadata-host
  rules:
  - IP-hosted-metadata-optional
  - IP-hosted-metadata-canonical
  required: true
  procedure:
  - Publish an authorized definition and retrieve it from the actual Activity identifier URL.
  - Check access, concurrency preconditions, canonical source semantics and restart persistence.
  - Reject partial updates that conflict with established interaction components without changing the body or ETag;
    accept compatible additions and avoid mixing conflicting Statement interaction fields into hosted owner metadata.
  fixtures:
  - memory
  - postgres
  native_controls:
  - kiva-server::tests::xapi_capabilities::metadata::{backend}_xapi_product_host_and_person_directory
  - kiva-server::tests::xapi_capabilities::durability::{backend}_xapi_product_metadata_concurrency
  implementation:
  - crates/kiva-server/src/surfaces/xapi/capabilities/host.rs
- id: mailbox-hash-query
  rules:
  - IP-mbox-hash-query
  required: true
  procedure:
  - Store plain and corresponding hashed mailbox Actors, Objects and Group members.
  - Query by mailbox, including related-agent and StatementRef paths, with positive and unrelated negative controls.
  - Keep permission filtering, page completeness and IFI identity distinctions.
  fixtures:
  - memory
  - postgres
  native_controls:
  - kiva-server::tests::xapi_capabilities::queries::{backend}_xapi_product_queries
  implementation:
  - crates/kiva-server/src/surfaces/xapi/request/filtering.rs
- id: trusted-authority
  rules:
  - IP-authority-trust
  - IP-authority-trust-caution
  - IP-authority-overwrite
  required: true
  procedure:
  - Configure trusted and untrusted authenticated providers before admission.
  - Preserve distinct valid supplied authorities only for a trusted provider; overwrite elsewhere.
  - Preserve normal verification, batch atomicity, signatures and immutable replay.
  fixtures:
  - memory
  - postgres
  native_controls:
  - kiva-server::tests::xapi_capabilities::metadata::{backend}_xapi_product_canonical_and_authority
  implementation:
  - crates/kiva-server/src/surfaces/xapi/capabilities.rs
- id: interaction-validation
  rules:
  - IP-interaction-remaining
  - IP-characterstring-validation
  required: true
  procedure:
  - Enable detailed interaction validation and exercise every interaction kind at root and SubStatement placements.
  - Validate pattern/component relationships; keep characterstring parameters uninterpreted.
  - Rejected batches store nothing; accepted data is preserved exactly.
  fixtures:
  - memory
  - postgres
  native_controls:
  - kiva-server::tests::xapi_capabilities::interactions::{backend}_xapi_product_interactions
  implementation:
  - crates/kiva-server/src/surfaces/xapi/capabilities/interaction.rs
- id: person-enrichment
  rules:
  - IP-person-multiple-identifiers
  - IP-person-fallback
  - IP-person-array-members
  required: true
  procedure:
  - Establish associations independently using an authorized directory writer.
  - Retrieve multiple associated values through all four IFI kinds; keep complete Account pairs.
  - Check association removal, conflicts, unrelated-person isolation and restart persistence.
  fixtures:
  - memory
  - postgres
  native_controls:
  - kiva-server::tests::xapi_capabilities::metadata::{backend}_xapi_product_host_and_person_directory
  - kiva-server::tests::xapi_capabilities::durability::{backend}_xapi_product_metadata_concurrency
  implementation:
  - crates/kiva-server/src/surfaces/xapi/capabilities/people.rs
- id: void-metadata-rollback
  rules:
  - IP-void-rollback
  required: true
  procedure:
  - Introduce Activity and Agent metadata from independently identified Statement contributions.
  - Void a contributor and verify reconstruction from surviving sources without undoing unrelated corrections.
  - Keep original Statements retrievable through voidedStatementId and preserve their exact bytes and attachments.
  - Exercise rollback enabled and disabled with canonical inventory enabled and disabled; reconstruct Activities and opaque extension values from surviving contributions in Object, SubStatement and Context roles.
  fixtures:
  - memory
  - postgres
  native_controls:
  - kiva-server::tests::xapi_capabilities::metadata::{backend}_xapi_product_canonical_and_authority
  - kiva-server::tests::xapi_capabilities::metadata::{backend}_xapi_product_host_and_person_directory
  implementation:
  - crates/kiva-server/src/surfaces/xapi/capabilities/canonical.rs
  - crates/kiva-server/src/surfaces/xapi/capabilities/people.rs
  - crates/kiva-server/src/surfaces/xapi/handlers/agents_activities.rs
- id: pagination-modes
  rules:
  - IP-more-self-contained
  - IP-more-length
  - IP-more-rerun
  - IP-more-cache
  - IP-more-cache-voids
  required: true
  procedure:
  - Exercise live and snapshot modes while adding and voiding Statements between pages.
  - Use long valid filters and verify bounded continuation URLs and complete ordered pages.
  - Reauthenticate every continuation and check permission changes, expiry, foreign tokens and restart behavior.
  - Enable self-contained live links for short filters and require bounded token fallback for long filters.
  fixtures:
  - memory
  - postgres
  native_controls:
  - kiva-server::tests::xapi_capabilities::queries::{backend}_xapi_product_queries
  - kiva-server::tests::xapi_capabilities::durability::{backend}_xapi_product_metadata_concurrency
  implementation:
  - crates/kiva-server/src/surfaces/xapi/request/pagination.rs
- id: extension-namespace
  rules:
  - IP-additional-resources
  - IP-extension-namespace
  - IP-about-extensions
  required: true
  procedure:
  - Inventory all standard and additional resource routes and their public base URLs.
  - Verify extensions locations, documented compatibility aliases and truthful About capability metadata.
  fixtures:
  - memory
  - postgres
  native_controls:
  - kiva-server::tests::xapi_capabilities::queries::{backend}_xapi_product_queries
  implementation:
  - crates/kiva-server/src/surfaces/xapi/routes.rs
  - crates/kiva-server/src/surfaces/xapi/handlers/about.rs
  - crates/kiva-server/src/lib.rs
