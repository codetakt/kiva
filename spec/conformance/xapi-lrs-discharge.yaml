standard: IEEE/ISO/IEC 39274-1-1-2025
requirement_catalog: spec/requirements/ieee-39274-1-1-2025.yaml
status: active-evidence-plan
incubation:
  current_repository_role: incubator-and-reference-consumer
  eventual_repository: ieee-39274-1-1-xapi-lrs-conformance-aid
  dependency_direction: kiva-depends-on-aid
  split_boundary:
    move_to_conformance_aid:
      - IEEE requirement catalog
      - Generic xAPI LRS black-box HTTP tests
      - Generic fixtures and expected results
      - Test runner and report schemas
      - Authentication adapters
      - ADL compatibility mapping
    keep_in_kiva:
      - Kiva implementation code
      - Kiva CI adapter and pinned aid version
      - Kiva-specific PDS, BI, governance, OAuth/OIDC policy, and confidential-computation tests
notes:
  - >
    This file assigns every cataloged xAPI LRS requirement to at least one
    discharge mechanism. Planned entries are not conformance evidence yet.
  - >
    ADL tests are useful external compatibility checks, but Kiva's conformance
    claim is based on the pinned public LRS source and source-bound evidence.

external_suites:
  - id: adl-lrs-conformance-test-suite
    role: external-compatibility-gate
    upstream: https://github.com/adlnet/lrs-conformance-test-suite
    local_path: /home/claude/Codex/github.com/adlnet/lrs-conformance-test-suite
    observed_commit: 5bc232d349c60faded8240da698f195106091638
    package_version: 2.0.0-1
    license: MIT
    supported_xapi_versions:
      - 1.0.3
      - 2.0.0
    command_template: >
      node bin/console_runner.js --xapiVersion 2.0.0 --endpoint <endpoint>
      --basicAuth --authUser <user> --authPass <password>
    limitations:
      - The suite is an ADL implementation, not the IEEE standard itself.
      - It is destructive and should not run against a production LRS endpoint.
      - It primarily exercises Basic Auth and OAuth 1 runner modes, not Kiva's OAuth/OIDC bearer-token boundary.
      - It does not cover Kiva PDS, BI, confidential-computation, or public-sector separation-of-authority requirements.

