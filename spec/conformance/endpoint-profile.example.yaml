  signature-validation-context:
    signature:
      evidence: Kiva verifies original RS256/384/512 bytes, typed x5c paths against the independently
        configured synthetic anchor and certificate/issuer/time-bound out-of-band status, and payload
        structure/equivalence. The disposable fixture uses tests/conformance/controls/kiva_certificate_policy.json
        and tests/conformance/fixtures/signing/cases.json. No live PKI or production trust is claimed;
        no-x5c unknown keys are structurally admitted with crypto not-evaluated under D-10=A.
      algorithms:
      - RS256
      - RS384
      - RS512
      certificate_signature: verify-supplied-x5c
      without_certificate: accept-without-cryptographic-verification
  declared-resource-absence:
