    - 38
    pdf_pages:
    - 38
    - 39
  - clause: 4.2.4.1
    printed_page: 48
    pdf_page: 49
  actor: LRS
  action: Reject malformed formatted identifiers while applying the permitted validation boundary
  source_strength: shall reject invalid IRIs / non-format-following values; may choose not to validate
    IRIs/UUIDs
  source_fact: Both provisions are present; the permission is qualified by responsibility for data format,
    not values
  judgment: Syntax is mandatory; resolution/existence checks are optional. This is an author interpretation
  test_impact: Keep syntactic IRI/UUID rejection vectors; no expectation change
  resolution: Published PDF does not explicitly adjudicate the boundary
