    - 315
  actor: LRS
  action: Expand an activity query filter when related_activities is true
  source_strength: GET parameter table requirements
  source_fact: Chapter 4 repeats Agent-filter prose. PDF 5.1.6.1 gives the Activity-filter definition
    and 5.1 declares these tables redundant with chapter 4. The pinned public text also contains the Activity-filter
    definition.
  judgment: Read chapter 4 through the redundant chapter 5 Activity row. This current PDF-based route
    supersedes the original public-correction adoption.
  test_impact: Existing related-activity filter cases already use the correction; no expectation change
  resolution: In-scope PDF reading; no external overlay required. Official adjudication is not claimed.
