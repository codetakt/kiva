  action: Accept Statement requests in supported media types
  source_strength: shall accept batches in media-type clauses; single Statement in PUT summary/body
  source_fact: Both the batch acceptance language and the single PUT definition are present
  judgment: 'Apply specific PUT definition: single PUT and batch POST; PUT batch acceptance remains an
    interpretation issue'
  test_impact: Keep current request-body fixtures; no expectation change
  resolution: Not resolved by the published PDF
- id: case-equivalence-and-iri-comparison
  classification: comparison-scope-interpretation
  anchors:
  - clause: '4.2'
    printed_page: 37
    pdf_page: 38
  - clause: 4.2.7.1
    printed_page: 51
    pdf_page: 52
  actor: LRS
  action: Compare logical Statements and IRI identifiers under their respective provisions
  source_strength: shall exclude Case from Statement equivalence; shall only use allowed RFC 3987 strategies
    for IRIs
  source_fact: Both provisions are present without an explicit explanation of their intersecting scopes
  judgment: Keep current signed-Statement mbox case vector; do not derive unrestricted lowercasing of
    all IRIs
  test_impact: Existing signature case retained; full IRI strategy procedure remains open
  resolution: Not adjudicated by the published PDF
