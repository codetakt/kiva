findings:
- id: state-list-selectors
  classification: literal-table-conflict
  anchors:
  - clause: 4.1.6.2
    printed_page: 27
    pdf_page: 28
  - clause: 4.1.6.2.5
    printed_page: 29
    pdf_page: 30
  actor: LRS
  action: Select a single State document or list State ids based on stateId presence
  source_strength: Resource narrative and table requirements under 4.1 / 4.1.6
  source_fact: The multiple-GET row prohibits stateId in Description but requires it unless since is present
    in Required; narrative says omission returns ids
  judgment: Follow resource narrative; omit stateId for list GET
  test_impact: Keep existing state list cases; no expectation change
  resolution: Not resolved by the published PDF
