    printed_page: 35
    pdf_page: 36
  actor: LRS
  action: List Activity Profile ids for an Activity
  source_strength: Resource summary and table requirements
  source_fact: The Activity list table requires agent; resource scope and other method tables use activityId
  judgment: Use activityId as the Activity Profile list selector
  test_impact: Keep existing Activity Profile list cases; no expectation change
  resolution: Not resolved by the published PDF
- id: formatted-identifiers
  classification: interpretation-of-format-versus-value
