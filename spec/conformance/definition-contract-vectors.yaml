    - RRF-03-S02
    - RRF-03-S03
    - RRF-03-boundary-BNF
    review_finding: RRF-03
  - id: rrf07-sha224-full-output
    input: 'Transcribed FIPS180-2 Change Notice 1 example: raw ASCII abc = hex 616263, length 3, full SHA-224 23097d223405d8228642a477bda255b32aadbce4bda0b3f7e36c9da7.
      Metadata and X-Experience-API-Hash match. Test JSON/fileUrl preservation and multipart/no-fileUrl admission/readback
      separately. Negative pairs: raw abd with same hash; abc with first hash digit changed to 3; abc with declared
