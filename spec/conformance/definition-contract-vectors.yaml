  DC-MIME:
  - id: type-and-parameters
    clauses:
    - 1
    - 2
    - 3
    input: multipart/mixed and Application/JSON case variants; boundary quoted/token/escaped with significant case,
      lengths 1/70, permitted punctuation; nested comments and legal folded headers; parameter order, charset case
      and case-sensitive unknown values.
    allowed: Equivalent media types and parameters compare semantically. Boundary bytes retain case. Legal folding/comments
      belong to headers only.
    forbidden: Raw string equality for media types; folding/comments in boundary delimiters; missing/empty/too-long/trailing-space
      boundary; merging comments into arbitrary tokens.
  - id: framing-and-raw
    clauses:
    - 4
    - 7
    input: Preamble/epilogue, transport padding, raw attachment ending in CRLF, binary non-ASCII, nested multipart
      as a single raw attachment and an outer delimiter interrupting inner structure.
    allowed: Preserve every raw octet except framing CRLF; identify outer boundaries and retain nested attachment
      as one byte sequence for its hash.
    forbidden: Flattening nested MIME into xAPI attachment entries; removing an attachment's own trailing CRLF;
      applying SMTP 7-bit limits or MIME encoded-word rendering.
  - id: first-and-additional-headers
    clauses:
    - 5
    input: First part explicit application/json, explicit text/plain and missing type; additional part Content-Type
      present/absent, Content-Transfer-Encoding binary/absent, in receiver and producer/output roles separately.
    allowed: First type explicitly JSON; optional additional Content-Type absence is advisory, and metadata match
      is conditional on both values. LRS receiver binary-default SHOULD is not output's required binary header.
    forbidden: Inferring first JSON type solely from body bytes; promoting every recommended attachment header into
      mandatory receiver rejection.
  - id: hash-and-completeness
    clauses:
    - 6
    input: SHA-224/256/384/512 raw parts, shared hash across metadata, distinct missing raw part with/without fileUrl,
      wrong raw octets/length/hash, attachments=true/false and metadata order variants.
    allowed: Required returned raw complete and byte-correct; match by hash; D-09 metadata ordering policy is separate
      from mandatory raw preservation.
    forbidden: Missing required raw data hidden by comparison exclusions; ASCII character count substituted for
      octet length; requiring raw MIME part order to equal metadata order.
  - id: dcr03-structured-cte
    clauses:
    - 2
    - 3
    - 5
    input: 'Otherwise valid returned multipart with Content-Transfer-Encoding: binary (raw octets), BiNaRy, nested/escaped
      comments, legal folded whitespace; compare non-binary token, quoted mechanism, malformed comment and two-token
      controls.'
    allowed: One case-insensitive binary mechanism token with ignored legal comments and unfolded field whitespace.
      Preserve required output header, independent hash/length/raw framing and first-part application/json checks.
    forbidden: Rejecting a valid comment by raw string equality; admitting a non-binary mechanism or arbitrary trailing
      token; weakening sender/output requirements to the receiver SHOULD assumption.
  - id: rrf02-header-lexical-pairs
    input: 'Single-fault pairs: binary (raw octets), BINARY (nested (note)), binary (escaped \) note), legal CRLF+HTAB
      folding versus binary (日本語), binary (a<bare CR>b), bare LF continuation, orphan continuation, unmatched comment,
      extra token and quoted mechanism. Repeat comment/physical-line probes in Content-Type.'
    allowed: Legal structured comments/case/quoted-pair and CRLF folding are accepted by the oracle. Each independently
      invalid header grammar is FAIL before removal. Non-ASCII attachment body remains valid; only headers have
      ASCII constraint.
    forbidden: Deleting invalid header octets or normalizing bare CR/LF to make them valid; suppressing first JSON
      type, required CTE/hash or independent raw/length checks.
    source_anchor_ids:
    - RRF-02-S01
    - RRF-02-S02
    - RRF-02-S03
    - RRF-02-S04
    review_finding: RRF-02
  - id: rrf03-boundary-partitions
    input: Positive outer boundary independent-mime-vector-outer with raw line --independent-mime-vector-not-a-delimiter.
      Negative same raw with outer boundary independent-mime-vector. Header boundaries "bad@boundary", "ends ",
      71 copies of a, and legal quoted "good:boundary"; correct body delimiters for each. Include transport padding,
      preamble/epilogue and raw own trailing CRLF.
    allowed: Positive raw line is not a chosen-boundary prefix and is preserved. Reject malformed response boundary
