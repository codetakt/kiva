schema_version: 1
scope: Authored abstract inputs and oracles; no keys, certificates, environments or execution receipts are constructed.
contracts:
  DC-TIME:
  - id: offset-instant
    input: Root and SubStatement timestamp 2025-01-01T09:00:00.123456+09:00; independent ISO provider supplies validity
      and exact instant.
    allowed: UTC equivalent at full precision, or truncation/rounding to at least three fractional second digits,
      including basic ISO spelling if valid under the provider contract.
    forbidden: 2025-01-01T00:00:00+09:00; unchanged nonzero offset; 2025-01-01T00:00:00.12Z; substring equality
      as the sole oracle.
  - id: combined-date-time
    input: Consistent-Through on success and error responses; date-only 2025-01-01, a valid combined value, invalid
      calendar values and provider-supported leap/end-of-day forms separately.
    allowed: Only provider-valid combined date/time; missing grammar capability yields incomplete execution, never
      automatic valid/invalid.
    forbidden: Treating a date-only value as midnight; converting parser rejection of an unsupported valid form
      into an IEEE failure.
  - id: recording-and-default
    input: Controlled recording instant R distinct from producer instant T; root timestamp missing/present, stored
      missing/spoofed; repeat with SubStatement timestamp missing/present.
    allowed: LRS stored corresponds to R, root missing timestamp equals stored, supplied timestamp follows the precision
      relation. Nested missing timestamp is populated; D-07 chooses its instant only for Kiva.
    forbidden: Producer-supplied stored surviving overwrite; missing root default; invented nested stored; treating
      should-validate as a new mandatory rejection.
  - id: fractional-boundaries
    input: Values before/after epoch and whole-second carry; fractions .123456, .123500, .999999 and digits beyond
      nanoseconds; independent decimal instant relation.
    allowed: Exact or truncation/rounding at declared precision at least milliseconds; both adjacent choices at
      an exact rounding tie; trailing zero spelling does not change the instant.
    forbidden: Floating-point or nanosecond parsing inventing equality between distinct finer timestamps; rounding
      to less than millisecond precision.
  - id: dcr01-lossless-ordering
    input: since=2025-01-01T00:00:00.0000000001Z and returned stored=.0000000002Z in the same second; reverse the
      pair for JsonOrder; repeat across epoch, offsets and whole-second carry.
    allowed: The later instant satisfies exclusive since; inclusive until and ascending/descending order use the
      same exact seconds-and-fraction relation. HTTP-date comparison intentionally retains only whole seconds.
    forbidden: Nanosecond or microsecond truncation making distinct instants equal, accepting reversed ordering,
      or rejecting the later since result.
  - id: dcr01-partial-executor-time
    input: An invisible Statement stored at 1969-12-31T23:59:59Z and Consistent-Through=1969-12-31T23:59:59.0000001Z;
      separately, an omission acceptance response with date-only stored/timestamp; valid provider-supported forms
      beyond the bounded parser are separate inputs.
    allowed: The watermark crossing the hidden record fails its safety subcondition; date-only fails the combined-time
      field requirement. An unsupported valid representation is incomplete execution, not an invalid representation.
    forbidden: Passing the hidden-record check after truncation; passing date-only added fields; converting PrimitiveUnavailable
      to failed.
  - id: fd01-required-header-before-provider
    input: Nonempty StatementResult with a valid ordinary stored and separately valid provider-supported leap-second
      stored 2016-12-31T23:59:60Z; omit mandatory Last-Modified in each.
    allowed: 'FAIL in both cases: the required header is absent independently of temporal comparison.'
    forbidden: Turning the leap-second variant into NOT-RUN before checking header presence.
  - id: fd01-header-syntax-before-provider
    input: Nonempty StatementResult with unsupported valid stored; Last-Modified is independently malformed as an
      HTTP-date.
    allowed: FAIL for the decidable header syntax defect.
    forbidden: Unknown ISO comparison masking the malformed mandatory HTTP header.
  - id: fd01-later-json-type
    input: HeaderTime max collection or JsonOrder has an unsupported valid first stored, followed by a missing or
      numeric stored field.
    allowed: FAIL for the later missing/string-type violation; inspect items despite unavailable comparisons.
    forbidden: Returning NOT-RUN at the first unsupported instant without checking later items.
  - id: fd01-known-subsequence-order
    input: An ascending sequence has known 2025-01-02, an unsupported valid timestamp, then known 2025-01-01; reverse
      known endpoints for descending. All timestamps have full combined date/time syntax.
    allowed: 'FAIL: the known subsequence is inverted regardless of the unknown intermediate instant.'
    forbidden: Skipping comparisons across an unknown element or returning NOT-RUN before the definite inversion is
      retained.
  - id: fd01-known-maximum-lower-bound
    input: Last-Modified represents a known HTTP second earlier than one known returned stored, with another unsupported
      valid stored in the same nonempty collection.
    allowed: 'FAIL: maximum stored cannot be smaller than its known member.'
    forbidden: Unknown members hiding this proven lower-bound failure.
  - id: fd01-unknown-without-known-defect
    input: Required header is present and valid; all fields are strings and valid under the abstract provider. Some
      stored instants are outside the bounded adapter and no known ordering or maximum-bound violation exists.
    allowed: NOT-RUN for the unresolved required comparison. Preserve the difference between unavailable computation
      and invalid data.
    forbidden: PASS after discarding unknown timestamps, or FAIL merely because this adapter lacks the valid representation.
  - id: fd01-ordinary-and-empty-controls
    input: All-known ordered instants and correct nonempty maximum header; separately an established empty collection
      with optional_if_empty=true and no header.
    allowed: The existing applicable positive relationships remain satisfied; the empty max obligation has no returned-value
      operand.
    forbidden: Changing ordinary max/order semantics or inventing max(empty).
  - id: fd01-query-independent-structure
    input: An otherwise controlled StatementQuery includes a valid but adapter-unsupported captured instant; returned
      statements is not an array, or exceeds the explicit nonzero limit.
    allowed: FAIL for shape or limit independent of eligibility.
    forbidden: Early NOT-RUN from the unrelated captured instant.
    observed: null
  - id: fd01-query-membership-and-type
    input: At least one captured or bound time is adapter-unavailable. Return an unrelated ID, duplicate ID, known
      boundary-excluded ID, or a later non-string stored field as separate variants.
    allowed: FAIL for each established independent violation.
    forbidden: Unknown time erasing membership, duplicate, known boundary or string-type evidence.
    observed: null
  - id: fd01-query-cardinality-bounds
    input: One definitely eligible ID and one possibly eligible ID. Return zero results without more; separately return
      the definite ID only, with the second eligibility unresolved.
    allowed: First variant FAIL (known omission). Second variant NOT-RUN (unknown omission), not FAIL based on possible
      count.
    forbidden: Treating possible eligibility as definite or discarding uncertainty to PASS.
    observed: null
  - id: fd01-query-prefix-and-order
    input: With unresolved unrelated timestamps, return a known newer ID ahead of an unreturned definitely eligible
      older ID in ascending mode; separately return a known reversed pair across an unknown returned time.
    allowed: FAIL for a definite prefix or subsequence inversion. An only-possibly-eligible unreturned predecessor
      cannot prove prefix failure.
    forbidden: Unknown entries hiding known failure, or possibly eligible witnesses creating false FAIL.
    observed: null
  - id: fd01-json-time-utc-and-fields
    input: JsonTime UTC predicate with parseable non-UTC actual and unavailable expected instant; separately a valid
      leap-second actual with explicit +09:00; separately actual unavailable with a required compared timestamp absent/non-string.
    allowed: FAIL for independent UTC or required compared-field violation. Pure valid unsupported UTC without another
      defect remains NOT-RUN.
    forbidden: Unavailable preservation hiding known offset/type errors, or unsupported ISO representation alone causing
      FAIL.
    observed: null
  - id: fd01-json-time-multiple-comparisons
    input: Actual ordinary UTC instant; first expected comparison is unavailable and a later independently known equals_capture
      or equals_pointer comparison is false.
    allowed: FAIL for the known false equality even after an unavailable earlier comparison.
    forbidden: Early NOT-RUN at the first comparison masking a later known mismatch.
    observed: null
  - id: fd01-empty-supplied-header
    input: 'Established empty StatementResult with optional_if_empty=true: omit Last-Modified, send valid HTTP-date,
      or send malformed HTTP-date.'
    allowed: Omission has no maximum obligation; supplied header syntax is checked. Malformed header FAIL. Valid syntax
      alone does not prove its representation-change/origination-time meaning; the branch procedure checks that with
      independently established context.
    forbidden: Skipping syntax of a supplied header or asserting max(empty).
    observed: null
  - id: fcar01-returned-boundary
    input: Captured stored is valid but adapter-unavailable. Returned stored is known and <= known since, or > known
      until. All other inputs valid.
    allowed: 'FAIL: either stored preservation or the requested boundary is violated. Unknown capture cannot erase
      returned evidence.'
    forbidden: NOT-RUN masking the known returned-boundary contradiction.
    observed: null
  - id: fcar01-returned-prefix
    input: 'Descending limit=1: first captured stored=2017-01-02T00:00:00Z, second capture=valid unsupported 2016-12-31T23:59:60Z;
      return only second with stored=2017-01-01T00:00:00Z. Valid headers and body otherwise.'
    allowed: 'FAIL: a definitely eligible known newer first record is omitted ahead of second; preservation or prefix
      must be violated.'
    forbidden: Using only unknown captured second time and yielding NOT-RUN.
    observed: null
  - id: fcar01-cross-known-order
    input: 'Ascending no-bound query. First has known captured stored=2017-01-02T00:00:00Z but valid unsupported returned
      stored; second has valid unsupported captured stored but returned known 2017-01-01T00:00:00Z. Reverse for descending.
      Control: all known witnesses ordered, unknown comparisons remain.'
    allowed: 'FAIL for inverted cross-known witnesses: preservation or order must fail. Ordered control remains NOT-RUN,
      not PASS or a provider-driven FAIL.'
    forbidden: Comparing only returned-to-returned or capture-to-capture and losing cross-side known evidence; inventing
      equality for unknowns.
    observed: null
  DC-DURATION:
  - id: grammar
    input: Locally checked ISO 8601:2004(E) 4.4.3.2 Y/M/D or standalone W and T H/M/S forms, decimal point/comma on the lowest
      component, zero; forbidden 4.4.3.3 forms separately, root and SubStatement Result.
    allowed: Valid specified forms, including valid fine precision; other independent Statement conditions remain
      satisfied.
    forbidden: Rejecting solely because the duration is not PT...S; admitting the explicitly forbidden alternative
      format; repeated or out-of-order components, empty components or fractions on a non-final component.
  - id: precision-and-calendar
    input: PT1.239S, PT1,239S and calendar-unit values; compare preserved value and logical equivalence with independent
      duration provider.
    allowed: Preservation of PT1.239S or truncation to PT1.23S, equivalent decimal separator; logical comparison
      ignores precision finer than 0.01s. Calendar components retain calendar semantics.
    forbidden: PT1.2S or PT1S as a stored substitute for PT1.239S; month/year converted to an assumed fixed number
      of seconds.
  - id: ffcr-05-static-controls
    input: original PT1S retained as PT1.00S after conflicting replay; original PT1.23S retained as PT1,23S; original
      duration replaced by replay PT9S
    allowed: original PT1S retained as PT1.00S after conflicting replay => PASS; original PT1.23S retained as PT1,23S
      => PASS; original duration replaced by replay PT9S => FAIL
    forbidden: Unknown converted to success or violation; known violation hidden; unselected order policy imposed;
      fixed calendar-to-seconds conversion. Paper definitions only.
    review_finding: FFCR-05
    source_evidence: target/ieee-test-definition-ffcr-correction/20261018T180706Z/source-evidence.json
  - id: ffcr-09-static-controls
    input: PT1.234S retained as PT1,234S; PT1.230S retained as PT1,23S; PT1.234S truncated to PT1.23S; PT1.234S
      reduced to PT1.2S; PT1.23S changed to PT2.23S; calendar-unit conversion outside bounded adapter
    allowed: PT1.234S retained as PT1,234S => PASS; PT1.230S retained as PT1,23S => PASS; PT1.234S truncated to
      PT1.23S => PASS; PT1.234S reduced to PT1.2S => FAIL; PT1.23S changed to PT2.23S => FAIL; calendar-unit conversion
      outside bounded adapter => NOT-RUN
    forbidden: Unknown converted to success or violation; known violation hidden; unselected order policy imposed;
      fixed calendar-to-seconds conversion. Paper definitions only.
    review_finding: FFCR-09
    source_evidence: target/ieee-test-definition-ffcr-correction/20261018T180706Z/source-evidence.json
  DC-NUMBER:
  - id: exact-and-binary32
    input: Exact JSON decimal 0.33333334, negative counterpart, exactly representable integers/fractions and values
      on each side of a binary32 boundary; retain original decimal token.
    allowed: Exact value or result inside the adjacent finite binary32 values enclosing the original, including
      valid directed/nearest and higher precision conversions. The finite Python adapter additionally accepts
      decimal spellings obtained by rounding either endpoint at any significant precision, provided they
      round-trip to that endpoint, and its binary64 repr, even if the decimal value lies just outside the
      closed interval. Directed decimal rounding brackets nearest/tie choices. Include shortest, nine-digit
      and longer spellings; the ledger imposes no shortest-spelling restriction. Additional digits after the
      exact terminating expansion only add zeros. This is an endpoint-serialization allowance, not equality
      of all decimal values rounding to the same binary32.
    forbidden: 0.33333337 for 0.33333334; same-rounded-bin comparison; arbitrary relative epsilon; boolean/string
      coercion.
  - id: zero-subnormal-range
    input: Signed zero, positive/negative subnormals, smallest normal, largest finite binary32 and greater-magnitude
      finite JSON numbers; independently specified representation/range and rounding capability.
    allowed: Exact or at-least-binary32 preservation under the declared primitive contract; zero sign is not an
      added xAPI identity requirement. Greater range/precision is allowed.
    forbidden: NaN/Infinity as JSON, assuming unsupported finite range is a mandatory LRS rejection, classifying
      missing provider capability as numeric PASS.
  - id: field-constraints
    input: Root/SubStatement score scaled/raw/min/max and opaque extension numbers; independent JSON numeric type
      and per-field bounds.
    allowed: Apply scaled bounds and score relations only at defined schema locations; extension-owned numeric values
      do not inherit score bounds.
    forbidden: Permitted rounding hiding a field-domain violation; nonnumeric values accepted by coercion; clamp
      to an unrelated field's range.
  - id: dcr02-exact-integer
    input: Exact JSON integers expected=9007199254740992 and returned=9007199254740993; negative counterparts; exact
      powers of two and both directed binary32 endpoints for 16777217; i64/u64 boundary values.
    allowed: Retained integer values are compared before any lossy equality shortcut. An exactly binary32-representable
      original has a singleton exact-value interval, plus the endpoint-serialization alternatives specified
      by exact-and-binary32. For non-exact integers use both enclosing binary32 bounds and those endpoint
      alternatives. For maximum finite binary32, 3.4028235e38, 3.40282347e38, longer correctly rounded spellings
      and its binary64 repr are allowed; for 0.3, 0.300000012 is allowed. Corresponding negative spellings are
      also allowed. The exact binary32 0.1 endpoint may serialize with directed decimal rounding as 0.100000002.
    forbidden: Converting both unequal integers to equal binary64 values and passing the precision assertion;
      arbitrary same-bin changes not produced by rounding an endpoint at any significant precision
      (0.1 changed to 0.1000000025); rejecting a legitimate serialization solely because it is not shortest.
      This finite adapter does not certify every decimal serialization or unavailable wider-range provider.
  - id: dcr02-decimal-input-identity
    input: Expected exact 1 and response JSON token 1.0000000000000001; other decimal/exponent forms, equal legitimate
      decimals, fine subnormals and wider range.
    allowed: The full DC-NUMBER relation uses original exact decimal inputs. The current Rust parsed-Value adapter
      and Python float adapter return ORACLE-UNAVAILABLE/NOT-RUN for decimal inputs whose lexemes were lost; the
      Python explicit Decimal path retains its declared exact input.
    forbidden: Equality of pre-rounded binary64 values proving the original decimal relation; claiming the current
      adapter certifies all decimal preservation.
    adapter_boundary: NOT-RUN is a limit of the current executor, not a permitted LRS mutation or a changed normative
      precision requirement.
  - id: rrf01-all-numeric-entry-points
    input: Declared exact source [1,"two",false]; readback [1.0000000000000001,"two",false]. Also 1 versus 1.0,
      +/-9007199254740992 versus adjacent integer, i64/u64 edges, nested Group arrays, numeric enum, as_json capture
      and MIME length 3 versus 3.0000000000000001. Apply separately at equals/not_equals, contains/subset/not_contains,
      capture-followup and MIME length.
    allowed: 'Lossless oracle: exact value 1 is equal to 1.0 but not 1.0000000000000001. Exact binary32 singleton
      preservation rejects the changed value. Integers remain exact. Current rounded-decimal Value path reports
      NOT-RUN; a known nonnumeric difference or independent mandatory failure retains FAIL. A membership match established
      by an exact independent item remains a match. For the MIME consumer, pair 21.0 with matching and mismatching
      Content-Type; only the former may remain unknown. Continue safe later-part and raw-completeness checks as
      defined by rrfr01-independent-mime-failures.'
    forbidden: PASS or FAIL inferred from already rounded floats; serialization of a rounded Value treated as original
      lexeme; numeric capture used downstream despite unavailability; accepting arbitrary changes within a binary64
      bin.
    source_anchor_ids:
    - RRF-01-S01
    - RRF-01-S02
    review_finding: RRF-01
  - id: ffcr-02-static-controls
    input: unchanged decidable Statement; sole undecidable decimal comparison; unknown score.scaled then changed
      verb.id; nested ordered array unknown then changed later element; unordered members with no possible perfect
      matching and some unknown comparisons; unordered members with possible but no proven matching
    allowed: unchanged decidable Statement => PASS; sole undecidable decimal comparison => NOT-RUN; unknown score.scaled
      then changed verb.id => FAIL; nested ordered array unknown then changed later element => FAIL; unordered members
      with no possible perfect matching and some unknown comparisons => FAIL; unordered members with possible but
      no proven matching => NOT-RUN
    forbidden: Unknown converted to success or violation; known violation hidden; unselected order policy imposed;
      fixed calendar-to-seconds conversion. Paper definitions only.
    review_finding: FFCR-02
    source_evidence: target/ieee-test-definition-ffcr-correction/20261018T180706Z/source-evidence.json
  DC-LANGUAGE:
  - id: registered-grandfathered-private
    input: en, zh-Hant-CN, i-klingon, x-private, case variants and valid empty language maps, otherwise valid fresh
      Statements. Use the pinned IANA registry in issued-definition-contracts.json.
    allowed: Acceptance of valid tags; preservation of supplied strings. Grandfathered and private-use are valid
      classes.
    forbidden: Allowing either 204 or 400 indiscriminately for a valid tag; inferring tag validity solely from token
      lengths.
  - id: invalid-classes
    input: Empty tag, abcdefghi, en-abcdefghi, unregistered abcdefgh, sl-rozaj-rozaj, en-a-foo-a-bar, and non-string
      map values, each as the sole invalid cause.
    allowed: 400 for invalid tag/type with no accepted Statement; mandatory validity and the minimum token check
      are retained as distinct requirements.
    forbidden: Accepting unregistered primary or repeated variant/extension singleton because lengths happen to
      pass; attributing a map value type rejection to tag validation.
  - id: placements-and-role
    input: Every model-declared core Language Map placement, including Activity/Verb maps, interaction component
      descriptions, attachment display/description at root and legal SubStatement positions. Extension-owned lookalikes
      are separate controls.
    allowed: Core tag rules at every core location; opaque extension values retain owner semantics; language-content
      truth and producer regional-knowledge advice remain role-specific.
    forbidden: Applying core map syntax to every extension property called name; inventing a receiver obligation
      to verify which language the text actually uses.
  DC-JWS:
  - id: compact-header
    clauses:
    - 1
    input: RS256/384/512 compact controls; independently vary segment count, padding/whitespace, base64url alphabet,
      invalid UTF-8/header JSON, missing alg, rs256, none, HS256 and ES256.
    allowed: Three correctly encoded segments with an object header and supported case-sensitive algorithm; exact
      original signing input is retained.
    forbidden: Accepting each isolated malformed shape or disallowed algorithm; substituting a fallback algorithm.
  - id: header-options
    clauses:
    - 2
    input: Unknown noncritical header, unknown critical header, empty crit, listed-but-absent crit name, missing
      typ/cty and duplicate decoded names (including escaped equivalents).
    allowed: Unknown noncritical and missing typ/cty do not fail by themselves; unsupported critical fails. Duplicate
      names follow the explicit reject/lexically-last choice D-11. Malformed crit producer violations retain the
      receiver MAY boundary.
    forbidden: Turning every producer MUST into receiver SHALL; accepting an unsupported critical extension as verified;
      silently inventing a required typ/cty.
  - id: payload-and-equivalence
    clauses:
    - 3
    input: Complete payload and received Statement; independently omit actor/verb/object, alter immutable identities,
      change only listed excluded fields, reorder object members, permute Group members, alter IRI path/mailbox
      local part, reorder or drop duplicate extension members.
    allowed: Validate payload shape first; apply the field-aware equality matrix and SP-01/SP-03. Property order
      alone is equal; duplicate multiplicity and opaque values are retained.
    forbidden: Global case folding; treating payload bytes as the logical equivalence oracle; equating the lossless
      multisets a:1,a:2 and a:2.
  - id: cryptographic-input
    clauses:
    - 4
    - 5
    input: Independently certified RSA key at least 2048 bits for each supported hash; exact protectedSegment.payloadSegment.
      Vary signature octet length, representative range, PKCS1 padding/DigestInfo/hash, bit corruption and reserialization
      while keeping all other causes valid.
    allowed: Verified only when the full called RFC3447 operation succeeds on original bytes with the alg-selected
      hash and permitted key.
    forbidden: Hash-prefix/partial padding acceptance, wrong key/algorithm, signature over reconstructed JSON, upgrading
      cryptography not-evaluated to verified.
  - id: certificate-and-key-policy
    clauses:
    - 6
    - 7
    input: x5c standard-base64 versus base64url/bad DER; valid signer-first chain; separately no x5c with no registered
      key, known valid key and known failing key. Freeze D-10, trusted anchor, validation time, purpose and revocation
      evidence.
    allowed: x5c requires path plus signature success; no-x5c admission follows the separately declared Kiva choice,
      with crypto verified/failed/not-evaluated recorded distinctly.
    forbidden: Treating a received self-signed root as automatically trusted; key failure falling back to no-key
      acceptance; x5c path indeterminate reported as valid.
  - id: signer-identity
    clauses:
    - 8
    input: A valid trusted signer whose certificate subject differs from actor and LRS hostname; independently authenticated
      provider and authority mapping.
    allowed: Signature/path checks succeed under their actual constraints; authority follows its separate authentication
      contract.
    forbidden: Inventing a TLS hostname check or a certificate-subject-equals-actor requirement for xAPI JWS.
  - id: DV-J01
    clauses:
    - 1
    - 3
    - 6
    input: "Apply ISOLATION.md. Establish valid types, signatures, paths and input eligibility apart from the semantic dimension being changed. If a negative fixture does not meet its premises, it is invalid/NOT-RUN, not successful detection. INPUT/BOUNDARY: Separate two periods/three segments, empty payload, complete payload and partial payload. APPLIES: Statement Attachments with signature usageType"
    allowed: "POSITIVE: Valid signature attachment and complete actor/verb/object payload → well-formed. SINGLE-CAUSE CONTRAST (expected failure/result or prohibited oracle): Remove only actor from the signature payload → 400. Do not reject the same bytes as JWS in a nonsignature attachment. ROLE/ALTERNATIVES: X.509 use and x5c inclusion are producer SHOULDs. Absence alone does not make every signature an IEEE violation."
    forbidden: "Contradicting the explicitly stated relation, losing its actor/force/conditions, or treating an unavailable required input as PASS. Separate delegated result / required IEEE behavior / harness capability / policy context."
    review_clause_id: J01
    source_force: shall; receiver shall reject malformed with 400
    actor: "Signature producer / receiving LRS"
    applicability: incorporated
    execution: definition only; not-run
  - id: DV-J02
    clauses:
    - 1
    - 6
    input: "Apply ISOLATION.md. Establish valid types, signatures, paths and input eligibility apart from the semantic dimension being changed. If a negative fixture does not meet its premises, it is invalid/NOT-RUN, not successful detection. INPUT/BOUNDARY: Treat input length mod4, trailing pad bits, unnecessary padding and nonalphabet characters separately. APPLIES: Decoding a Compact segment or x5c string"
    allowed: "POSITIVE: x5c encoding the same DER in standard base64 and valid base64url segments → each decoder succeeds. SINGLE-CAUSE CONTRAST (expected failure/result or prohibited oracle): Replace standard-base64 + or / with URL-alphabet characters in an x5c example requiring them; add = or whitespace in Compact → respective format failure. ROLE/ALTERNATIVES: Distinguish RFC4648 decoder MAY from canonical-encoder MUST; do not infer blanket rejection of noncanonical pad bits."
    forbidden: "Contradicting the explicitly stated relation, losing its actor/force/conditions, or treating an unavailable required input as PASS. Separate delegated result / required IEEE behavior / harness capability / policy context."
    review_clause_id: J02
    source_force: MUST / specified serialization
    actor: JWS producer / recipient
    applicability: incorporated
    execution: definition only; not-run
  - id: DV-J03
    clauses:
    - 1
    - 2
    input: "Apply ISOLATION.md. Establish valid types, signatures, paths and input eligibility apart from the semantic dimension being changed. If a negative fixture does not meet its premises, it is invalid/NOT-RUN, not successful detection. INPUT/BOUNDARY: Treat escape-equivalent names, empty crit and a header listed in crit but absent independently. APPLIES: Parse a UTF-8 header as a complete JSON object"
    allowed: "POSITIVE: Unknown noncritical member, absent typ/cty and alg=RS256 → no rejection solely for these facts. SINGLE-CAUSE CONTRAST (expected failure/result or prohibited oracle): Unknown unimplementable extension in crit → not verified. alg=rs256/none/HS256 → signature-requirement violation. ROLE/ALTERNATIVES: D-11 selection:null. Rejection/lexically-last for duplicate names remain an allowed set. Do not confuse producer violation for malformed crit with receiver MAY rejection."
    forbidden: "Contradicting the explicitly stated relation, losing its actor/force/conditions, or treating an unavailable required input as PASS. Separate delegated result / required IEEE behavior / harness capability / policy context."
    review_clause_id: J03
    source_force: producer MUST unique; recipient reject OR lexically-last; crit rejection rules
    actor: "Separate producer and recipient"
    applicability: incorporated
    execution: definition only; not-run
  - id: DV-J04
    clauses:
    - 4
    - 5
    input: "Apply ISOLATION.md. Establish valid types, signatures, paths and input eligibility apart from the semantic dimension being changed. If a negative fixture does not meet its premises, it is invalid/NOT-RUN, not successful detection. INPUT/BOUNDARY: Define 2047/2048-bit keys, k-1/k/k+1 signature lengths, s=n-1/n and minimum PS length 8. APPLIES: Branches requiring or selecting cryptographic verification"
    allowed: "POSITIVE: Original signing input for each alg with an allowed RSA key of at least 2048 bits → verified. SINGLE-CAUSE CONTRAST (expected failure/result or prohibited oracle): Separately use reserialized equivalent-JSON bytes, wrong hash, shortened PS, extra DigestInfo or representative >=n → failed. ROLE/ALTERNATIVES: This stage does not implement every SHA compression round or RSA. Fix algorithm names, editions and all comparison conditions in the calling contract."
    forbidden: "Contradicting the explicitly stated relation, losing its actor/force/conditions, or treating an unavailable required input as PASS. Separate delegated result / required IEEE behavior / harness capability / policy context."
    review_clause_id: J04
    source_force: MUST / prescribed verification algorithm
    actor: signature verifier
    applicability: incorporated
    execution: definition only; not-run
  - id: DV-J05
    clauses:
