  - id: rrfr01-independent-mime-failures
    input: 'Paper controls based on attachment-rfc-framing-folded-headers retrieval. Keep raw hex 706f727461626c650062696e617279ff6279746573
      (21 bytes), existing SHA-256 13fc365da2ef41f756d160b40d4cdbfffd582ee569cf33fec523b00c366cbda5 and all status/version/Consistent-Through/framing/CTE
      correct. Compare length token 21 versus 20 versus 21.0; metadata contentType application/octet-stream versus
      part type application/octet-stream or text/plain. After a first length 21.0, separately vary: another matching
      metadata entry with mismatching contentType; Content-Length 20; a later part missing hash, with wrong full
      hash, non-binary CTE or malformed header; an additional no-fileUrl metadata entry with 64 zero hex sha2 and
      no part. For expected_data mismatch use the already published SHA-224 abc vector with length 3.0 and valid
      headers/digest while expected_data still requires the original 21-byte sequence. No wire fixture or digest
      is generated.'
    allowed: Exact 21 with all independent conditions correct is PASS. Exact 20 is FAIL for length. 21.0 with matching
      type and all other independent conditions correct remains ORACLE-UNAVAILABLE/NOT-RUN in the current bounded
      adapter (the complete lossless contract accepts this numeric equality). 21.0 plus any independently established
      type/header/hash/length/required-raw/expected-data violation is FAIL at that violation. Repeat across same-item,
      later metadata, later part and final completeness checks.
    forbidden: An early ? or continue/return on numeric unknown skips later independent checks; reordering only
      Content-Type ahead of length leaves later-part/completeness masking; numeric tolerance or float roundtrip
      is used to turn unknown into PASS; unavailable provider is treated as an LRS violation; a known independent
      FAIL becomes NOT-RUN.
    source_anchor_ids:
    - RRFR-01-S01
    - RRFR-01-S02
    review_finding: RRFR-01
  - id: rrfr-f01-media-type-unavailable
    input: 'Use the existing attachment-rfc-framing-folded-headers retrieve observation with exact metadata length
      21 and existing raw/digest. Paper variations: FP-01: All original metadata and part headers valid; exact length
      21; FP-02: Attachment part Content-Type application/octet-stream; x=1; x=1; everything else correct; FP-03:
      FP-02 plus a later copy of the same raw data with first hash digit 0 instead of 1; FP-04: FP-02 plus Content-Length:
      20 on the 21-byte attachment; FP-05: First part Content-Type application/json; charset=utf-8; charset=utf-8;
      everything else correct; FP-06: FP-05 plus a later attachment part missing X-Experience-API-Hash; FP-07: Metadata
      contentType application/octet-stream; x=1; x=1; attachment part Content-Type remains application/octet-stream;
      FP-08: FP-07 plus the later wrong-hash part from FP-03; FP-09: FP-05 plus malformed JSON body in the first
      part; FP-10: FP-02 plus additional metadata with no fileUrl and 64 zero hex sha2, without any corresponding
      part; FP-11: FP-02, and expected_data additionally requires the three-byte sequence 616263 which no returned
      part contains; FP-12: FP-05, plus the existing attachment part Content-Type text/plain against metadata application/octet-stream;
      FP-13: FP-05 plus metadata length token 21.0; all other conditions correct; FP-14: Top-level Content-Type
      multipart/mixed; boundary=a; boundary=b; boundary-dependent body checks unavailable; FP-15: First part Content-Type
      text/plain without duplicate parameters; FP-16: First part Content-Type application (no slash or subtype);
      FP-17: Attachment part Content-Type application (no slash or subtype), metadata valid; FP-18: Attachment part
      Content-Type text/plain; metadata application/octet-stream, otherwise valid. No response fixture or digest
      is generated.'
    allowed: 'FP-01: PASS (all relevant predicates hold); FP-02: NOT-RUN (duplicate parameter disposition remains
      unavailable); FP-03: FAIL (MIME attachment hash does not match raw data); FP-04: FAIL (MIME Content-Length
      differs from raw data); FP-05: NOT-RUN (first-part parameter disposition unavailable; JSON and later checks
      still run); FP-06: FAIL (missing MIME attachment hash); FP-07: NOT-RUN (left operand of media-type equivalence
      unavailable); FP-08: FAIL (MIME attachment hash does not match raw data); FP-09: FAIL (invalid first MIME
      JSON part); FP-10: FAIL (response omits attachment data without a fileUrl); FP-11: FAIL (multipart response
      omitted or altered expected attachment data); FP-12: FAIL (MIME content type differs from attachment metadata);
      FP-13: NOT-RUN (multiple local unknowns, no known violation; 21.0 is not itself invalid); FP-14: NOT-RUN (envelope
      boundary cannot be selected safely; no invented framing result); FP-15: FAIL (first MIME part is not application/json);
      FP-16: FAIL (missing MIME subtype separator); FP-17: FAIL (missing MIME subtype separator); FP-18: FAIL (MIME
      content type differs from attachment metadata). A duplicate parameter alone remains ORACLE-UNAVAILABLE; it
      is not an established LRS violation. A known later violation dominates local numeric or media-type unavailability.'
    forbidden: Returning a local first-part or attachment media-type unknown before safely decidable later checks;
      treating duplicate parameters as an established invalidity or success; guessing an ambiguous top-level boundary;
      suppressing ordinary lexical errors/type mismatches; upgrading SHOULD into mandatory rejection.
