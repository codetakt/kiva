schema_version: 1
profile: xapi-lrs-ieee-2023-interpretation-3
published_source_record: spec/conformance/lrs-published-source.yaml
scope: Six published/public LRS issues plus explicit cross-review judgments; classifications are not an
  exhaustive obligation inventory
principles:
  authority: Read the published IEEE 2023 text with its common conditions; public corrections are declared
    project interpretations until official status is established
  coherence: Prefer the smallest interpretation that preserves the resource scope, dispatch semantics
    and explicit requirements together
  specific_scope: Apply a resource-specific body definition to that method; do not turn a general media-type
    sentence into a different resource operation
  strength: Preserve shall/should/may and their conditions; permitted alternatives and recommendations
    are not unconditional failures
  independence: Expected outcomes come from source reasoning, never from Kiva observed behavior
  evidence: Preserve raw outcomes and failures; identify interpretation dependencies, including setup
    and observation steps
  reporting: No registered dependency means that the registered judgments were not identified, not definitive
    conformance
  identity: Qualify historical execution only when its report, case files and runner contracts are bound
    to a supplied evidence receipt
decisions:
- id: state-list-selectors
  finding: state-list-selectors
  status: project-adopted
  chosen_rule: Omit stateId for list GET/HEAD; supplying it selects a single document. since restricts
    a list and does not select a single document
  rationale: Section 4.1.6.2 explicitly defines dispatch by stateId presence; this agrees with the multiple-GET
    description and multiple-DELETE table. The contradictory required cell would eliminate the list without
    since The unreconciled required/forbidden condition exists only when both stateId and since are absent;
    chapter 5 repeats it.
  rejected_reading: Require stateId for a multiple-document GET without since
  official_adjudication: not-established
  request_selectors:
  - methods:
    - GET
    - HEAD
    path: /activities/state
    query_absent:
    - stateId
    - since
    expected_statuses:
    - 200
  excluded_condition: GET/HEAD with stateId absent AND since absent
  pdf_anchors:
