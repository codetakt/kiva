  chosen_rule: Select Activity Profile lists with activityId; omit profileId for the list and use since
    only as an optional exclusive time filter
  rationale: PDF 5.1.6.6.5 explicitly requires activityId and makes since optional. Read the chapter 4
    Agent cell through this redundant table; no condition is excluded.
  rejected_reading: Require agent to list Activity Profile documents
  official_adjudication: not-established
