  official_adjudication: not-established
  chosen_rule: An otherwise valid application/json POST with no If-Match to an absent document stores
    it and returns 204. If-Match on an absent document fails with 412.
  rationale: The POST summary is updates/stores; body is stored/updated; the merge condition refers to
    any existing document and does not require prior existence. This is a declared reading, not an official
    adjudication.
