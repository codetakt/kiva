release_conditions:
  interpretation_profile: Record this exact profile and its digest in results; changing a decision requires
    reviewing affected expectations and new evidence
  projection: Review atomic LRS duties with actor, strength, conditions and actual assertions; broad groups
    and heading counts alone do not close coverage
  execution: Discharge applicable controlled-clock, delayed-visibility, policy and normative-reference
    procedures; distinguish not run from failed
  oracle_checks: Use positive/negative and preservation checks plus meaningful mutation controls; never
    loosen an expectation to match Kiva
  claim: Report success only for the executed scope under the named interpretation profile. A raw all-pass
    HTTP result alone is not a whole-standard completeness verdict
additional_judgments:
- id: state-delete-without-registration
  finding: R4
  status: project-adopted
  public_source_lines:
  - 498
  - 508
  - 514
  - 525
  actor: LRS
  chosen_rule: For State lists and multiple DELETE, absent registration selects every registration in
    the specified Activity/Agent context; present registration restricts the scope to that registration.
    Other Agents and Activities remain outside the scope.
  rationale: The optional qualifier [+ registration if specified] restricts the context only when supplied.
    Treating absence as an implicit null-registration selector adds a restriction the summary does not
    state. This is a source judgment rather than an official adjudication. The identical qualifier in
    the multiple GET summary (line 498) receives the same reading; applying a different default to list
    and delete would be incoherent.
  rejected_reading: Interpret omitted registration as listing or deleting only unregistered state
  official_adjudication: not-established
  explicit_cases:
  - state-delete-all-all-registrations
  - state-delete-all-registered
  - state-list-scope-all-registrations
  - state-list-scope-registered
- id: attachment-return-order
  finding: R5
  status: project-adopted
  public_source_lines:
  - 351
  - 384
  - 837
  - 880
  - 1044
  - 1198
  actor: LRS
  chosen_rule: Default/exact returns the ordered Attachment metadata array as received. attachments=true
    includes all raw data needed for attachments without fileUrl. MIME data-part order is not fixed. Attachment
    differences do not affect logical equivalence or signature equivalence.
  rationale: The project reads the explicit Ordered array type at lines 880/1044 as making metadata sequence
    part of returned data. The Any attachments exemption explicitly governs logical equivalence and preservation
    as described above (immutability); this judgment does not extend it to retrieval ordering or required
    MIME completeness. Line 351 only enumerates Agent/Activity/Verb/Group and is not asserted to explicitly
    cover Attachment Objects. Preserving received Attachment order is a declared project interpretation
    of the table and retrieval contract, to be adjudicated in this re-review, not an official IEEE resolution.
    Line 1198 says return serialization may differ for properties excepted by Section 4.2. Reading that
    exception as incorporating the Any attachments item in line 837 into retrieval is the strongest contrary
    reading; it could permit metadata array reordering. This candidate retains the ordered-array reading
    as a declared project interpretation, with this contrary evidence disclosed. The unconditional requirement
    to return all required raw Attachment parts (line 384) remains independent of the order judgment.
  rejected_reading: Use the logical-immutability exemption to permit reordered exact response metadata
    or missing required MIME parts
  official_adjudication: not-established
  explicit_cases:
  - attachment-two-file-urls
  - attachment-two-multipart
