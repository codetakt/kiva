- id: formatted-identifiers
  finding: formatted-identifiers
  status: project-adopted
  chosen_rule: Validate required identifier syntax, including scheme, mailto form and standard UUID string
    form; do not require resolution, resource existence or real-world identity validation
  rationale: Explicit format-rejection rules and the phrase data format, not values can both be retained
    under this reading. The permission is not silently converted into mandatory resolution or a particular
    UUID variant
  rejected_reading: Treat the permission as waiving all identifier syntax checks
  official_adjudication: not-established
  table_formats:
  - uuid
  - iri
  - irl
  - uri
  - mailto
  - extensions
  - iri-array
  explicit_cases:
  - statement-post-rejects-extension-key-that-is-not-iri
  - statement-post-rejects-invalid-verb-iri
  - statement-post-rejects-non-uuid-statement-id
  query_literals:
    activityId:
    - ''
    - no-scheme
    - https://invalid host/a
    registration:
    - ''
    - not-a-uuid
  selector_limit: Table format-value probes only; iri-array selects invalid string content, not null or
    numeric items. Query literals conservatively retain the source-scope question rather than claim a
    syntax waiver
- id: put-single-and-batches
  finding: put-single-and-batches
  status: project-adopted
  chosen_rule: Require valid single-Statement PUT and single/batch POST; do not infer an unconditional
    PUT-array rejection obligation
  rationale: Single PUT is explicit in section 4.1.6.1.1 and batch POST is explicit in section 4.1.6.1.2.
    The general media-type batch wording does not settle the treatment of a PUT array
  rejected_reading: Declare every implementation accepting a PUT batch nonconformant solely because of
    the single PUT summary
  official_adjudication: not-established
  request_selectors:
  - methods:
    - PUT
    path: /statements
    body_type: array
  unresolved_probe: Current cases do not necessarily exercise PUT arrays. A missing probe is reported
    as not exercised, never as acceptance or rejection established. Multipart PUT batches also require
    a dedicated probe
- id: case-equivalence-and-iri-comparison
  finding: case-equivalence-and-iri-comparison
  status: project-adopted
  chosen_rule: Keep JSON keys and vocabulary values case sensitive and permitted RFC3987 comparisons.
    Exclude only the conflicted signature mbox-case equivalence status leaf from the conformance verdict;
    record its actual status diagnostically. Other headers and crypto assertions remain required.
  rationale: RFC 3987 simple comparison and syntax normalization do not authorize unrestricted lowercasing
    of an IRI path or an email local part. The broad Statement Case exclusion cannot silently override
    every identifier comparison rule
  rejected_reading: Lowercase all identifiers or treat JSON property-name case variants as valid
  official_adjudication: not-established
  explicit_cases:
  - signature-equivalence-excludes-case
  unresolved_probe: Full RFC comparison boundaries and the scope of the Statement Case exclusion remain
    separate review work
- id: related-activities-public-correction
  finding: related-activities-public-correction
  status: project-adopted
  chosen_rule: With related_activities=true, apply the Activity filter to Object, contextActivities and
    contained SubStatements; related_agents separately expands the Agent filter
  rationale: PDF 5.1 declares its tables redundant with 4.1. PDF 5.1.6.1 defines the Activity filter explicitly;
    read the chapter 4 duplicated Agent prose through this chapter 5 row. No external overlay is required.
  rejected_reading: Give related_activities the same Agent-filter meaning as related_agents
  official_adjudication: not-established
  request_selectors:
  - methods:
    - GET
    - HEAD
    path: /statements
    query_equals:
      related_activities: 'true'
