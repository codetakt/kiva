- id: unknown-local-offset-boundary
  status: project-adopted
  chosen_rule: For the disputed -00:00 input, permit 200 or 400. If accepted, require the same instant
    in UTC on readback. Rejection is not an LRS defect for this case.
  rationale: PDF 5.2.7.5 imposes ISO 8601 and RFC 3339 simultaneously. RFC 3339 4.3 permits -00:00; RFC
    9557 2.1-2.3 updates those semantics and states that ISO 8601:2000 and later do not permit that offset,
    without formally deprecating RFC syntax. Neither unconditional acceptance nor unconditional rejection
    is established for this combined boundary. PDF 4.2.7.5 still requires UTC conversion when input is
    accepted.
  rejected_reading: Require acceptance from RFC 3339 alone, or require rejection without addressing the
    simultaneous references. Neither is claimed as the official resolution.
  official_adjudication: not-established
  source_route: explicit-project-interpretation
  reference_baseline_date: '2026-10-06'
  explicit_cases:
  - statement-unknown-local-offset-policy
  pdf_anchors:
