interpretations:
- id: state-list-selectors
  lines:
  - 418
  - 507
  decision: Omitting stateId lists State ids, and omitting stateId for DELETE deletes all State in the given scope;
    follow narrative over contradictory multiple-GET required cell.
  published_anchor: IEEE 2023 sections 4.1.6.2 and 4.1.6.2.5, printed pages 27 and 29; the table conflict persists.
- id: activity-profile-list-scope
  lines:
  - 731
  - 752
  decision: Use activityId for Activity Profile listing; the agent entry in its multiple-GET table conflicts with
    resource scope and the other method tables.
  published_anchor: IEEE 2023 section 4.1.6.6.5, printed page 35; the inconsistent selector persists.
- id: formatted-identifiers
  lines:
  - 848
  - 1191
  decision: Retain the explicit syntax and standard UUID-form requirements. The permission not to validate values
    is read as not resolving identifiers or verifying their existence. This remains an author interpretation; the
    published PDF does not explicitly adjudicate the boundary.
  published_anchor: IEEE 2023 sections 4.2.1 and 4.2.4.1, printed pages 37-38 and 48.
- id: interaction-validation
  lines:
  - 1203
  - 1205
  decision: A valid interactionType is mandatory. Rejection of other invalid interaction properties is optional,
    and tests accept 400 or success for those probes. Characterstring parameters are not LRS validation duties.
- id: put-single-and-batches
  lines:
  - 68
  - 223
  decision: PUT uses the single-Statement body defined by its resource table; POST tests multi-Statement batches.
    The generic media-type wording calls both batches and needs editorial clarification.
  published_anchor: IEEE 2023 sections 4.1.3.1, 4.1.3.5 and 4.1.6.1.1, printed pages 18-19 and 23.
- id: case-equivalence-and-iri-comparison
  lines:
  - 824
  - 840
  supporting_lines:
  - 1287
  - 1287
  decision: Keep the existing signed-Statement mbox case vector under the explicit Case exclusion; do not derive
    unrestricted lowercasing of all IRIs. The intersection with the permitted RFC 3987 comparison strategies remains
    unresolved in the published PDF.
  published_anchor: IEEE 2023 section 4.2, printed page 37, and section 4.2.7.1, printed page 51.
- id: document-non-json-post
  lines:
  - 452
  - 460
  decision: Arbitrary binary acceptance is tested via PUT. Non-JSON POST against an existing document must reject;
    non-JSON POST to a missing document is not used as a mandatory success probe.
- id: canonical-optional-maps
  lines:
  - 406
  - 409
  decision: Activity maps require language filtering. Verb and extension canonical maps are optional; retaining
    a submitted Verb display in canonical mode is allowed.
- id: equivalent-duplicate-status
  lines:
  - 227
  - 239
  decision: Both 409 and 204 are permitted for known Statement ids. Always test preservation; signature validation
    exercises required logical comparison exceptions.
- id: asynchronous-statement-read
  lines:
  - 226
  - 238
  decision: Wait up to the configured bounded observation window for retrieval. A timeout records a test failure
    under that fixture; it does not prove the standard specifies a five-second deadline.
- id: empty-arrays
  lines:
  - 899
  - 1084
  decision: Do not invent a nonempty requirement for Group.member or contextActivities. relevantTypes explicitly
    requires one or more entries when supplied.
- id: pagination-topology
  lines:
  - 249
  - 1235
  decision: Follow the more IRL without assuming cursor syntax. The reference runner currently supports same-origin
    pagination and requires an appropriate runner/fixture for other topologies.
- id: signature-certificate
  lines:
  - 1260
  - 1275
  decision: Validate the signature with the included certificate public key. No application-specific trusted CA
    or production credential is required for the synthetic conformance certificate.
