schema_version: 1
scope: Pinned public xAPI LRS projection reconciled with IEEE Std 9274.1.1-2023 clause 4; LRP, LRC, Profiles and
  ISO 2025 equivalence are outside this projection
source:
  repository: https://opensource.ieee.org/xapi/xapi-base-standard-documentation
  revision: fb8ecb2c1a258e6d3d397805243fd793d47cec5d
  document: 9274.1.1 xAPI Base Standard for LRSs.md
  sha256: 2f43d1a0bccbe24c5adaef0daa3519837c6583ba7c3bfbda86ba964924b1ff0b
  bytes: 98022
  lines: 1338
  approved_release_revision: 134afd8c108b4d1b98294a1613db38a6b8fe73d8
  public_revision_delta:
  - location: Statements GET parameter table, related_activities
    change: The current public revision corrects an Agent-filter description to describe Activity filtering in Object,
      context Activities and contained SubStatements.
    adoption: PDF chapter 5 independently contains the Activity row; the public correction agrees with that internal PDF reading.
  - location: Characterstring Parameters example link
    change: The example link moved from gitlab.com/IEEE-SA to opensource.ieee.org/xapi.
    adoption: Reference-link correction only; no changed acceptance rule.
  published_source_record: spec/conformance/lrs-published-source.yaml
  published_erratum_status: The IEEE 2023 PDF chapter 4 duplicates the Agent description, but chapter 5 contains the Activity description. Read the redundant tables together; no external overlay is required. Official erratum status is unverified.
coverage_meaning: Curated source spans are mapped to concrete expectation bodies and review tests. This is a finite
  projection, not proof of all possible inputs or an assertion that all reviewed obligations have passed.
