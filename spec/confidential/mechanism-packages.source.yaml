schema_version: 1
kind: kiva-confidential-mechanism-packages-source
status: active
description: >
  Thin human review entrypoint for confidential-computation MechanismPackage
  rows. Each package binds a maturity mechanism, CapabilityBinding, provider
  boundary, assurance entry, and verification family into one review unit.
mechanism_package_model:
  root_type: MechanismPackage
  authoritative_edit_entrypoint: true
  facet_sources_are_not_roots: true
  facet_edit_policy:
    package_is_only_confidential_edit_unit: true
    facet_sources_remain_supporting_rows: true
    review_must_enter_through_mechanism_profile_index: true
    every_facet_row_must_be_owned_by_exactly_one_package: true
  primary_review_surface: generated/confidential/mechanism-profile-index.yaml
  package_profile_projection: generated/confidential/mechanism-profile-index.yaml#/package_profiles
  package_flow:
    - Mechanism
    - Capability
    - ProviderBoundary
    - Maturity
    - Assurance
    - Verification
  sealed_provider_boundary: spec/confidential/secret-compute-provider-contract.yaml#/sealed_capability_boundary
  package_rule: >
    CapabilityBinding, provider contract, mechanism maturity, assurance
    registry, and verification kernels are package facets. They should not be
    reviewed as independent confidential-computation roots.
package_source_refs:
  - spec/confidential/mechanism-catalog.source.yaml
  - spec/confidential/capability-taxonomy.source.yaml
  - spec/confidential/capability-bindings.source.yaml
  - spec/confidential/secret-compute-provider-contract.yaml
  - spec/confidential/mechanism-maturity.yaml
  - spec/confidential/assurance-evidence-registry.yaml
  - spec/verification/confidential-verified-kernels.yaml
packages:
  - id: additive-secure-aggregation-package
    maturity_mechanism: additive-secure-aggregation
    capability_binding: additive-secure-aggregation-capability
    capability: additive-secure-aggregation
    mechanism_catalog_id: additive-n-of-n
    provider_kind: reference-primitive
    assurance_registry_entry: null
    verification_family: additive
  - id: differential-privacy-release-package
    maturity_mechanism: differential-privacy-release
    capability_binding: differential-privacy-release-capability
    capability: differential-privacy-release
    mechanism_catalog_id: null
    provider_kind: reference-primitive
    assurance_registry_entry: null
    verification_family: differential-privacy
  - id: shamir-vss-admission-package
    maturity_mechanism: shamir-vss-admission
    capability_binding: shamir-vss-admission-capability
    capability: threshold-reconstruction
    mechanism_catalog_id: shamir-threshold
    provider_kind: threshold-cryptography
    assurance_registry_entry: null
    verification_family: shamir
  - id: psi-cohort-hash-token-package
    maturity_mechanism: psi-cohort-hash-token
    capability_binding: psi-cohort-hash-token-capability
    capability: psi-evaluation
