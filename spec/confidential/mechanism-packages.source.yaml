  - id: tee-portable-attestation-package
    maturity_mechanism: tee-portable-attestation
    capability_binding: tee-portable-attestation-capability
    capability: tee-attestation
    mechanism_catalog_id: trusted-execution-environment
    provider_kind: trusted-execution-environment
    assurance_registry_entry: tee-attestation
    verification_family: tee
  - id: fhe-sum-feasibility-package
