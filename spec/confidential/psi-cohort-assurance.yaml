---
schema_version: 1
kind: psi-cohort-assurance-profile
standard: Kiva Architecture
status: published
claim_boundary: >
  Kiva supports a bounded cross-school cohort matching PSI profile over
  pre-tokenized identifier digests. It validates n-of-n participant admission,
  rejects duplicate participant datasets and duplicate per-participant digests,
  suppresses non-matches, and returns only intersection digests from the Rust
  core boundary. Kiva does not expose a dedicated PSI PDS data-product source
  kind, HTTP API, or PostgreSQL result store in this profile. It is not a
  malicious-secure PSI protocol, OPRF PSI, Diffie-Hellman PSI, or broad record
  linkage service.
profile: kiva-psi-cohort-hash-v1
protocol:
  family: hash-token-n-of-n-intersection
  digest: sha256
  domain: kiva-confidential:psi-cohort-identifier:v1
  minimum_participants: 2
  requires_all_participants: true
  raw_identifiers_admitted_to_kiva: false
admission:
  requires_job_id: true
  rejects_replayed_job_id: true
  requires_exactly_one_dataset_per_participant: true
  requires_non_empty_participant_datasets: true
  rejects_duplicate_participant_indexes: true
  rejects_duplicate_identifier_digests_per_participant: true
  rejects_out_of_range_participant_indexes: true
output:
  exposes_intersection_digests: true
  exposes_intersection_count: true
  exposes_raw_identifiers: false
  exposes_non_matching_digests: false
  exposes_participant_inputs: false
pds:
  dedicated_data_product_source_kind_implemented: false
  future_source_kind: private-set-intersection-result
  aggregate_insights_only: true
  raw_record_read: false
  pds_openapi_source_kind: absent
  pds_postgresql_source_kind: absent
  pds_policy_source_kind: absent
vectors:
  path: spec/confidential/psi-cohort-vectors.yaml
  required_profile: kiva-psi-cohort-hash-v1
job_contract:
  path: spec/confidential/psi-cohort-job-contract.yaml
evidence:
  rust_core: crates/kiva-confidential/src/lib.rs
  policy: crates/kiva-policy/src/lib.rs
  vectors: spec/confidential/psi-cohort-vectors.yaml
  job_contract: spec/confidential/psi-cohort-job-contract.yaml
  kani_runner: scripts/ci/run_kani_verification.sh
  tamarin_model: proofs/tamarin/kiva_psi_cohort_boundary.spthy
  design_note: docs/architecture/private-set-intersection.md
  operator_runbook: docs/operations/psi-cohort-runbook.md
