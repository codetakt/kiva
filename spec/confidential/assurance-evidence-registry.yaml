---
schema_version: 1
kind: confidential-assurance-evidence-registry
description: >
  Central registry for source-level assurance evidence used by confidential
  computation validators. Typed evidence entries name Rust boundary symbols,
  Rust tests, Kani harnesses, and selected formal evidence together with the
  source files that validators must resolve instead of carrying ad hoc source
  scans in each validator.
