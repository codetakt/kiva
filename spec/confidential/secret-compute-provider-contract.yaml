---
schema_version: 1
kind: secret-compute-provider-contract
standard: Kiva Architecture
status: published
milestone: CC16
profile: kiva-secret-compute-provider-contract-v1
provider_kind_rust_variants:
  reference-primitive: ReferencePrimitive
  secret-custody: SecretCustody
  trusted-execution-environment: TrustedExecutionEnvironment
  fully-homomorphic-encryption: FullyHomomorphicEncryption
  private-set-intersection: PrivateSetIntersection
  threshold-cryptography: ThresholdCryptography
claim_boundary: >
  Kiva defines a metadata-only integration contract for external secret,
  encryption, and confidential-compute providers, plus a deterministic
  reference primitive provider for fixtures and verification. Kiva validates
  provider identity, artifact, parameter-set, review-evidence, capability, and
  production-claim gates. The reference provider is fixed for tests and proofs
  and is never a production cryptographic security claim.
reference_provider:
  profile: kiva-reference-primitives-v1
  kind: reference-primitive
  rust_type: ReferencePrimitiveProvider
  capability: reference-fixtures
  mechanism_catalog_participation: fixture-coverage-map-only
  production_claim_allowed: false
  production_secret_custody_allowed: false
  purpose:
    - deterministic test fixtures
    - boundary validation
    - OpenAPI and evidence examples
    - Kani and Tamarin model alignment
  fixed_primitives:
    additive_secure_aggregation:
      field_modulus: 4294967291
      status: implemented-reference-core
      production_mpc_claim_allowed: false
    shamir_vss_admission:
      field_modulus: 4294967291
      commitment: sha256-domain-separated-opening
      status: implemented-reference-core
      malicious_dealer_claim_allowed: false
    psi_oprf_fixture:
      suite: ristretto255-sha512-voprf
      status: deterministic-fixture-only
      production_psi_claim_allowed: false
    tee_attestation_fixture:
      format: normalized-metadata-fixture
      status: deterministic-fixture-only
      hardware_backed_claim_allowed: false
    threshold_frost_fixture:
      suite: ed25519-sha512-frost
      status: metadata-fixture-only
      production_threshold_claim_allowed: false
    fhe_sum_fixture:
      scheme_family: bfv-integer-sum
      operation: sum
      status: deterministic-feasibility-fixture
      production_fhe_claim_allowed: false
external_provider_contract:
  provider_boundary_types:
    secret_custody_provider:
      rust_type: SecretCustodyProvider
      rust_kind_type: SecretCustodyProviderKind
      provider_kinds:
        - secret-custody
      mechanism_catalog_participation: excluded-from-compute-mechanism-catalog
      claim_boundary: metadata-only-custody-binding
    compute_mechanism_provider:
      rust_type: ComputeMechanismProvider
      rust_kind_type: ComputeMechanismProviderKind
      provider_kinds:
        - trusted-execution-environment
        - fully-homomorphic-encryption
        - private-set-intersection
        - threshold-cryptography
      mechanism_catalog_participation: required-for-confidential-mechanism-capability-map
      claim_boundary: evidence-gated-compute-runtime-binding
  provider_kinds:
    - secret-custody
    - trusted-execution-environment
    - fully-homomorphic-encryption
    - private-set-intersection
    - threshold-cryptography
  required_binding_fields:
    - provider_id_digest
    - artifact_digest
    - capability
    - profile
  conditional_binding_fields:
    parameter_set_digest:
      required_for:
        - fully-homomorphic-encryption
        - private-set-intersection
        - threshold-cryptography
    review_evidence_digest:
      required_before_production_claim: true
  production_claim_gate:
    external_review_completed_required: true
    review_evidence_digest_required: true
    artifact_digest_required: true
    parameter_set_digest_required_for_runtime_providers: true
    reference_provider_allowed: false
admission_model:
  rust_contract_type: SecretComputeProviderContract
  rust_type: SecretComputeProviderAdmission
  rust_evidence_type: SecretComputeProviderEvidence
  rust_evidence_review_type: SecretComputeProviderReviewEvidence
  rust_evidence_usage_type: SecretComputeProviderUsageClaim
  rust_runtime_boundary_type: SecretComputeProviderRuntimeBoundary
  rust_runtime_boundary_claim_type: SecretComputeProviderRuntimeBoundaryClaim
  rust_contract_constructor: SecretComputeProviderContract::for_mechanism
  rust_function: admit_secret_compute_provider
  rust_runtime_function: admit_secret_compute_provider_runtime_boundary
  flow:
    - capability
    - admission-gate
    - evidence
    - runtime-boundary
    - runtime-binding
    - release
  evidence_gates:
    - reference-fixture
    - external-non-production
    - external-reviewed
  release_gates:
    - fixture-only
    - non-production
    - production
  runtime_parameter_set_required_for:
    - fully-homomorphic-encryption
    - private-set-intersection
    - threshold-cryptography
sealed_capability_boundary:
  root_type: SealedCapabilityBoundary
  boundary_trait: SecretComputeProviderKindContract
  provider_profiles:
    - reference-primitive
    - secret-custody
    - trusted-execution-environment
    - fully-homomorphic-encryption
    - private-set-intersection
    - threshold-cryptography
  uniform_gate_sequence:
    - capability
    - admission-gate
    - evidence
    - runtime-boundary
    - runtime-binding
    - release
  reference_provider_rule: reference providers use the same admission and evidence gate shape, but terminate at fixture-only release and cannot request production claims
  external_provider_rule: external providers use the same admission and evidence gate shape, and production claims require reviewed evidence, parameter sets when required, and runtime-boundary review
  release_gate_partition:
    reference-primitive: fixture-only
    secret-custody: non-production-or-production
    trusted-execution-environment: non-production-or-production
    fully-homomorphic-encryption: non-production-or-production
    private-set-intersection: non-production-or-production
    threshold-cryptography: non-production-or-production
capability_map_projection:
  source: spec/confidential/mechanism-catalog.source.yaml
  ownership: generated-from-mechanism-source
  provider_boundary_type: ComputeMechanismProvider
  reference_provider_participation: excluded-from-compute-capability-map
  provider_kind_field: provider_kind
  capability_field: required_provider_capability
  mechanism_field: maturity_mechanism
  validation_rule: one-capability-per-provider-kind-and-mechanism-owned-by-source
reference_capability_map_projection:
  source: spec/confidential/mechanism-catalog.source.yaml
  ownership: generated-from-mechanism-source
  provider_boundary_type: ReferencePrimitiveProvider
  provider_kind_field: provider_kind
  capability_field: required_provider_capability
  mechanism_field: maturity_mechanism
  validation_rule: reference-primitive-mechanisms-map-only-to-reference-fixtures
provider_algebra:
  expression: ProviderCapability -> EvidenceGate -> RuntimeBoundary -> ReleaseGate
  kind_contract_trait: SecretComputeProviderKindContract
  reference_kind_type: ReferenceProviderKind
  custody_kind_type: SecretCustodyProviderKind
  compute_kind_type: ComputeMechanismProviderKind
  capability_type: SecretComputeProviderCapability
  evidence_gate_type: SecretComputeProviderEvidenceGate
  runtime_boundary_type: SecretComputeProviderRuntimeBoundary
  release_gate_type: SecretComputeProviderReleaseGate
  invariant_order:
    - required-capability
    - evidence-gate
    - runtime-boundary
    - release-gate
  laws:
    - capability must match the selected confidential mechanism before evidence is admitted
    - production release requires external-reviewed evidence and a reviewed runtime boundary
    - reference-fixture providers terminate at fixture-only release
    - reference and external providers pass through the same sealed capability boundary before release partitioning
confidential_compute_layer_model:
  root_type: ConfidentialComputeBoundaryModel
  layer_count: 2
  separation_rule: mechanism kernels own computation semantics; provider runtime contracts own external execution, evidence, and release gates
  layers:
    mechanism_kernel:
      owns:
        - mechanism profile
        - reference primitive fixture semantics
        - admissible operation shape
        - deterministic test vectors
      must_not_own:
        - production secret custody
        - external runtime attestation
        - external ciphertext wire custody
    provider_runtime_contract:
      owns:
        - provider identity digest
        - artifact digest
        - parameter-set digest
        - review evidence digest
        - runtime boundary claim
        - release gate
      must_not_own:
        - mechanism semantic definition
        - IEEE xAPI interface behavior
        - PDS policy decision semantics
binding_digest:
  digest: sha256
  domain: kiva-confidential:secret-compute-provider-binding:v1
  length_prefix: uint128-be
  fields:
    - profile
    - kind
    - capability
    - provider_id_digest
    - artifact_digest
    - parameter_set_digest_presence
    - parameter_set_digest
    - review_evidence_digest_presence
    - review_evidence_digest
    - external_review_completed
    - production_claim_requested
vectors:
  - id: reference-fixture-provider-binding-v1
    profile: kiva-reference-primitives-v1
    kind: reference-primitive
    capability: reference-fixtures
    provider_id_seed: 201
    artifact_seed: 202
    parameter_set_seed: null
    review_evidence_seed: null
    external_review_completed: false
    production_claim_requested: false
    expected_binding_digest_hex: cb1ea2caff07b9d4186c43974e2324a836a5e5f531b2e1b7178da1449e7833bf
  - id: reviewed-fhe-provider-binding-v1
    profile: kiva-secret-compute-provider-contract-v1
    kind: fully-homomorphic-encryption
    capability: fhe-evaluation
    provider_id_seed: 211
    artifact_seed: 212
    parameter_set_seed: 213
    review_evidence_seed: 214
    external_review_completed: true
    production_claim_requested: true
    expected_binding_digest_hex: 0442d6ed82f37e5ef250cdf136e648c157af50f1d5e987eb66c1d0f57a5a8037
reexport_retirement:
  status: removed
  target_state: provider-vocabulary-imports-use-contract-crate-directly
  vocabulary_owner: crates/kiva-secret-provider-contract/src/lib.rs
  generated_registry_owner: crates/kiva-secret-provider-contract/src/kind_registry.rs
  compatibility_reexport_owner: crates/kiva-confidential/src/mechanism/provider.rs
  compatibility_ledger_entry: secret-provider-compat-reexports
  compatibility_surface: kiva-confidential::mechanism::provider
  direct_import_surface: kiva-secret-provider-contract
  retirement_rule: new provider-kind vocabulary imports target kiva-secret-provider-contract directly; the kiva-confidential compatibility-only re-export surface has been removed and remains only as compatibility ledger history
  required_terms:
    vocabulary_owner:
      - SecretComputeProviderKind
      - SecretComputeProviderKindContract
      - ComputeMechanismProviderKind
    compatibility_reexport_owner: []
  removed_terms:
    compatibility_reexport_owner:
      - pub use kiva_secret_provider_contract
evidence:
  contract_vocabulary: crates/kiva-secret-provider-contract/src/lib.rs
  rust_core: crates/kiva-confidential/src/lib.rs
  provider_kind_registry: spec/confidential/secret-compute-provider-kind-registry.yaml
  provider_kind_registry_rust: crates/kiva-secret-provider-contract/src/kind_registry.rs
  provider_kind_registry_generator: scripts/ci/generate_secret_compute_provider_kind_registry.py
  architecture_note: docs/architecture/secret-compute-provider-integration.md
  validator: scripts/ci/validate_secret_compute_provider_contract.py
  assurance_package: spec/confidential/confidential-computation-assurance-package.yaml
  pds_milestones: docs/architecture/pds-milestones.md
  confidential_milestones: docs/architecture/confidential-computation-milestones.md
non_goals:
  reference_provider_production_cryptography: false
  kiva_holds_raw_secret_material_by_default: false
  kiva_claims_external_provider_security_without_review: false
  kiva_standardizes_provider_ciphertext_wire_formats: false
