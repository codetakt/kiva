---
schema_version: 1
kind: tee-attestation-assurance-profile
standard: Kiva Architecture
status: published
profile: kiva-tee-portable-attestation-v1
claim_boundary: >
  Kiva supports a portable, deployment-bound TEE attestation evidence gate.
  It binds secret provisioning and result release to structured evidence for a
  configured job, measurement, image provenance digest, policy binding,
  freshness window, monotonic sequence, replay metadata, and policy approval.
  It is not a hardware remote-attestation verifier for Nitro, SGX, SEV-SNP, or
  any vendor quote format.
supported_tee:
  family: deployment-bound-portable
  format: portable-evidence-v1
  vendor_quote_verification: false
  hardware_families:
    - external-deployment-boundary
attestation:
  digest: sha256
  domain: kiva-confidential:tee-attestation-evidence:v1
  profile: kiva-tee-portable-attestation-v1
  records_measurement: true
  records_image_digest: true
  records_policy_binding: true
  records_evidence_digest: true
  records_evidence_sequence: true
admission:
  requires_policy_approval: true
  requires_supported_format: true
  requires_job_binding: true
  requires_measurement_match: true
  requires_image_digest_match: true
  requires_policy_binding_match: true
  requires_fresh_evidence_window: true
  rejects_rollback_sequence: true
  rejects_replay: true
  rejects_digest_mismatch: true
secrets:
  provisioned_only_after_attestation: true
  provisioned_only_after_policy_approval: true
result_release:
  requires_accepted_attestation: true
  requires_job_binding: true
  requires_policy_approval: true
vectors:
  path: spec/confidential/tee-attestation-vectors.yaml
  required_profile: kiva-tee-portable-attestation-v1
job_contract:
  path: spec/confidential/tee-attestation-job-contract.yaml
evidence:
  rust_core: crates/kiva-confidential/src/lib.rs
  vectors: spec/confidential/tee-attestation-vectors.yaml
  job_contract: spec/confidential/tee-attestation-job-contract.yaml
  kani_runner: scripts/ci/run_kani_verification.sh
  tamarin_model: proofs/tamarin/kiva_tee_attestation_boundary.spthy
  design_note: docs/architecture/tee-attestation-boundary.md
  operator_runbook: docs/operations/tee-attestation-runbook.md
non_goals:
  verifies_vendor_quote: false
  proves_hardware_side_channel_resistance: false
  proves_cloud_operator_isolation: false
  proves_enclave_runtime_correctness: false
