schema_version: 1
kind: kiva-secret-compute-provider-tck-source
status: active
description: >
  Technology Compatibility Kit source ledger for Kiva's secret/confidential
  compute provider contract. These cases are contract-level fixtures for
  external provider integrations; they do not claim production security for any
  provider implementation.
provider_contract: spec/confidential/secret-compute-provider-contract.yaml
mechanism_catalog: spec/confidential/mechanism-catalog.source.yaml
tck_model:
  root_type: SecretComputeProviderTck
  claim_boundary: contract-level-provider-compatibility-aid
  case_flow:
    - provider-kind
    - capability
    - profile
    - evidence
    - admission
    - runtime-boundary
    - release-gate
  non_goal: cryptographic-runtime-certification
provider_kind_coverage:
  compute_case_provider_kinds:
    - reference-primitive
    - trusted-execution-environment
    - fully-homomorphic-encryption
    - private-set-intersection
    - threshold-cryptography
  metadata_only_provider_kinds:
    - secret-custody
  required_profiles:
    - kiva-reference-primitives-v1
    - kiva-secret-compute-provider-contract-v1
cases:
  - id: reference-additive-fixture-admitted
    mechanism_catalog_id: additive-n-of-n
    provider_kind: reference-primitive
    capability: reference-fixtures
    profile: kiva-reference-primitives-v1
    parameter_set_digest_present: false
    review_evidence_digest_present: false
    external_review_completed: false
    production_claim_requested: false
    expected_result: admitted
    expected_evidence_gate: reference-fixture
    expected_release_gate: fixture-only
    expected_runtime_class: reference
  - id: reference-fhe-fixture-admitted
    mechanism_catalog_id: fhe-sum-feasibility
    provider_kind: reference-primitive
    capability: reference-fixtures
    profile: kiva-reference-primitives-v1
    parameter_set_digest_present: false
    review_evidence_digest_present: false
    external_review_completed: false
    production_claim_requested: false
    expected_result: admitted
    expected_evidence_gate: reference-fixture
    expected_release_gate: fixture-only
    expected_runtime_class: reference
  - id: reference-production-claim-rejected
    mechanism_catalog_id: additive-n-of-n
    provider_kind: reference-primitive
    capability: reference-fixtures
    profile: kiva-reference-primitives-v1
    parameter_set_digest_present: false
    review_evidence_digest_present: false
    external_review_completed: false
    production_claim_requested: true
    expected_result: rejected
    expected_error: ReferencePrimitiveProviderProductionClaimRejected
  - id: fhe-reviewed-production-admitted
    mechanism_catalog_id: fhe-sum-runtime
    provider_kind: fully-homomorphic-encryption
    capability: fhe-evaluation
    profile: kiva-secret-compute-provider-contract-v1
    parameter_set_digest_present: true
    review_evidence_digest_present: true
    external_review_completed: true
    production_claim_requested: true
    expected_result: admitted
    expected_evidence_gate: external-reviewed
    expected_release_gate: production
    expected_runtime_class: external-reviewed-production
  - id: fhe-production-missing-parameter-rejected
    mechanism_catalog_id: fhe-sum-runtime
    provider_kind: fully-homomorphic-encryption
    capability: fhe-evaluation
    profile: kiva-secret-compute-provider-contract-v1
    parameter_set_digest_present: false
    review_evidence_digest_present: true
    external_review_completed: true
    production_claim_requested: true
    expected_result: rejected
    expected_error: SecretComputeProviderParameterSetRequired
  - id: fhe-production-missing-review-rejected
    mechanism_catalog_id: fhe-sum-runtime
    provider_kind: fully-homomorphic-encryption
    capability: fhe-evaluation
    profile: kiva-secret-compute-provider-contract-v1
    parameter_set_digest_present: true
    review_evidence_digest_present: false
    external_review_completed: false
    production_claim_requested: true
    expected_result: rejected
    expected_error: ExternalProviderReviewRequired
  - id: psi-non-production-parameterized-admitted
    mechanism_catalog_id: private-set-intersection
    provider_kind: private-set-intersection
    capability: psi-evaluation
    profile: kiva-secret-compute-provider-contract-v1
    parameter_set_digest_present: true
    review_evidence_digest_present: false
    external_review_completed: false
    production_claim_requested: false
    expected_result: admitted
    expected_evidence_gate: external-non-production
    expected_release_gate: non-production
    expected_runtime_class: external-non-production
  - id: psi-non-production-missing-parameter-rejected
    mechanism_catalog_id: private-set-intersection
    provider_kind: private-set-intersection
    capability: psi-evaluation
    profile: kiva-secret-compute-provider-contract-v1
    parameter_set_digest_present: false
    review_evidence_digest_present: false
    external_review_completed: false
    production_claim_requested: false
    expected_result: rejected
    expected_error: SecretComputeProviderParameterSetRequired
  - id: tee-reviewed-production-admitted
    mechanism_catalog_id: trusted-execution-environment-aws-nitro
    provider_kind: trusted-execution-environment
    capability: tee-attestation
    profile: kiva-secret-compute-provider-contract-v1
    parameter_set_digest_present: false
    review_evidence_digest_present: true
    external_review_completed: true
    production_claim_requested: true
    expected_result: admitted
    expected_evidence_gate: external-reviewed
    expected_release_gate: production
    expected_runtime_class: external-reviewed-production
  - id: threshold-reviewed-production-admitted
    mechanism_catalog_id: threshold-frost-signing
    provider_kind: threshold-cryptography
    capability: threshold-signing
    profile: kiva-secret-compute-provider-contract-v1
    parameter_set_digest_present: true
    review_evidence_digest_present: true
    external_review_completed: true
    production_claim_requested: true
    expected_result: admitted
    expected_evidence_gate: external-reviewed
    expected_release_gate: production
    expected_runtime_class: external-reviewed-production
