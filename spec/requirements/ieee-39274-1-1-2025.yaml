standard: IEEE/ISO/IEC 39274-1-1-2025
title: xAPI LRS requirement catalog
source:
  repository: xapi-base-standard-documentation
  document: 9274.1.1 xAPI Base Standard for LRSs.md
notes:
  - >
    This catalog paraphrases normative LRS requirements for traceability. It is
    not a replacement for the IEEE standard text.
  - >
    OpenAPI projections identify whether a requirement is represented directly
    by paths, parameters, schemas, headers, and responses, or indirectly by a
    Kiva extension that must be discharged by tests or formal models.

requirements:
  - id: xapi-lrs-4.1.1-headers
    clause: "4.1.1"
    level: shall
    area: http
    summary: The LRS implements and validates the xAPI request and response headers that apply to each request context.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.2-utf8
    clause: "4.1.2"
    level: shall
    area: encoding
    summary: Strings are encoded and interpreted as UTF-8.
    projection: assertion
  - id: xapi-lrs-4.1.3-json-statement-batches
    clause: "4.1.3"
    level: shall
    area: media-type
    summary: JSON PUT or POST Statement batches without embedded attachment data are accepted when otherwise valid.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.3-attachment-sha2-match
    clause: "4.1.3"
    level: shall-not
    area: attachment
    summary: Attachment raw data is matched to attachment metadata only by SHA-2 hash comparison.
    projection: assertion
  - id: xapi-lrs-4.1.3-attachment-transmission-criteria
    clause: "4.1.3"
    level: shall
    area: attachment
    summary: Statement transmissions with attachments use either JSON with fileUrl coverage or RFC 2046 multipart/mixed.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.3-multipart-first-json
    clause: "4.1.3"
    level: shall
    area: attachment
    summary: Multipart Statement transmissions place the Statement JSON in the first application/json part.
    projection: assertion
  - id: xapi-lrs-4.1.3-multipart-attachment-headers
    clause: "4.1.3"
    level: shall
    area: attachment
    summary: Multipart attachment parts include the xAPI hash header and binary transfer encoding.
    projection: assertion
  - id: xapi-lrs-4.1.3-attachment-header-property-match
    clause: "4.1.3"
    level: shall
    area: attachment
    summary: Attachment part headers and attachment object properties match where both specify the same value.
    projection: assertion
  - id: xapi-lrs-4.1.3-multipart-accept-valid
    clause: "4.1.3"
    level: shall
    area: attachment
    summary: Valid multipart Statement batches are accepted, including batches with no attachment objects or only fileUrl attachments.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.3-multipart-reject-unmatched
    clause: "4.1.3"
    level: shall
    area: attachment
    summary: Multipart Statement batches are rejected when attachment objects lack both fileUrl and matching received attachment data.
    projection: assertion
  - id: xapi-lrs-4.1.4-etag-on-document-get
    clause: "4.1.4"
    level: shall
    area: concurrency
    summary: Document resource GET responses include an ETag header.
    projection: openapi
  - id: xapi-lrs-4.1.4-if-match
    clause: "4.1.4"
    level: shall
    area: concurrency
    summary: Document PUT, POST, and DELETE requests handle If-Match preconditions for optimistic concurrency.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.4-precondition-failed
    clause: "4.1.4"
    level: shall
    area: concurrency
    summary: Failed document preconditions return 412 and do not modify the target resource.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.4-put-conflict
    clause: "4.1.4"
    level: shall
    area: concurrency
    summary: PUT to an existing document without a conditional header returns 409, explains checking the current resource and using If-Match with its current ETag, and does not modify the resource.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.5-error-most-appropriate
    clause: "4.1.5"
    level: shall
    area: error
    summary: The LRS returns the most appropriate xAPI error code for each error condition.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.5-unknown-parameters
    clause: "4.1.5"
    level: shall
    area: error
    summary: Unrecognized parameters in a specified context are rejected with 400 unless intentionally extended.
    projection: assertion
  - id: xapi-lrs-4.1.5-parameter-case
    clause: "4.1.5"
    level: shall
    area: error
    summary: Parameters matching specified parameters except for case are rejected with 400.
    projection: assertion
  - id: xapi-lrs-4.1.5-batch-rejection
    clause: "4.1.5"
    level: shall
    area: statement
    summary: A Statement batch is rejected when any Statement in that batch is rejected.
    projection: assertion
  - id: xapi-lrs-4.1.5-unauthorized
    clause: "4.1.5"
    level: shall
    area: authorization
    summary: Requests with credentials that are required but refused are rejected with 401.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.5-forbidden
    clause: "4.1.5"
    level: shall
    area: authorization
    summary: Credential-based permission denials are rejected with 403.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.5-too-large
    clause: "4.1.5"
    level: shall
    area: error
    summary: Oversized Statements, documents, or attachments are rejected with 413.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.5-rate-limit
    clause: "4.1.5"
    level: shall
    area: error
    summary: Requests rejected due to rate limits are rejected with 429.
    projection: openapi
  - id: xapi-lrs-4.1.6-support-resources
    clause: "4.1.6"
    level: shall
    area: resource
    summary: The LRS supports all standard xAPI LRS resource families.
    projection: openapi
  - id: xapi-lrs-4.1.6-document-no-prior-knowledge
    clause: "4.1.6"
    level: shall-not
    area: document
    summary: Document resources are not rejected solely because the LRS lacks prior knowledge of the Activity or Agent.
    projection: assertion
  - id: xapi-lrs-4.1.6-request-parameter-validation
    clause: "4.1.6"
    level: shall
    area: validation
    summary: Request parameters are rejected when required values are missing, null, wrongly typed, malformed, case-invalid, disallowed, or scheme-less where an IRI or IRL is required.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.6.1-statement-put-duplicate-no-modification
    clause: "4.1.6.1"
    level: shall-not
    area: statement
    summary: PUT with a known statementId does not modify the existing Statement or any other object.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-statement-post-duplicate-no-modification
    clause: "4.1.6.1"
    level: shall-not
    area: statement
    summary: POST with a Statement id already stored by the LRS does not modify the existing Statement or any other object.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-statement-post-duplicate-batch-id
    clause: "4.1.6.1"
    level: shall
    area: statement
    summary: A POST batch with duplicate Statement ids inside the submitted batch is rejected with 400.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-statement-get-id-mutual-exclusion
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: Requests containing both statementId and voidedStatementId are rejected with 400.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-statement-get-single-query-limits
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: Single Statement retrieval by id allows only attachments and format as additional query parameters.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-statement-get-empty-result
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: Multiple Statement queries with no matches still return 200 with a StatementResult containing an empty statements array.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-statement-query-filters
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: Multiple Statement queries apply agent, verb, activity, and registration filters to matching Statement fields.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-statement-query-related-agents
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: Multiple Statement queries with related_agents=true include related Agents and Groups from authority and context.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-statement-query-related-activities
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: Multiple Statement queries with related_activities=true include contextActivities.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-statement-query-time-order-limit
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: Multiple Statement queries apply since, until, ascending, and limit according to stored-time query semantics.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-statement-consistent-through
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: Statement resource responses include X-Experience-API-Consistent-Through.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.6.1-statement-get-attachments-true
    clause: "4.1.6.1"
    level: shall
    area: attachment
    summary: GET Statements with attachments=true uses multipart response format with all attachments.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.6.1-statement-get-attachments-false
    clause: "4.1.6.1"
    level: shall-not
    area: attachment
    summary: GET Statements with attachments=false omits raw attachment data and reports application/json.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.6.1-statement-last-modified
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: Statement GET responses include Last-Modified using the most recent stored timestamp among returned Statements.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.6.1-statement-format-exact
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: exact and default formats return Agent, Group, Activity and Verb data as received, including display values as included or omitted, subject to explicitly permitted transformations.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-statement-format-ids
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: ids format returns only minimum identifying information in Agent, Group, Activity and Verb Objects, including the identifying information of each anonymous Group member.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-statement-format-canonical-agents
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: canonical format returns original Agent and Group Objects as in exact format.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-statementref-filtering
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: StatementRef query expansion applies non-time filters recursively while time and sequence filters apply to the targeting Statement.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-canonical-language-map-one-language
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: canonical format returns one language entry per Activity language map and per other map that the LRS elects to canonicalize.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-canonical-accept-language
    clause: "4.1.6.1"
    level: shall
    area: statement-query
    summary: canonical language selection applies Accept-Language per language map.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-voided-not-returned
    clause: "4.1.6.1"
    level: shall-not
    area: statement-voiding
    summary: Voided Statements are not returned unless requested through voidedStatementId.
    projection: assertion
  - id: xapi-lrs-4.1.6.1-voided-targeting-returned
    clause: "4.1.6.1"
    level: shall
    area: statement-voiding
    summary: Statements targeting a voided Statement remain returnable according to normal query processing.
    projection: assertion
  - id: xapi-lrs-4.1.6.2-state-post-json-merge
    clause: "4.1.6.2"
    level: shall
    area: document
    summary: State POST with application/json against an existing application/json document merges top-level object properties.
    projection: assertion
  - id: xapi-lrs-4.1.6.2-state-post-merge-reject-invalid
    clause: "4.1.6.2"
    level: shall
    area: document
    summary: Invalid State JSON merge inputs return 400 and do not update the target document.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.6.2-state-post-merge-success
    clause: "4.1.6.2"
    level: shall
    area: document
    summary: Successful State POST merge returns 204.
    projection: openapi
  - id: xapi-lrs-4.1.6.2-state-get-last-modified
    clause: "4.1.6.2"
    level: shall
    area: document
    summary: Single State document GET includes Last-Modified.
    projection: openapi
  - id: xapi-lrs-4.1.6.3-agents-person-fallback
    clause: "4.1.6.3"
    level: shall
    area: agent
    summary: The Agents resource returns a Person object even when only the requested Agent information is known.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.6.3-person-arrays
    clause: "4.1.6.3"
    level: shall
    area: agent
    summary: Person object array properties contain members with the corresponding Agent property definitions.
    projection: openapi
  - id: xapi-lrs-4.1.6.4-activity-fallback
    clause: "4.1.6.4"
    level: shall
    area: activity
    summary: The Activities resource returns an Activity object even when no canonical Activity definition is stored.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.6.4-activity-complete
    clause: "4.1.6.4"
    level: shall
    area: activity
    summary: The Activities resource returns all available information about the requested Activity under the LRS's declared canonical metadata policy; no particular metadata update or merge policy is required.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.6.5-agent-profile-post-json-merge
    clause: "4.1.6.5"
    level: shall
    area: document
    summary: Agent Profile POST with application/json against an existing application/json document merges top-level object properties.
    projection: assertion
  - id: xapi-lrs-4.1.6.5-agent-profile-post-merge-reject-invalid
    clause: "4.1.6.5"
    level: shall
    area: document
    summary: Invalid Agent Profile JSON merge inputs return 400 and do not update the target document.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.6.5-agent-profile-post-merge-success
    clause: "4.1.6.5"
    level: shall
    area: document
    summary: Successful Agent Profile POST merge returns 204.
    projection: openapi
  - id: xapi-lrs-4.1.6.5-agent-profile-get-last-modified
    clause: "4.1.6.5"
    level: shall
    area: document
    summary: Single Agent Profile document GET includes Last-Modified.
    projection: openapi
  - id: xapi-lrs-4.1.6.6-activity-profile-post-json-merge
    clause: "4.1.6.6"
    level: shall
    area: document
    summary: Activity Profile POST with application/json against an existing application/json document merges top-level object properties.
    projection: assertion
  - id: xapi-lrs-4.1.6.6-activity-profile-post-merge-reject-invalid
    clause: "4.1.6.6"
    level: shall
    area: document
    summary: Invalid Activity Profile JSON merge inputs return 400 and do not update the target document.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.6.6-activity-profile-post-merge-success
    clause: "4.1.6.6"
    level: shall
    area: document
    summary: Successful Activity Profile POST merge returns 204.
    projection: openapi
  - id: xapi-lrs-4.1.6.6-activity-profile-get-last-modified
    clause: "4.1.6.6"
    level: shall
    area: document
    summary: Single Activity Profile document GET includes Last-Modified.
    projection: openapi
  - id: xapi-lrs-4.1.6.7-about-version
    clause: "4.1.6.7"
    level: shall
    area: about
    summary: About returns a JSON object whose version property includes the latest minor and patch version supported for each major version.
    projection: openapi
  - id: xapi-lrs-4.1.6.7-about-version-header-not-rejected
    clause: "4.1.6.7"
    level: shall-not
    area: about
    summary: About requests are not rejected solely because of the xAPI version header.
    projection: assertion
  - id: xapi-lrs-4.1.7-version-header-every-response
    clause: "4.1.7"
    level: shall
    area: versioning
    summary: Every LRS response includes X-Experience-API-Version.
    projection: openapi
  - id: xapi-lrs-4.1.7-version-header-latest-patch
    clause: "4.1.7"
    level: shall
    area: versioning
    summary: The version response header is set to the latest supported xAPI patch version.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.7-version-2-0-alias
    clause: "4.1.7"
    level: shall
    area: versioning
    summary: Requests declaring xAPI version 2.0 are accepted as 2.0.0.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.7-version-reject-before-2
    clause: "4.1.7"
    level: shall
    area: versioning
    summary: Requests with xAPI versions before 2.0.0 are rejected unless routed to a conformant earlier implementation.
    projection: assertion
  - id: xapi-lrs-4.1.7-version-reject-2-1-or-greater
    clause: "4.1.7"
    level: shall
    area: versioning
    summary: Requests with xAPI version 2.1.0 or greater are rejected.
    projection: assertion
  - id: xapi-lrs-4.1.7-version-reject-400
    clause: "4.1.7"
    level: shall
    area: versioning
    summary: Version rejections return 400 with a short problem description.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.1.8-authorization-decisions
    clause: "4.1.8"
    level: shall
    area: authorization
    summary: The LRS handles or delegates Statement validity and operation permission decisions based on credentials.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2-statement-immutability-preserve
    clause: "4.2"
    level: shall
    area: statement
    summary: Statement storage, retrieval, and comparison preserve xAPI immutability requirements for Actor, Verb, Object, and Duration, subject to stated exceptions.
    projection: assertion
  - id: xapi-lrs-4.2-statement-immutability-ignore-excluded
    clause: "4.2"
    level: shall-not
    area: statement
    summary: Statement equivalence does not depend on excluded properties such as id, authority, stored, timestamp, version, attachments, group member order, or referenced Activity definitions.
    projection: assertion
  - id: xapi-lrs-4.2.1-statement-type-validation
    clause: "4.2.1"
    level: shall
    area: validation
    summary: Statements are rejected when fields fail the specified type requirements.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.1-statement-extra-properties
    clause: "4.2.1"
    level: shall
    area: validation
    summary: Statements are rejected for additional properties outside extension locations.
    projection: assertion
  - id: xapi-lrs-4.2.1-statement-invalid-iris
    clause: "4.2.1"
    level: shall
    area: validation
    summary: Statements with invalid IRIs are rejected.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.1-statement-duplicate-properties
    clause: "4.2.1"
    level: shall
    area: validation
    summary: Statements using a property more than once are rejected.
    projection: assertion
  - id: xapi-lrs-4.2.1-statement-required-null-case
    clause: "4.2.1"
    level: shall
    area: validation
    summary: Statements are rejected for missing required properties, nulls outside extensions, wrong primitive types, malformed formatted strings, case mismatches, disallowed keys, or scheme-less IRIs/IRLs.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.3-object-default-activity
    clause: "4.2.2.3"
    level: shall
    area: statement
    summary: Statement objects without objectType are treated as Activity objects.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2-statement-version-format
    clause: "4.2.2"
    level: shall
    area: validation
    summary: A supplied Statement version is a string formatted according to Semantic Versioning 1.0.0.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.2-verb-properties
    clause: "4.2.2.2"
    level: shall
    area: validation
    summary: A Verb contains a required IRI id and an optional Language Map display, with no properties outside the Verb table.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.3-activity-properties
    clause: "4.2.2.3"
    level: shall
    area: validation
    summary: An Activity contains a required IRI id, an optional Activity objectType, and an optional Activity Definition object.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.3-activity-definition-properties
    clause: "4.2.2.3"
    level: shall
    area: validation
    summary: Activity Definition and interaction component properties follow their table types, required members, IRI formats, and controlled interactionType vocabulary.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.3-substatement-properties
    clause: "4.2.2.3"
    level: shall
    area: validation
    summary: A SubStatement has the required objectType, actor, verb, and object properties, excludes id, stored, authority and version, and has its omitted timestamp populated by the LRS.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.6-attachment-properties
    clause: "4.2.2.6"
    level: shall
    area: validation
    summary: Attachment metadata contains the required usageType, display, contentType, non-negative length, and sha2 properties with the table-defined types and optional description and fileUrl.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.1-actor-object-type
    clause: "4.2.2.1"
    level: shall
    area: validation
    summary: Actor objectType values and optional names follow the Agent and Group table types and role-specific values.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.1-agent-exactly-one-ifi
    clause: "4.2.2.1"
    level: shall
    area: validation
    summary: Every Agent contains exactly one of mbox, mbox_sha1sum, openid, or account.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.1-group-identification
    clause: "4.2.2.1"
    level: shall
    area: validation
    summary: An identified Group contains exactly one IFI, while an anonymous Group contains a required member array and no IFI.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.1-group-member-agent
    clause: "4.2.2.1"
    level: shall
    area: validation
    summary: Every Group member is an Agent object satisfying the Agent table requirements.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.1-actor-ifi-formats
    clause: "4.2.2.1"
    level: shall
    area: validation
    summary: Actor mbox, mbox_sha1sum, and openid values follow their mailto IRI, hexadecimal SHA-1, and absolute URI formats.
    projection: assertion
  - id: xapi-lrs-4.2.2.1-actor-account-shape
    clause: "4.2.2.1"
    level: shall
    area: validation
    summary: Actor Account objects contain the required string homePage and name properties, with homePage expressed as an absolute IRL.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.4-result-properties
    clause: "4.2.2.4"
    level: shall
    area: validation
    summary: Result objects contain only the defined result properties, with success and completion as Booleans, response as a String, duration as a Duration, and extensions as an extension map.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.4-score-properties
    clause: "4.2.2.4"
    level: shall
    area: validation
    summary: Score objects contain only scaled, raw, min, and max numeric properties; scaled is within -1 and 1, raw is within present min and max bounds, and min is less than max when both are present.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.5-context-properties
    clause: "4.2.2.5"
    level: shall
    area: validation
    summary: Context objects contain only the defined context properties, with registration and statement references as UUID-backed objects, revision and platform as Strings, language as an RFC 5646 String, and extensions as an extension map.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.5-context-activities
    clause: "4.2.2.5"
    level: shall
    area: validation
    summary: contextActivities objects use only parent, grouping, category, and other keys, and every value is either an Activity object or an array of Activity objects.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.5-context-agent-relations
    clause: "4.2.2.5"
    level: shall
    area: validation
    summary: contextAgents is an array of contextAgent objects with objectType contextAgent, a valid Agent object, and optional non-empty relevantTypes containing only IRI strings.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.2.5-context-group-relations
    clause: "4.2.2.5"
    level: shall
    area: validation
    summary: contextGroups is an array of contextGroup objects with objectType contextGroup, a valid Group object, and optional non-empty relevantTypes containing only IRI strings.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.4.1-voided-target-missing-not-rejected
    clause: "4.2.4.1"
    level: shall-not
    area: statement-voiding
    summary: A Statement using the voided verb is not rejected solely because the target Statement id is not found.
    projection: assertion
  - id: xapi-lrs-4.2.4.1-future-timestamp-not-rejected
    clause: "4.2.4.1"
    level: shall-not
    area: validation
    summary: A timestamp is not rejected solely because it is in the future within the implementation's acceptable margin.
    projection: assertion
  - id: xapi-lrs-4.2.4.2-return-serialization
    clause: "4.2.4.2"
    level: shall-not
    area: statement
    summary: The LRS does not return a different serialization of preserved Statement properties except as allowed by the data requirements.
    projection: assertion
  - id: xapi-lrs-4.2.4.2-create-statement-id
    clause: "4.2.4.2"
    level: shall
    area: statement
    summary: The LRS creates an id property for accepted Statements that do not include one.
    projection: assertion
  - id: xapi-lrs-4.2.4.2-actor-single-ifi
    clause: "4.2.4.2"
    level: shall
    area: validation
    summary: Statements are rejected when an Actor object contains more than one inverse functional identifier.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.4.2-no-group-member-group
    clause: "4.2.4.2"
    level: shall
    area: validation
    summary: Statements are rejected when a Group member is itself a Group.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.4.2-number-precision
    clause: "4.2.4.2"
    level: shall
    area: data
    summary: Numbers are processed and stored with at least IEEE 754 single precision.
    projection: assertion
  - id: xapi-lrs-4.2.4.2-interaction-type
    clause: "4.2.4.2"
    level: shall
    area: validation
    summary: Interaction Activities without a valid interactionType are rejected.
    projection: assertion
  - id: xapi-lrs-4.2.4.2-no-nested-substatement
    clause: "4.2.4.2"
    level: shall
    area: validation
    summary: Statements with a SubStatement whose object is another SubStatement are rejected.
    projection: openapi
  - id: xapi-lrs-4.2.4.2-timestamp-default
    clause: "4.2.4.2"
    level: shall
    area: statement
    summary: If timestamp is omitted, the LRS sets timestamp to the stored timestamp.
    projection: assertion
  - id: xapi-lrs-4.2.4.2-stored-set-by-lrs
    clause: "4.2.4.2"
    level: shall
    area: statement
    summary: The stored property is set by the LRS and any submitted stored value is overwritten; validating that submitted value is recommended.
    projection: assertion
  - id: xapi-lrs-4.2.4.2-authority-present
    clause: "4.2.4.2"
    level: shall
    area: statement
    summary: All stored Statements have an authority.
    projection: assertion
  - id: xapi-lrs-4.2.4.2-authority-deterministic
    clause: "4.2.4.2"
    level: shall
    area: authorization
    summary: When authority is overwritten, credentials are mapped to authority through a deterministic process.
    projection: assertion
  - id: xapi-lrs-4.2.4.2-context-activities-array
    clause: "4.2.4.2"
    level: shall
    area: statement
    summary: Returned contextActivities values are arrays even when submitted as single Activity objects.
    projection: assertion
  - id: xapi-lrs-4.2.4.3-version-retention
    clause: "4.2.4.3"
    level: shall
    area: statement
    summary: Returned Statements retain the accepted version, and missing versions are set to 2.0.0.
    projection: assertion
  - id: xapi-lrs-4.2.5-voided-verb-rejection
    clause: "4.2.5"
    level: shall
    area: statement-voiding
    summary: Voiding Statements are rejected when their object is not a StatementRef with an id.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.5-voided-state
    clause: "4.2.5"
    level: shall
    area: statement-voiding
    summary: A Statement is considered voided exactly when a non-voiding Statement is targeted by a stored voiding Statement.
    projection: assertion
  - id: xapi-lrs-4.2.6-signed-statement-attachment
    clause: "4.2.6"
    level: shall
    area: signing
    summary: Signed Statements include a JWS attachment with the specified signature usage type and application/octet-stream content type.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.6-jws-compact
    clause: "4.2.6"
    level: shall
    area: signing
    summary: Statement signatures use JWS Compact Serialization.
    projection: assertion
  - id: xapi-lrs-4.2.6-jws-payload
    clause: "4.2.6"
    level: shall
    area: signing
    summary: The JWS payload is a valid JSON serialization of the complete Statement before the signature was added.
    projection: assertion
  - id: xapi-lrs-4.2.6-jws-algorithm
    clause: "4.2.6"
    level: shall
    area: signing
    summary: Statement signatures use RS256, RS384, or RS512.
    projection: assertion
  - id: xapi-lrs-4.2.6-reject-malformed-signature
    clause: "4.2.6"
    level: shall
    area: signing
    summary: Requests storing Statements with malformed signatures are rejected with 400.
    projection: openapi-and-assertion
  - id: xapi-lrs-4.2.6-verify-signature
    clause: "4.2.6"
    level: shall
    area: signing
    summary: Signature verification decodes the JWS, checks logical Statement equivalence, validates x5c certificate signatures when present, and enforces signature requirements.
    projection: assertion
  - id: xapi-lrs-4.2.7-iri-comparison
    clause: "4.2.7"
    level: shall
    area: datatype
    summary: IRI storage and comparison use the specified RFC 3987 comparison approaches.
    projection: assertion
  - id: xapi-lrs-4.2.7-extension-key-iri
    clause: "4.2.7"
    level: shall
    area: validation
    summary: Statements with extension map keys that are not IRIs are rejected.
    projection: assertion
  - id: xapi-lrs-4.2.7-extension-values
    clause: "4.2.7"
    level: shall-not
    area: validation
    summary: Statements are not rejected based on extension map values.
    projection: assertion
  - id: xapi-lrs-4.2.7-language-tags
    clause: "4.2.7"
    level: shall
    area: validation
    summary: Invalid language map keys are rejected, with at least RFC 5646 token-length validation.
    projection: assertion
  - id: xapi-lrs-4.2.7-uuid-string
    clause: "4.2.7"
    level: shall
    area: datatype
    summary: UUIDs use the standard string form.
    projection: openapi
  - id: xapi-lrs-4.2.7-timestamps-utc
    clause: "4.2.7"
    level: shall
    area: datatype
    summary: Timestamps are converted to UTC rather than rejected solely for non-UTC representation.
    projection: assertion
  - id: xapi-lrs-4.2.7-duration-format
    clause: "4.2.7"
    level: shall
    area: datatype
    summary: Invalid ISO 8601 duration format is rejected, the alternative time-point-like form is rejected, and comparison ignores precision beyond 0.01 second.
    projection: assertion
