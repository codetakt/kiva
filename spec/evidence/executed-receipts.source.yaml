schema_version: 1
kind: kiva-executed-receipts-source
status: active
description: >
  Source policy for release-specific executed receipt overlays. The committed
  generated overlay is intentionally allowed to contain zero executed receipts;
  release jobs can pass design-review or evidence-check run reports to the
  generator to produce command-output-hash-backed ReceiptRun rows.
inputs:
  declared_receipts: generated/evidence/evidence-receipts.yaml
  evidence_manifest: spec/ci/evidence-checks.yaml
generated_artifacts:
  overlay: generated/evidence/executed-receipt-overlay.yaml
  markdown: docs/architecture/generated/executed-receipt-overlay.md
run_model:
  root_type: ReceiptRun
  committed_overlay_status: no-run-recorded
  executed_status: executed
  rule: >
    Declared EvidenceReceipt and VerificationReceipt rows name required
    evidence identities. Executed ReceiptRun overlays bind those identities to
    concrete CI report files and sha256 hashes without replacing the declared
    receipt index.
