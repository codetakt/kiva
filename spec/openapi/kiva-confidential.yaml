        summaries:
          type: array
          items:
            $ref: "#/components/schemas/DifferentialPrivacyCompositionSummary"
    DifferentialPrivacyCompositionSummary:
      type: object
      additionalProperties: false
      description: >
        Sequential-composition accounting summary for one subject-owned budget.
        The basic sum remains the enforced budget boundary. The advanced
        composition fields expose a conservative DRV-style pure-DP upper bound
        for audit evidence.
      required:
        - budgetId
        - ownerSubject
        - accountingScope
        - compositionRule
        - advancedCompositionRule
        - advancedCompositionDeltaMicrounits
        - advancedCompositionEpsilonMicrounits
        - totalEpsilonMicrounits
        - budgetSpentEpsilonMicrounits
        - releaseSpentEpsilonMicrounits
        - releaseEpsilonSquareSumMicrounits2
        - unattributedSpentEpsilonMicrounits
        - remainingEpsilonMicrounits
        - releaseCount
        - maxReleaseEpsilonMicrounits
      properties:
        budgetId:
          $ref: "#/components/schemas/Hex32"
        ownerSubject:
          type: string
          minLength: 1
        accountingScope:
          type: string
          enum: [subjectBudget]
        compositionRule:
          type: string
          enum: [basicSequential]
        advancedCompositionRule:
          type: string
          enum: [drvPureDp]
        advancedCompositionDeltaMicrounits:
          $ref: "#/components/schemas/NonZeroU64"
        advancedCompositionEpsilonMicrounits:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        totalEpsilonMicrounits:
          $ref: "#/components/schemas/NonZeroU64"
        budgetSpentEpsilonMicrounits:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        releaseSpentEpsilonMicrounits:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        releaseEpsilonSquareSumMicrounits2:
          type: string
          pattern: "^[0-9]+$"
        unattributedSpentEpsilonMicrounits:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        remainingEpsilonMicrounits:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        releaseCount:
          type: integer
          minimum: 0
        maxReleaseEpsilonMicrounits:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
