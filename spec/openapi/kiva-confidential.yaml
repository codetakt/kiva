openapi: 3.1.0
info:
  title: Kiva Confidential Computation API
  version: 0.1.0
  summary: Kiva confidential additive-share workflow interface contract.
  description: >
    Machine-readable API contract for Kiva-specific confidential-computation
    endpoints. This contract is intentionally separate from the
    IEEE/ISO/IEC 39274-1-1:2025 xAPI LRS contract.
  license:
    name: Apache-2.0
servers:
  - url: /
    description: Kiva platform base resource.
tags:
  - name: Confidential Aggregates
  - name: Confidential Jobs
  - name: Confidential Participants
  - name: Differential Privacy Budgets
  - name: Differential Privacy Releases
  - name: Share Signing Keys
  - name: Share Submissions
  - name: Shamir Threshold Reconstructions
  - name: Threshold Releases
security:
  - bearerAuth: []
x-kiva-contract:
  area: confidential-computation
  status: Kiva platform extension, not part of the IEEE xAPI LRS surface.
  evidence:
