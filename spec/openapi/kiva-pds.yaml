      type: object
      additionalProperties: false
      required: [role, resource, action]
      properties:
        role:
          $ref: "#/components/schemas/PrincipalRole"
        resource:
          $ref: "#/components/schemas/ResourceClass"
        action:
          $ref: "#/components/schemas/PolicyAction"
        grant_id:
          $ref: "#/components/schemas/Uuid"
        data_product_id:
          description: >
            Optional PDS data product reference for aggregate insight reads.
            The referenced product must exist and be owned by the data subject
            represented by the active aggregate-insight consent grant.
          $ref: "#/components/schemas/Uuid"
    AccessCheckResponse:
      type: object
      additionalProperties: false
      required: [eventId, decision]
      properties:
        eventId:
          $ref: "#/components/schemas/Uuid"
        decision:
          $ref: "#/components/schemas/PolicyDecision"
        denyReason:
          type: string
    AccessAuditEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - requesterSubject
        - role
        - resource
        - action
        - decision
        - createdAt
      properties:
        eventId:
          $ref: "#/components/schemas/Uuid"
        requesterSubject:
          type: string
        role:
          $ref: "#/components/schemas/PrincipalRole"
        resource:
          $ref: "#/components/schemas/ResourceClass"
        action:
          $ref: "#/components/schemas/PolicyAction"
        grantId:
          $ref: "#/components/schemas/Uuid"
        dataProductId:
          $ref: "#/components/schemas/Uuid"
        decision:
          $ref: "#/components/schemas/PolicyDecision"
        denyReason:
          type: string
        createdAt:
          type: string
          format: date-time
    AccessAuditEventList:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AccessAuditEvent"
