openapi: 3.1.0
info:
  title: Kiva Personal Data Store API
  version: 0.3.0
  summary: Kiva consent, delegation, lifecycle metadata, governance, approved-data-product, and access-audit contract.
  description: >
    Machine-readable API contract for Kiva-specific Personal Data Store
    endpoints. This contract is intentionally separate from the
    IEEE/ISO/IEC 39274-1-1:2025 xAPI LRS contract.
  license:
    name: Apache-2.0
servers:
  - url: /
    description: Kiva platform base resource.
tags:
  - name: Consent Grants
  - name: Data Products
  - name: Provider Bindings
  - name: Lifecycle
  - name: Governance
  - name: Access Decisions
security:
  - bearerAuth: []
x-kiva-contract:
  area: personal-data-store
  status: Kiva platform extension, not part of the IEEE xAPI LRS surface.
  evidence:
