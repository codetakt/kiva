paths:
  /pds/consent-grants:
    get:
      tags: [Consent Grants]
      operationId: getPdsConsentGrants
      x-kiva-required-scopes: ["pds:read"]
      summary: List subject-scoped consent and delegation grants.
      parameters:
        - $ref: "#/components/parameters/GrantIdOptional"
      responses:
        "200":
          description: Consent grants visible to the authenticated subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentGrantList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Consent Grants]
      operationId: postPdsConsentGrant
      x-kiva-required-scopes: ["pds:delegate"]
      summary: Register an active consent/delegation grant owned by the authenticated subject.
      requestBody:
        $ref: "#/components/requestBodies/ConsentGrantRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /pds/consent-revocations:
    post:
      tags: [Consent Grants]
      operationId: postPdsConsentRevocation
      x-kiva-required-scopes: ["pds:revoke"]
      summary: Revoke a consent/delegation grant owned by the authenticated subject.
      requestBody:
        $ref: "#/components/requestBodies/ConsentRevocationRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /pds/data-products:
    get:
      tags: [Data Products]
      operationId: getPdsDataProducts
      x-kiva-required-scopes: ["pds:read"]
      summary: List approved data products registered by the authenticated subject.
      parameters:
        - $ref: "#/components/parameters/DataProductIdOptional"
      responses:
        "200":
          description: Approved data-product metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataProductList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Data Products]
      operationId: postPdsDataProduct
      x-kiva-required-scopes: ["pds:write"]
      summary: Register an approved aggregate data product for a confidential release.
      description: >
        The release_id must reference an available Kiva confidential release
        owned by the authenticated subject. Threshold-release artifacts must
        already be released; differential-privacy-release artifacts must already
        exist; shamir-threshold-reconstruction sources must reference persisted
        same-owner reconstruction metadata. The PDS response exposes a
        normalized releaseArtifact reference plus compatibility sourceKind and
        releaseId fields, but never aggregate payloads, reconstructed values,
        shares, signatures, or noise evidence.
      requestBody:
        $ref: "#/components/requestBodies/DataProductRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /pds/provider-bindings:
    get:
      tags: [Provider Bindings]
      operationId: getPdsProviderBindings
      x-kiva-required-scopes: ["pds:read"]
      summary: List secret/confidential-compute provider binding metadata.
      description: >
        Provider bindings are PDS-owned metadata entries admitted by Kiva's
        confidential provider contract. They expose provider class, digest,
        evidence-gate, release-gate, and runtime-boundary metadata only; they
        do not expose provider secrets, keys, ciphertexts, shares, signatures,
        or provider payloads.
      parameters:
        - $ref: "#/components/parameters/BindingIdOptional"
      responses:
        "200":
          description: Provider bindings visible to the authenticated subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderBindingList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Provider Bindings]
      operationId: postPdsProviderBinding
      x-kiva-required-scopes: ["pds:write"]
      summary: Register admitted provider binding metadata for PDS experiments.
      description: >
        The request is validated against the secret/confidential-compute
        provider contract before persistence. Reference providers are admitted
        only as fixture boundaries, while production claims require completed
        external review evidence under the provider contract.
      requestBody:
        $ref: "#/components/requestBodies/ProviderBindingRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /pds/data-product-reads:
    post:
      tags: [Data Products]
      operationId: postPdsDataProductRead
      x-kiva-required-scopes: ["pds:read"]
      summary: Read an approved data product through the PDS policy boundary.
      description: >
        The request is admitted only as an analyst aggregate-insight read over
        an existing PDS data product whose owner is the same data subject that
        delegated aggregate-insight access to the authenticated requester. Every
        request persists an access-audit event. Successful responses expose
        data-product metadata only; denied responses expose the decision and
        deny reason without data-product metadata.
      requestBody:
        $ref: "#/components/requestBodies/DataProductReadRequest"
      responses:
        "200":
          description: Data-product metadata admitted by the PDS policy boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataProductReadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The data-product read was denied by PDS policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataProductReadResponse"
  /pds/record-inventory:
    get:
      tags: [Lifecycle]
      operationId: getPdsRecordInventory
      x-kiva-required-scopes: ["pds:read"]
      summary: List subject-visible xAPI record metadata and registered data products.
      description: >
        The inventory exposes promoted xAPI metadata for the authenticated
        subject's PDS account IFI and approved data-product metadata. It does
        not expose raw Statement JSON, result payloads, aggregate payloads,
        shares, signatures, or noise evidence.
      responses:
        "200":
          description: Subject-visible PDS record inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordInventory"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /pds/metadata-exports:
    get:
      tags: [Lifecycle]
      operationId: getPdsMetadataExports
      x-kiva-required-scopes: ["pds:read"]
      summary: Export subject-owned PDS metadata without raw xAPI or confidential payloads.
      responses:
        "200":
          description: Subject-owned PDS metadata export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /pds/data-portability-exports:
    get:
      tags: [Lifecycle]
      operationId: getPdsDataPortabilityExports
      x-kiva-required-scopes: ["pds:read"]
      summary: Export the authenticated subject's accepted Statements and PDS metadata.
      description: >
        Returns only Statements whose canonical actor IFI is mapped from the
        authenticated principal. This governed PDS operation is not part of
        the IEEE/ISO/IEC 39274-1-1:2025 xAPI LRS conformance surface.
      parameters:
        - $ref: "#/components/parameters/PortabilityCursor"
        - $ref: "#/components/parameters/PortabilityPageSize"
      responses:
        "200":
          description: One audited learner-initiated portability export page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortabilityExport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /pds/lifecycle-events:
    get:
      tags: [Lifecycle]
      operationId: getPdsLifecycleEvents
      x-kiva-required-scopes: ["pds:read"]
      summary: List subject-scoped lifecycle events.
      parameters:
        - $ref: "#/components/parameters/EventIdOptional"
      responses:
        "200":
          description: PDS lifecycle events for the authenticated subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleEventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Lifecycle]
      operationId: postPdsLifecycleEvent
      x-kiva-required-scopes: ["pds:write"]
      summary: Register a subject-owned lifecycle event for PDS metadata.
      description: >
        Lifecycle events record export, retention review, correction/dispute,
        and tombstone metadata around immutable xAPI Statements and PDS
        resources. They do not mutate accepted xAPI Statements in place.
      requestBody:
        $ref: "#/components/requestBodies/LifecycleEventRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /pds/retention-policies:
    get:
      tags: [Lifecycle]
      operationId: getPdsRetentionPolicies
      x-kiva-required-scopes: ["pds:read"]
      summary: List subject-owned operational retention policies.
      description: >
        Retention policies define operational metadata for review schedules,
        retention periods, and tombstone publication rules. They do not mutate
        accepted xAPI Statements.
      parameters:
        - $ref: "#/components/parameters/PolicyIdOptional"
      responses:
        "200":
          description: Subject-owned retention policy metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPolicyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Lifecycle]
      operationId: postPdsRetentionPolicy
      x-kiva-required-scopes: ["pds:write"]
      summary: Register a subject-owned operational retention policy.
      requestBody:
        $ref: "#/components/requestBodies/RetentionPolicyRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /pds/lifecycle-cases:
    get:
      tags: [Lifecycle]
      operationId: getPdsLifecycleCases
      x-kiva-required-scopes: ["pds:read"]
      summary: List correction, dispute, and tombstone workflow cases.
      description: >
        Lifecycle cases are metadata-only operational workflows around xAPI and
        PDS resources. Case state is strict: new cases start open, progress to
        under-review, then resolve, reject, or tombstone without reopening.
      parameters:
        - $ref: "#/components/parameters/CaseIdOptional"
      responses:
        "200":
          description: Subject-owned operational lifecycle cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleCaseList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Lifecycle]
      operationId: postPdsLifecycleCase
      x-kiva-required-scopes: ["pds:write"]
      summary: Open or advance a correction, dispute, or tombstone workflow case.
      description: >
        Repeated identical submissions are idempotent. Incompatible metadata,
        non-open initial states, invalid status transitions, and terminal case
        rewrites are rejected. The operation records workflow metadata only.
      requestBody:
        $ref: "#/components/requestBodies/LifecycleCaseRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /pds/governance-profiles:
    get:
      tags: [Governance]
      operationId: getPdsGovernanceProfiles
      x-kiva-required-scopes: ["pds:read"]
      summary: List public-sector governance profiles owned by the authenticated subject.
      parameters:
        - $ref: "#/components/parameters/ProfileIdOptional"
      responses:
        "200":
          description: Subject-owned public-sector governance profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProfileList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Governance]
      operationId: postPdsGovernanceProfile
      x-kiva-required-scopes: ["pds:write"]
      summary: Register a strict public-sector governance deployment profile.
      description: >
        Governance profiles are Kiva PDS extension metadata for deployments
        where custody, platform operation, policy authority, analysis, audit,
        and optional identity authority are separated. Profiles declare tenant
        and subject partitioning, emergency-access policy, and operational
        runbook references. They do not expose raw xAPI Statements or
        confidential-computation payloads.
      requestBody:
        $ref: "#/components/requestBodies/GovernanceProfileRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /pds/access-checks:
    post:
      tags: [Access Decisions]
      operationId: postPdsAccessCheck
      x-kiva-required-scopes: ["pds:read"]
      summary: Evaluate the PDS policy boundary and persist an access-audit event.
      description: >
        When data_product_id is supplied, the request must be an aggregate
        insight read over an existing PDS data product whose owner is the same
        data subject that delegated access to the authenticated requester.
      requestBody:
        $ref: "#/components/requestBodies/AccessCheckRequest"
      responses:
        "200":
          description: Policy decision and audit event metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /pds/access-audit-events:
    get:
      tags: [Access Decisions]
      operationId: getPdsAccessAuditEvents
      x-kiva-required-scopes: ["pds:audit"]
      summary: List subject-scoped PDS access-audit events without raw payloads.
      parameters:
        - $ref: "#/components/parameters/EventIdOptional"
      responses:
        "200":
          description: PDS access-audit events visible to the authenticated subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessAuditEventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        OAuth/OIDC-derived bearer token accepted by the Kiva resource server.
        Each PDS operation declares the exact scope required in
        x-kiva-required-scopes. Missing or refused tokens fail with 401;
        accepted tokens without the required scope fail with 403.
  parameters:
    PortabilityCursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor returned by the previous export page.
      schema:
        type: string
        minLength: 1
    PortabilityPageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    GrantIdOptional:
      name: grantId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Uuid"
    DataProductIdOptional:
      name: dataProductId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Uuid"
    BindingIdOptional:
      name: bindingId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Uuid"
    EventIdOptional:
      name: eventId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Uuid"
    PolicyIdOptional:
      name: policyId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Uuid"
    CaseIdOptional:
      name: caseId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Uuid"
    ProfileIdOptional:
      name: profileId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Uuid"
  requestBodies:
    ConsentGrantRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConsentGrantRequest"
    ConsentRevocationRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConsentRevocationRequest"
    DataProductRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DataProductRequest"
    DataProductReadRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DataProductReadRequest"
    ProviderBindingRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProviderBindingRequest"
    LifecycleEventRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LifecycleEventRequest"
