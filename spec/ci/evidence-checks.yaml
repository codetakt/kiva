    outputs: []
    mutates_repository: false
    requires_network: false
    artifact_class: contract
    ci_command:
      entrypoint: scripts/ci/kiva-ci
      family: validate
      name: confidential-openapi-contract
    metadata_source: evidence-check-source
  - id: pds-openapi-contract
    check_kind: contract-validator
    script: scripts/ci/validate_pds_openapi.py
    args:
    - spec/openapi/kiva-pds.yaml
    inputs:
    - scripts/ci/validate_pds_openapi.py
