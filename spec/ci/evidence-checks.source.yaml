schema_version: 1
kind: kiva-ci-evidence-check-source
group_source: spec/ci/evidence-check-groups.source.yaml
projection_spec_source: spec/architecture/projection-specs.source.yaml
check_catalog_source: spec/ci/evidence-check-catalog.source.yaml
gate_plan_source: spec/ci/evidence-gate-plan.source.yaml
ci_execution_model:
  root_type: RegistryDrivenCommand
  primary_entrypoint: scripts/ci/kiva-ci
  command_registry: scripts/ci/kiva_ci/cli.py
  command_source: spec/ci/evidence-checks.yaml
  command_rule: >
    CheckCatalog and GatePlan are the primary CI normal form. The generated
    manifest declares the kiva-ci command that executes each check, and evidence
    runners invoke checks through this entrypoint.
check_derivation_policy:
  projection_spec_backed_checks: true
  required_groups_source: spec/ci/evidence-check-groups.source.yaml
  required_checks_are_generated: true
  rule: >
    This file keeps a compatibility view of per-check execution rows. Generated
    evidence-check manifests derive required_groups from GatePlan, derive checks
    from CheckCatalog, and annotate every check referenced by ProjectionSpec
    with projection_spec_refs.
groups:
- id: openapi-contract
  description: OpenAPI, generated projection, DTO boundary, claim, and architecture boundary validators run by the Nix OpenAPI contract gate.
  checks:
  - id: xapi-openapi-contract
    check_kind: contract-validator
    script: scripts/ci/validate_openapi.py
    args:
    - spec/openapi/kiva-xapi.yaml
    inputs:
    - scripts/ci/validate_openapi.py
    - spec/openapi/kiva-xapi.yaml
    outputs: []
    mutates_repository: false
    requires_network: false
    artifact_class: contract
  - id: confidential-openapi-contract
    check_kind: contract-validator
    script: scripts/ci/validate_confidential_openapi.py
    args:
    - spec/openapi/kiva-confidential.yaml
