schema_version: 1
kind: kiva-projection-runtime-source
status: active
description: Normalized ProjectionRuntime rows for the ProjectionRuntime normal form.
generator_plan:
  order_model: stable-topological-sort
  rule: Generator order is derived from explicit dependencies; declaration order
    is used only as the deterministic tie breaker between independent nodes.
  nodes:
    - id: design-universe-projections
      script: scripts/ci/generate_design_universe_projections.py
      depends_on: []
    - id: projection-compatibility-view
      script: scripts/ci/generate_projection_auxiliary_ledgers.py
      depends_on: []
    - id: evidence-check-normal-form
      script: scripts/ci/generate_evidence_check_catalog.py
      depends_on: []
    - id: evidence-check-manifest
      script: scripts/ci/generate_evidence_checks.py
      depends_on: [evidence-check-normal-form, projection-compatibility-view]
    - id: http-operation-catalog
      script: scripts/ci/generate_http_operation_catalog.py
      depends_on: []
    - id: pds-openapi-schemas
      script: scripts/ci/export_pds_openapi_schemas.py
      depends_on: []
    - id: generated-contract-dto-map
      script: scripts/ci/generate_generated_contract_dto_map.py
      depends_on: []
    - id: openapi-dto-map-projection
      script: scripts/ci/generate_openapi_dto_map_projection.py
      depends_on: [generated-contract-dto-map]
    - id: surface-catalog-bundle
      script: scripts/ci/generate_surface_catalog_bundle.py
      depends_on: [http-operation-catalog]
    - id: surface-catalog-projections
      script: scripts/ci/generate_surface_catalog_projections.py
      depends_on: [surface-catalog-bundle]
    - id: operation-kernel
      script: scripts/ci/generate_operation_kernel.py
      depends_on: [surface-catalog-bundle, http-operation-catalog]
    - id: pds-plane-packages
      script: scripts/ci/generate_pds_plane_packages.py
      depends_on: [surface-catalog-projections]
    - id: application-operation-catalog
      script: scripts/ci/generate_application_operation_catalog.py
      depends_on: [surface-catalog-projections]
    - id: surface-operation-index
      script: scripts/ci/generate_surface_operation_index.py
      depends_on: [surface-catalog-bundle]
    - id: route-coverage
      script: scripts/ci/generate_route_coverage.py
      depends_on: [surface-catalog-bundle]
    - id: confidential-mechanism-catalog
      script: scripts/ci/generate_confidential_mechanism_catalog.py
      depends_on: []
    - id: provider-kind-registry
      script: scripts/ci/generate_secret_compute_provider_kind_registry.py
      depends_on: []
    - id: confidential-capability-bindings
      script: scripts/ci/generate_confidential_capability_binding_index.py
      depends_on: [operation-kernel]
    - id: verification-obligations
      script: scripts/ci/generate_verification_obligations.py
      depends_on: []
    - id: confidential-mechanism-profiles
      script: scripts/ci/generate_confidential_mechanism_profile_index.py
      depends_on: [confidential-mechanism-catalog, confidential-capability-bindings, verification-obligations]
    - id: confidential-capability-policy-evidence
      script: scripts/ci/generate_confidential_capability_policy_evidence.py
      depends_on: [confidential-mechanism-profiles]
    - id: compiled-architecture
      script: scripts/ci/generate_compiled_architecture.py
      depends_on: [design-universe-projections, projection-compatibility-view]
    - id: design-backbone
      script: scripts/ci/generate_design_backbone.py
      depends_on: [compiled-architecture]
    - id: projection-graph
      script: scripts/ci/generate_projection_graph.py
      depends_on: [compiled-architecture, evidence-check-manifest]
    - id: source-registry
      script: scripts/ci/generate_source_registry.py
      depends_on: [compiled-architecture, design-universe-projections]
    - id: claim-catalog
      script: scripts/ci/generate_claim_catalog.py
      depends_on: []
    - id: claim-readiness-matrix
      script: scripts/ci/generate_claim_readiness_matrix.py
      depends_on: [claim-catalog, projection-graph, evidence-check-manifest]
    - id: evidence-set
      script: scripts/ci/generate_evidence_set.py
      depends_on: [claim-readiness-matrix, projection-graph]
    - id: evidence-receipts
      script: scripts/ci/generate_evidence_receipts.py
      depends_on: [evidence-set, verification-obligations]
    - id: executed-receipt-overlay
      script: scripts/ci/generate_executed_receipt_overlay.py
      depends_on: [evidence-receipts, evidence-check-manifest]
    - id: claim-graph
      script: scripts/ci/generate_claim_graph.py
      depends_on: [claim-readiness-matrix, evidence-set, evidence-receipts, executed-receipt-overlay, verification-obligations, confidential-capability-bindings]
    - id: assurance-graph
      script: scripts/ci/generate_assurance_graph.py
      depends_on: [claim-graph]
    - id: compatibility-deletion-readiness
      script: scripts/ci/generate_compatibility_deletion_readiness.py
      depends_on: []
    - id: compatibility-retirement-plane
      script: scripts/ci/generate_compatibility_retirement_plane.py
      depends_on: [compatibility-deletion-readiness, openapi-dto-map-projection]
projection_spec_source: spec/architecture/projection-specs.source.yaml
synchronization_policy: normal-form-primary-with-projection-spec-compatibility-view
