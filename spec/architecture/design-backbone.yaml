  policy_kind: compiled-ir-ownership
  owns: architecture_ir_policy
  split_candidate: spec/architecture/policies/architecture-ir-policy.source.yaml
- id: operation-kernel-policy
  policy_kind: operation-kernel
  owns: operation_kernel_policy
  split_candidate: spec/architecture/policies/operation-kernel-policy.source.yaml
- id: confidential-assurance-source-policy
  policy_kind: assurance-source-model
  owns: confidential_assurance_source_model
  split_candidate: spec/architecture/policies/confidential-assurance-source-policy.source.yaml
