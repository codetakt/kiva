schema_version: 1
kind: kiva-architecture-design-backbone
status: active
description: Source-of-truth ownership map for Kiva design claims, public HTTP contracts, application operation bindings, milestone status, architecture drift guards, and generated publication artifacts.
generated_from:
- generated/architecture/compiled-architecture.yaml
projection_role: architecture-graph-review-projection
source_model: spec/architecture/architecture-graph.source.yaml#/sources
projection_model: spec/architecture/projection-artifacts.source.yaml#/ + spec/architecture/projection-runtime.source.yaml#/ + spec/architecture/projection-check-bindings.source.yaml#/
policy_source: spec/architecture/architecture-policy.source.yaml
sources:
  http_contracts:
    source_layer: contract
    source_kind: canonical
    owner: spec/openapi
    purpose: External HTTP request and response contracts.
    artifacts:
    - spec/openapi/kiva-analytics.yaml
    - spec/openapi/kiva-xapi.yaml
    - spec/openapi/kiva-pds.yaml
    - spec/openapi/kiva-confidential.yaml
  operation_bindings:
    source_layer: operation
    source_kind: projection
    owner: scripts/ci/generate_application_operation_catalog.py
    purpose: Application workflow labels, Rust workflow variants, OpenAPI operationIds, and OAuth/OIDC scopes projected from the generated surface catalog.
    projection_id: surface-catalog-to-application-operation-catalog
    projection_kind: generated-registry
    source: generated/architecture/surface-catalog.yaml
    projection_sources:
    - scripts/ci/generate_application_operation_catalog.py
    projection_source_refs:
    - surface_catalog
    projection_generator: scripts/ci/generate_surface_catalog_projections.py
    generated_artifacts:
    - generated/architecture/operation-catalog.yaml
    - crates/kiva-application/src/operation_catalog/generated/registry.rs
    - crates/kiva-application/src/operation_catalog/generated/operation_ids.rs
    - crates/kiva-application/src/operation_catalog/generated/workflow_metadata.rs
    - docs/architecture/generated/application-operation-catalog.md
    - generated/application-operation-catalog.evidence.json
    projection_checks:
    - group: openapi-contract
      check_id: surface-catalog-projections
    - group: openapi-contract
      check_id: application-operation-catalog
    - group: openapi-contract
      check_id: architecture-boundaries
  implementation_claims:
    source_layer: assurance
    source_kind: canonical
    owner: spec/architecture/claim-catalog.yaml
    purpose: Public implementation claims, maturity labels, and the evidence paths supporting each claim.
    artifacts:
    - spec/architecture/claim-catalog.yaml
    - spec/architecture/claim-maturity.yaml
    projection_id: claim-catalog-to-public-claim-evidence
    projection_kind: generated-evidence
    projection_sources:
    - scripts/ci/generate_claim_catalog.py
    projection_source_refs:
    - implementation_claims
    generated_artifacts:
    - docs/architecture/generated/claim-catalog.md
    - generated/claim-catalog.evidence.json
    projection_checks:
    - group: openapi-contract
      check_id: claim-catalog
  analytics_milestones:
    source_layer: assurance
    source_kind: canonical
    owner: spec/analytics/publication-milestones.yaml
    purpose: 'BI0 analytics claim boundary and BI1/BI2 publication milestone authority without asserting an implemented analytics surface.

      '
    artifacts:
    - spec/analytics/publication-milestones.yaml
    - docs/architecture/analytics-claim-boundary.md
  analytics_reporting_templates:
    source_layer: assurance
    source_kind: canonical
    owner: spec/analytics/reporting-templates.yaml
    purpose: 'Validated BI2 reference reporting guidance for external school and corporate-training consumers of the governed analytics surface.

      '
    artifacts:
    - spec/analytics/reporting-templates.yaml
    - spec/analytics/schemas/reporting-template-catalog.schema.json
    - docs/architecture/reference-reporting-deployments.md
  claim_readiness_matrix:
    source_layer: assurance
    source_kind: projection
    owner: scripts/ci/generate_claim_readiness_matrix.py
    purpose: Generated claim readiness matrix joining public claims to maturity labels, projection edges, CI checks, and generated evidence artifacts.
    projection_id: claim-catalog-and-ci-graph-to-readiness-matrix
    projection_kind: generated-evidence
    projection_sources:
    - scripts/ci/generate_claim_readiness_matrix.py
    projection_source_refs:
    - implementation_claims
    - ci_check_manifest
    - projection_graph
    validator: scripts/ci/generate_claim_readiness_matrix.py
    generated_artifacts:
    - generated/claim-readiness-matrix.yaml
    - docs/architecture/generated/claim-readiness-matrix.md
    - generated/claim-readiness-matrix.evidence.json
    projection_checks:
    - group: openapi-contract
      check_id: claim-readiness-matrix
  claim_graph:
    source_layer: assurance
    source_kind: projection
    owner: scripts/ci/generate_claim_graph.py
    purpose: Generated read-only ClaimGraph joining claim readiness, EvidenceSet, receipt indexes, executed receipt overlays, verification obligations, and confidential capability bindings.
    artifacts:
    - spec/architecture/claim-graph.source.yaml
    - spec/architecture/schemas/claim-graph.source.schema.json
    - spec/architecture/schemas/claim-graph.schema.json
    projection_id: generated-claim-evidence-and-verification-to-claim-graph
    projection_kind: generated-evidence-index
    projection_sources:
    - spec/architecture/claim-graph.source.yaml
    - spec/architecture/schemas/claim-graph.source.schema.json
    - spec/architecture/schemas/claim-graph.schema.json
    - scripts/ci/generate_claim_graph.py
    - scripts/ci/kiva_ci/ledger.py
    projection_source_refs:
    - claim_readiness_matrix
    - evidence_set
    - evidence_receipts
    - executed_receipt_overlay
    - verification_obligations
    - confidential_capability_bindings
    validator: scripts/ci/generate_claim_graph.py
    generated_artifacts:
    - generated/architecture/claim-graph.yaml
    - docs/architecture/generated/claim-graph.md
    projection_checks:
    - group: openapi-contract
      check_id: claim-graph
    - group: openapi-contract
      check_id: claim-graph-integrity
  assurance_graph:
    source_layer: assurance
    source_kind: projection
    owner: scripts/ci/generate_assurance_graph.py
    purpose: Unified generated AssuranceGraph over claims, declared evidence receipts, capability bindings, and verification obligations.
    artifacts:
    - generated/architecture/assurance-graph.yaml
    - docs/architecture/generated/assurance-graph.md
    projection_id: claim-graph-to-assurance-graph
    projection_kind: generated-evidence-index
    projection_sources:
    - generated/architecture/claim-graph.yaml
    - spec/evidence/assurance-primitive.source.yaml
    - scripts/ci/generate_assurance_graph.py
    projection_source_refs:
    - claim_graph
    - assurance_primitive_source
    validator: scripts/ci/generate_assurance_graph.py
    generated_artifacts:
    - generated/architecture/assurance-graph.yaml
    - docs/architecture/generated/assurance-graph.md
    projection_checks:
    - group: openapi-contract
      check_id: assurance-graph
  evidence_set:
    source_layer: assurance
    source_kind: projection
    owner: scripts/ci/generate_evidence_set.py
    purpose: Unified generated EvidenceSet index binding CI evidence checks, projection-derived inputs, generated outputs, and ready public claims.
    artifacts:
    - spec/evidence/evidence-set.source.yaml
    - spec/evidence/schemas/evidence-set.schema.json
    projection_id: evidence-sources-to-unified-evidence-set
    projection_kind: generated-evidence-index
    projection_sources:
    - spec/evidence/evidence-set.source.yaml
    - spec/evidence/schemas/evidence-set.schema.json
    - scripts/ci/generate_evidence_set.py
    - scripts/ci/kiva_ci/evidence.py
    - scripts/ci/kiva_ci/projection_graph.py
    projection_source_refs:
    - ci_check_manifest
    - projection_graph
    - claim_readiness_matrix
    validator: scripts/ci/generate_evidence_set.py
    generated_artifacts:
    - generated/evidence/evidence-set.yaml
    - docs/architecture/generated/evidence-set.md
    projection_checks:
    - group: openapi-contract
      check_id: evidence-set
  evidence_receipts:
    source_layer: assurance
    source_kind: projection
    owner: scripts/ci/generate_evidence_receipts.py
    purpose: Generated EvidenceReceipt and VerificationReceipt index binding CI checks and verification discharges to stable receipt identities.
    artifacts:
    - spec/evidence/evidence-receipts.source.yaml
    - spec/evidence/schemas/evidence-receipts.schema.json
    projection_id: evidence-set-and-verification-obligations-to-receipt-index
    projection_kind: generated-evidence-index
    projection_sources:
    - spec/evidence/evidence-receipts.source.yaml
    - spec/evidence/schemas/evidence-receipts.schema.json
    - scripts/ci/generate_evidence_receipts.py
    - scripts/ci/kiva_ci/ledger.py
    projection_source_refs:
    - evidence_set
    - verification_obligations
    validator: scripts/ci/generate_evidence_receipts.py
    generated_artifacts:
    - generated/evidence/evidence-receipts.yaml
    - docs/architecture/generated/evidence-receipts.md
    projection_checks:
    - group: openapi-contract
      check_id: evidence-receipts
  executed_receipt_overlay:
    source_layer: assurance
    source_kind: projection
    owner: scripts/ci/generate_executed_receipt_overlay.py
    purpose: Generated release-run overlay model that binds declared receipt ids to optional CI run reports and sha256 hashes without claiming execution in the committed no-run overlay.
    artifacts:
    - spec/evidence/executed-receipts.source.yaml
    - spec/evidence/schemas/executed-receipts.source.schema.json
    - spec/evidence/schemas/executed-receipt-overlay.schema.json
    projection_id: declared-receipts-and-run-reports-to-executed-receipt-overlay
    projection_kind: generated-evidence-index
    projection_sources:
    - spec/evidence/executed-receipts.source.yaml
    - spec/evidence/schemas/executed-receipts.source.schema.json
    - spec/evidence/schemas/executed-receipt-overlay.schema.json
    - scripts/ci/generate_executed_receipt_overlay.py
    - scripts/ci/kiva_ci/ledger.py
    projection_source_refs:
    - evidence_receipts
    - ci_check_manifest
    validator: scripts/ci/generate_executed_receipt_overlay.py
    generated_artifacts:
    - generated/evidence/executed-receipt-overlay.yaml
    - docs/architecture/generated/executed-receipt-overlay.md
    projection_checks:
    - group: openapi-contract
      check_id: executed-receipt-overlay
    - group: openapi-contract
      check_id: executed-receipt-release-policy
  source_ledger_schemas:
    source_layer: governance
    source_kind: projection
    owner: scripts/ci/validate_source_ledger_schemas.py
    purpose: Schema-first validation registry for canonical source ledgers.
    artifacts:
    - spec/architecture/source-ledger-schemas.yaml
    - spec/architecture/schemas/source-ledger-schemas.schema.json
    - spec/architecture/schemas/generic-source-ledger.schema.json
    projection_id: source-ledgers-to-schema-validation-registry
    projection_kind: validated-evidence-index
    projection_sources:
    - spec/architecture/source-ledger-schemas.yaml
    - spec/architecture/schemas/source-ledger-schemas.schema.json
    - spec/architecture/schemas/generic-source-ledger.schema.json
    - spec/architecture/schemas/claim-graph.source.schema.json
    - spec/architecture/schemas/projection-specs.source.schema.json
    - spec/architecture/schemas/projection-normal-form-policy.source.schema.json
    - spec/ci/schemas/evidence-checks.source.schema.json
    - spec/ci/schemas/evidence-check-groups.source.schema.json
    - spec/ci/schemas/evidence-check-normal-form-policy.source.schema.json
    - spec/confidential/schemas/capability-bindings.source.schema.json
    - spec/confidential/schemas/capability-taxonomy.source.schema.json
    - spec/evidence/schemas/evidence-receipts.source.schema.json
    - spec/evidence/schemas/executed-receipts.source.schema.json
    - spec/evidence/schemas/executed-receipt-overlay.schema.json
    - spec/verification/schemas/verification-obligations.source.schema.json
    - scripts/ci/validate_source_ledger_schemas.py
    - scripts/ci/kiva_ci/ledger.py
    validator: scripts/ci/validate_source_ledger_schemas.py
    projection_targets:
    - spec/architecture/source-ledger-schemas.yaml
    projection_checks:
    - group: openapi-contract
      check_id: source-ledger-schemas
  architecture_graph:
    source_layer: governance
    source_kind: projection
    owner: scripts/ci/generate_design_universe_projections.py
    purpose: Generated ArchitectureGraph projection node that materializes the source identity list consumed by the compiled architecture IR.
    artifacts:
    - spec/architecture/architecture-graph.source.yaml
    - spec/architecture/schemas/architecture-graph.source.schema.json
  architecture_core_model:
    source_layer: governance
    source_kind: canonical
    owner: spec/architecture/core-model.source.yaml
    purpose: Minimal primary design model over OperationKernel, assurance primitives, ProjectionRuntime, CI command registry, CapabilityPort, PDS planes, and BoundaryProperty verification.
    artifacts:
    - spec/architecture/core-model.source.yaml
  design_universe:
    source_layer: governance
    source_kind: canonical
    owner: spec/architecture/design-universe.source.yaml
    purpose: Compact DesignUniverse entrypoint that owns normalized source-node, package-row, and ledger-row fragments and renders review projections.
    artifacts:
    - spec/architecture/design-universe.source.yaml
  design_source_nodes:
    source_layer: governance
    source_kind: canonical
    owner: spec/architecture/design-source-nodes.source.yaml
    purpose: Normalized DesignUniverse fragment owning ArchitectureGraph source-node rows.
    artifacts:
    - spec/architecture/design-source-nodes.source.yaml
  design_package_rows:
    source_layer: governance
    source_kind: canonical
    owner: spec/architecture/design-package-rows.source.yaml
    purpose: Normalized DesignUniverse fragment owning DesignPackage rows.
    artifacts:
    - spec/architecture/design-package-rows.source.yaml
  design_ledger_rows:
    source_layer: governance
    source_kind: canonical
    owner: spec/architecture/design-ledger-rows.source.yaml
    purpose: Normalized DesignUniverse fragment owning LedgerCatalog rows.
    artifacts:
    - spec/architecture/design-ledger-rows.source.yaml
  design_packages:
    source_layer: governance
    source_kind: projection
    owner: scripts/ci/generate_design_universe_projections.py
    purpose: Generated DesignPackage source projection that maps each core model root to its editable entrypoint, generated review surfaces, supporting refs, and lifecycle.
    artifacts:
    - spec/architecture/design-packages.source.yaml
  ledger_catalog:
    source_layer: governance
    source_kind: projection
    owner: scripts/ci/generate_design_universe_projections.py
    purpose: Generated LedgerCatalog source projection joining architecture source ids, schema coverage, lifecycle, generated compatibility artifacts, generators, validators, and primary review surfaces.
    artifacts:
    - spec/architecture/ledger-catalog.source.yaml
  operation_kernel_source:
    source_layer: operation
    source_kind: canonical
    owner: spec/architecture/operation-kernel.source.yaml
    purpose: Thin human review entrypoint that groups OperationKernel split ledgers without creating parallel operation authority.
    artifacts:
    - spec/architecture/operation-kernel.source.yaml
  assurance_primitive_source:
    source_layer: assurance
    source_kind: canonical
    owner: spec/evidence/assurance-primitive.source.yaml
    purpose: Thin human review entrypoint that fixes AssuranceGraph as the primary review surface over Claim, Obligation, Discharge, and Receipt.
    artifacts:
    - spec/evidence/assurance-primitive.source.yaml
  evidence_review_bundle:
    source_layer: assurance
    source_kind: canonical
    owner: spec/evidence/review-bundle.source.yaml
    purpose: Human-facing evidence bundle that limits routine generated-artifact review to SourceRegistry, OperationKernel, AssuranceGraph, and MechanismProfile while keeping compatibility-retirement history as supporting evidence.
    artifacts:
    - spec/evidence/review-bundle.source.yaml
  source_registry:
    source_layer: governance
    source_kind: projection
    owner: scripts/ci/generate_source_registry.py
    purpose: Unified generated SourceRegistry view over architecture source nodes, source-layer classification, schema coverage, and projection roles.
    artifacts:
    - generated/architecture/source-registry.yaml
    - docs/architecture/generated/source-registry.md
    projection_id: compiled-architecture-to-source-registry
    projection_kind: generated-evidence-index
    projection_sources:
    - generated/architecture/compiled-architecture.yaml
    - spec/architecture/source-ledger-schemas.yaml
    - spec/architecture/ledger-catalog.source.yaml
    - scripts/ci/generate_source_registry.py
    projection_source_refs:
    - compiled_architecture
    - source_ledger_schemas
    - ledger_catalog
    validator: scripts/ci/generate_source_registry.py
    generated_artifacts:
    - generated/architecture/source-registry.yaml
    - docs/architecture/generated/source-registry.md
    projection_checks:
    - group: openapi-contract
      check_id: source-registry
  architecture_policy:
    source_layer: governance
    source_kind: canonical
    owner: spec/architecture/architecture-policy.source.yaml
    purpose: Source-layer classification, compiled architecture IR ownership, SurfaceOperation kernel policy, PDS resource pattern, control/data-plane boundary, workflow entrypoint policy, HTTP adapter boundary, and confidential assurance source model.
    artifacts:
    - spec/architecture/architecture-policy.source.yaml
    - spec/architecture/policies/source-layer-policy.source.yaml
    - spec/architecture/policies/artifact-class-policy.source.yaml
    - spec/architecture/policies/architecture-ir-policy.source.yaml
    - spec/architecture/policies/operation-kernel-policy.source.yaml
    - spec/architecture/policies/confidential-assurance-source-policy.source.yaml
    - spec/architecture/policies/pds-resource-pattern.source.yaml
    - spec/architecture/policies/control-plane-boundary-policy.source.yaml
    - spec/architecture/policies/workflow-entrypoint-policy.source.yaml
    - spec/architecture/policies/http-adapter-boundary-policy.source.yaml
    - spec/architecture/policies/architecture-domain-model.source.yaml
  projection_specs:
    source_layer: governance
    source_kind: projection
    owner: spec/architecture/projection-specs.source.yaml
    purpose: Generated-only compatibility ProjectionSpec view over primary ProjectionRuntime normal-form ledgers; not a canonical or human-edited source.
    artifacts:
    - spec/architecture/projection-specs.source.yaml
  projection_auxiliary_ledgers:
    source_layer: governance
    source_kind: projection
    owner: scripts/ci/generate_projection_auxiliary_ledgers.py
    purpose: Primary ProjectionArtifact, ProjectionRuntime, and ProjectionCheckBinding source-form ledgers for source-to-projection behavior.
    artifacts:
    - spec/architecture/projection-artifacts.source.yaml
    - spec/architecture/projection-runtime.source.yaml
    - spec/architecture/projection-check-bindings.source.yaml
    projection_id: projection-spec-to-normalized-auxiliary-ledgers
    projection_kind: generated-source-normal-form
    projection_sources:
    - scripts/ci/generate_projection_auxiliary_ledgers.py
    - scripts/ci/run_generators.py
    - scripts/ci/kiva_ci/projection.py
    - scripts/ci/kiva_ci/ledger.py
    projection_source_refs:
    - projection_specs
    validator: scripts/ci/generate_projection_auxiliary_ledgers.py
    generated_artifacts:
    - spec/architecture/projection-artifacts.source.yaml
    - spec/architecture/projection-runtime.source.yaml
    - spec/architecture/projection-check-bindings.source.yaml
    projection_checks:
    - group: openapi-contract
      check_id: projection-auxiliary-ledgers
  projection_normal_form_policy:
    source_layer: governance
    source_kind: canonical
    owner: spec/architecture/projection-normal-form-policy.source.yaml
    purpose: Governance policy that keeps ProjectionRuntime normal-form ledgers primary and ProjectionSpec as a generated compatibility view.
    artifacts:
    - spec/architecture/projection-normal-form-policy.source.yaml
    - spec/architecture/schemas/projection-normal-form-policy.source.schema.json
    projection_id: projection-normal-form-policy-to-drift-enforcement
    projection_kind: validated-source-normal-form
    projection_sources:
    - spec/architecture/projection-normal-form-policy.source.yaml
    - spec/architecture/schemas/projection-normal-form-policy.source.schema.json
    - scripts/ci/validate_projection_normal_form.py
    - scripts/ci/generate_projection_auxiliary_ledgers.py
    - scripts/ci/kiva_ci/projection.py
    projection_source_refs:
    - projection_specs
    - projection_auxiliary_ledgers
    validator: scripts/ci/validate_projection_normal_form.py
    projection_targets:
    - spec/architecture/projection-normal-form-policy.source.yaml
    projection_checks:
    - group: openapi-contract
      check_id: projection-normal-form-policy
  compiled_architecture:
    source_layer: governance
    source_kind: projection
    owner: scripts/ci/generate_compiled_architecture.py
    purpose: Generated compiled architecture IR that joins graph sources, architecture policy, source classification, and artifact catalog for downstream review projections.
    projection_id: architecture-graph-and-policy-to-compiled-architecture
    projection_kind: generated-evidence-index
    source: spec/architecture/architecture-graph.source.yaml + spec/architecture/projection-specs.source.yaml + spec/architecture/architecture-policy.source.yaml
    projection_sources:
    - spec/architecture/architecture-graph.source.yaml
    - spec/architecture/projection-specs.source.yaml
    - scripts/ci/generate_compiled_architecture.py
    - scripts/ci/kiva_ci/architecture.py
    - scripts/ci/kiva_ci/architecture_compiler.py
    projection_source_refs:
    - architecture_policy
    validator: scripts/ci/generate_compiled_architecture.py
    generated_artifacts:
    - generated/architecture/compiled-architecture.yaml
    projection_checks:
    - group: openapi-contract
      check_id: compiled-architecture
  pds_resource_families:
    source_layer: operation
    source_kind: projection
    owner: scripts/ci/generate_surface_catalog_projections.py
    purpose: PDS resource-family ownership projection across route contexts, implementation files, and evidence anchors generated from the surface catalog.
    projection_id: surface-catalog-to-pds-resource-families
    projection_kind: generated-ledger
    source: generated/architecture/surface-catalog.yaml
    projection_sources:
    - scripts/ci/generate_surface_catalog_projections.py
    - scripts/ci/kiva_ci/ledger.py
    projection_source_refs:
    - surface_catalog
    projection_generator: scripts/ci/generate_surface_catalog_projections.py
    validator: scripts/ci/validate_pds_resource_families.py
    generated_artifacts:
    - generated/architecture/pds-resource-families.yaml
    projection_checks:
    - group: openapi-contract
      check_id: surface-catalog-projections
    - group: openapi-contract
      check_id: pds-resource-families
  surface_families:
    source_layer: operation
    source_kind: projection
    owner: scripts/ci/generate_surface_catalog_projections.py
    purpose: Cross-surface family ownership projection for xAPI, PDS, and confidential-computation HTTP routes generated from the surface catalog.
    projection_id: surface-catalog-to-surface-families
    projection_kind: generated-ledger
    source: generated/architecture/surface-catalog.yaml
    projection_sources:
    - scripts/ci/generate_surface_catalog_projections.py
    - scripts/ci/validate_surface_families.py
    projection_source_refs:
    - surface_catalog
    projection_generator: scripts/ci/generate_surface_catalog_projections.py
    validator: scripts/ci/validate_surface_families.py
    generated_artifacts:
    - generated/architecture/surface-families.yaml
    projection_checks:
    - group: openapi-contract
      check_id: surface-catalog-projections
    - group: openapi-contract
      check_id: surface-families
  surface_operation_overlay:
    source_layer: operation
    source_kind: canonical
    owner: spec/architecture/operation-ownership.source.yaml
    purpose: Sparse OpenAPI-keyed semantic overlay for application workflow ownership, PDS route contexts, and PDS resource-family handler ownership.
    artifacts:
    - spec/architecture/operation-ownership.source.yaml
  surface_projection_review_policy:
    source_layer: operation
    source_kind: canonical
    owner: spec/architecture/surface-projections.yaml
    purpose: Thin review entrypoint and edit policy for split surface source ledgers.
    artifacts:
    - spec/architecture/surface-projections.yaml
  surface_operation_model:
    source_layer: operation
    source_kind: canonical
    owner: spec/architecture/surface-model.source.yaml
    purpose: SurfaceOperation algebra joining OpenAPI-derived HTTP operation identity with an optional semantic overlay.
    artifacts:
    - spec/architecture/surface-model.source.yaml
  surface_generation_policy:
    source_layer: operation
    source_kind: canonical
    owner: spec/architecture/surface-generation.policy.yaml
    purpose: Generated surface catalog output, source-ledger, and projection policy.
    artifacts:
    - spec/architecture/surface-generation.policy.yaml
  surface_implementation_policy:
    source_layer: operation
    source_kind: canonical
    owner: spec/architecture/surface-implementation.policy.yaml
    purpose: Route coverage, application-operation, PDS resource-family, and cross-surface family implementation projection policy.
    artifacts:
    - spec/architecture/surface-implementation.policy.yaml
  pds_resource_family_sources:
    source_layer: operation
    source_kind: canonical
    owner: spec/architecture/pds-resource-families.source.yaml
    purpose: Human-owned PDS family descriptions and implementation anchors.
    artifacts:
    - spec/architecture/pds-resource-families.source.yaml
  surface_family_sources:
    source_layer: operation
    source_kind: canonical
    owner: spec/architecture/surface-families.source.yaml
    purpose: Human-owned cross-surface xAPI, PDS, and confidential family descriptions.
    artifacts:
    - spec/architecture/surface-families.source.yaml
  surface_catalog:
    source_layer: operation
    source_kind: projection
    owner: scripts/ci/generate_surface_catalog_bundle.py
    purpose: Generated surface review catalog and Rust surface profile registry projected from split surface source ledgers.
