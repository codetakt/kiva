source_layers:
  contract:
    description: External HTTP contracts and contract-derived publication projections.
    canonical_sources:
    - http_contracts
    projections:
    - generated_schema_artifacts
    - http_operation_catalog
    - openapi_dto_boundary
    evidence_indexes: []
    compatibility_ledgers: []
  operation:
    description: Application operation, surface model, and resource-family ownership ledgers.
    canonical_sources:
    - operation_kernel_source
    - surface_operation_overlay
    - surface_projection_review_policy
    - surface_operation_model
    - surface_generation_policy
    - surface_implementation_policy
    - pds_resource_family_sources
    - surface_family_sources
    - pds_core_planes
    - pds_state_machines
    projections:
    - surface_catalog
    - operation_kernel
    - operation_bindings
    - pds_resource_families
    - pds_plane_packages
    - surface_families
    - surface_operation_index
    - route_coverage
    evidence_indexes: []
    compatibility_ledgers: []
  assurance:
    description: Claim boundaries, milestone status, and confidential-computation evidence indexes.
    canonical_sources:
    - assurance_primitive_source
    - evidence_review_bundle
    - implementation_claims
    - analytics_milestones
    - analytics_reporting_templates
    - milestone_status
    - confidential_mechanism_packages
    projections:
    - claim_readiness_matrix
    - claim_graph
    - assurance_graph
    - evidence_set
    - evidence_receipts
    - executed_receipt_overlay
    - confidential_capability_bindings
    - confidential_capability_policy_evidence
    - confidential_mechanism_catalog
    - confidential_mechanism_profile_index
    - verification_obligations
    - secret_compute_provider_kind_registry
    evidence_indexes:
    - confidential_assurance_model
    compatibility_ledgers: []
  governance:
    description: Architecture metamodel, projection behavior, executable drift guards, compatibility lifecycle overlays, and CI runtime manifests.
    canonical_sources:
    - architecture_core_model
    - design_universe
    - design_source_nodes
    - design_package_rows
    - design_ledger_rows
    - architecture_policy
    - projection_normal_form_policy
    - ci_check_normal_form_policy
    lifecycle_overlays:
    - compatibility-retirement-lifecycle
    projections:
    - architecture_graph
    - compiled_architecture
    - design_packages
    - ledger_catalog
    - projection_auxiliary_ledgers
    - projection_specs
    - projection_graph
    - source_ledger_schemas
    - source_registry
    - ci_check_normal_form
    - ci_check_compatibility_view
    - compatibility_deletion_readiness
    - compatibility_retirement_plane
    - compatibility_exit_gates
    evidence_indexes:
    - architecture_guards
    - ci_check_manifest
    compatibility_ledgers:
    - spec/architecture/compatibility-surfaces.yaml
artifact_class_policy:
  description: 'Declarative source/projection-kind to generated artifact class policy. Generators must not infer artifact classes from ad hoc source-name or path string matching.

    '
  default_artifact_class: generated-ledger
  source_overrides:
    architecture_guards: architecture-guard
    projection_graph: architecture-guard
    implementation_claims: claim-catalog
    claim_readiness_matrix: claim-catalog
    confidential_mechanism_catalog: confidential-mechanism
  projection_kind_artifact_classes:
    generated-schema-artifacts: schema-artifact
    validated-dto-map: dto-boundary
    generated-catalog: generated-catalog
    generated-registry: generated-ledger
    generated-ledger: generated-ledger
    generated-evidence: generated-evidence
    generated-evidence-index: generated-evidence
    validated-evidence-index: architecture-guard
    validated-evidence-package: generated-evidence
  review_policy:
    editable_sources: source-yaml-openapi-rust
    generated_artifacts: committed-and-regenerated-by-ci
    human_review_scope: canonical-sources-and-code-diffs
    ci_review_scope: generated-ledgers-evidence-and-drift-checks
    release_evidence_scope: claim-readiness-and-evidence-bundles
    rule: 'Review source YAML, OpenAPI contracts, and Rust implementation directly; review generated artifacts through generator checks, drift checks, and release evidence reports.

      '
architecture_ir_policy:
  canonical_ir: generated/architecture/compiled-architecture.yaml
  compiler: scripts/ci/generate_compiled_architecture.py
  source_graph: spec/architecture/architecture-graph.source.yaml
  projection_model_sources:
  - spec/architecture/projection-artifacts.source.yaml
  - spec/architecture/projection-runtime.source.yaml
  - spec/architecture/projection-check-bindings.source.yaml
  projection_compatibility_view: spec/architecture/projection-specs.source.yaml#/projections
  policy_source: spec/architecture/architecture-policy.source.yaml
  rule: 'Human review projections, CI projection graphs, claim readiness reports, and generated evidence catalogs must consume the compiled architecture IR rather than recompiling graph, projection normal-form ledgers, and policy sources independently. ProjectionSpec is retained only as a drift-checked compatibility sidecar.

    '
  required_downstream_projections:
  - spec/architecture/design-backbone.yaml
  - spec/ci/projection-graph.yaml
  - generated/claim-readiness-matrix.yaml
  - docs/architecture/generated/claim-readiness-matrix.md
  generated_model_fields:
  - sources
  - projection_model
  - architecture_normal_form
  - artifact_catalog
  - policy_sections
  - source_layers
  - artifact_class_policy
operation_kernel_policy:
  root_model: OperationKernel
  source_root_model: SurfaceOperation
  source_model: spec/architecture/surface-model.source.yaml
  source_overlay: spec/architecture/operation-ownership.source.yaml
  generated_catalog: generated/architecture/surface-catalog.yaml
  generated_kernel: generated/architecture/operation-kernel.yaml
  rule: 'Public HTTP operation identity, application workflow binding, resource-family ownership, route coverage, server surface profiles, and operation evidence must be projections of the OperationKernel IR. OperationKernel itself is generated from the SurfaceOperation model plus generated HTTP and family assignment evidence.

    '
  projection_targets:
  - generated/architecture/operation-kernel.yaml
  - docs/architecture/generated/operation-kernel.md
  - generated/architecture/operation-catalog.yaml
  - generated/architecture/pds-resource-families.yaml
  - generated/architecture/surface-families.yaml
  - docs/architecture/generated/surface-operation-index.md
  - generated/surface-operation-index.evidence.json
  - docs/architecture/generated/route-coverage.md
  - generated/route-coverage.evidence.json
  - crates/kiva-server/src/core/state/generated_surface_profiles.rs
  runtime_bindings:
    application_registry: crates/kiva-application/src/operation_catalog/generated/registry.rs
    server_surface_profile_registry: crates/kiva-server/src/core/state/generated_surface_profiles.rs
confidential_assurance_source_model:
  package: spec/confidential/confidential-computation-assurance-package.yaml
  package_role: claim-boundary-package
  evidence_registry: spec/confidential/assurance-evidence-registry.yaml
  evidence_registry_role: typed-source-evidence-index
  verified_kernel_ledger: spec/verification/confidential-verified-kernels.yaml
  verified_kernel_ledger_role: verification-boundary-index
  reference_direction:
  - assurance-package-to-selected-mechanism-profiles
  - verified-kernel-ledger-to-assurance-evidence-registry
  - assurance-evidence-registry-to-source-anchors
  typed_evidence_owner: assurance-evidence-registry
  verification_boundary_owner: confidential-verified-kernels
pds_resource_family_pattern:
  description: 'New PDS resource families should follow the same dependency direction as existing consent, lifecycle, governance, data-product, access, and provider-binding resources.

    '
  path:
  - OpenAPI DTO
  - kiva-pds command or query input
  - admission or policy boundary
  - service or application workflow
  - repository facade
  - memory and PostgreSQL storage
  - wire projection
  - evidence and boundary anchors
  domain_event_flow:
    root_type: PdsDomainEventFlow
    flow_expression: Command -> PdsDomainEvent -> admitted write port -> ledger state -> storage projection
    event_count: 7
    event_enum: crates/kiva-pds/src/pds/events.rs
    admission_owner: crates/kiva-application/src/pds/workflow/commands.rs
    write_port_owner: crates/kiva-application/src/pds/capabilities/records.rs
    projector_owner: crates/kiva-server/src/app/pds/server_adapters/pds_records/writes.rs
    projection_owner: crates/kiva-server/src/surfaces/pds/model/projection.rs
    ledger_owner: crates/kiva-server/src/surfaces/pds/model/state/ledger.rs
    ledger_projection_anchor: PdsLedgerEventState
    events:
    - family: consent
      variants:
      - ConsentGrantRegistrationRequested
      - ConsentGrantRevocationRequested
      projector_methods:
      - register_consent_grant_impl
      - revoke_consent_grant_impl
      ledger_kinds:
      - ConsentGrantRegistered
      - ConsentGrantRevoked
    - family: data-products
      variants:
      - DataProductRegistrationRequested
      projector_methods:
      - register_data_product_impl
      ledger_kinds:
      - DataProductRegistered
    - family: lifecycle
      variants:
      - LifecycleEventRecordingRequested
      - RetentionPolicyRegistrationRequested
      - LifecycleCaseUpsertRequested
      projector_methods:
      - register_lifecycle_event_impl
      - register_retention_policy_impl
      - register_lifecycle_case_impl
      ledger_kinds:
      - LifecycleEventRegistered
      - RetentionPolicyRegistered
      - LifecycleCaseOpened
      - LifecycleCaseTransitioned
    - family: governance
      variants:
      - GovernanceProfileRegistrationRequested
      projector_methods:
      - register_governance_profile_impl
      ledger_kinds:
      - GovernanceProfileRegistered
    excluded_ledger_only_events:
    - kind: AccessDecisionRecorded
      reason: access audit decisions are repository-side ledger entries, not admitted PdsDomainEvent command variants
control_plane_data_plane_boundary:
  control_plane_owned_by_kiva:
  - HTTP contracts
  - provider identity and artifact digests
  - evidence gates and release gates
  - provider-binding registry metadata
  - lifecycle, audit, and release evidence
  data_plane_not_owned_by_kiva_by_default:
  - production secret custody
  - raw provider secrets
  - ciphertext payload custody
  - TEE runtime isolation
  - malicious-secure MPC or PSI execution
  - production FHE cryptographic security
workflow_entrypoint_policy:
  preferred_entrypoint: ApplicationOperationGateway
  direction: 'PDS and confidential workflows should enter through ApplicationOperationGateway, catalog-backed operation metadata, and shared workflow lifecycle handling before crossing repository ports.

    '
http_adapter_boundary_policy:
  root_path: crates/kiva-server/src/surfaces
  dependency_path: HTTP surface -> OpenAPI DTO -> application command/query -> port -> repository -> storage
  handler_rule: 'Handlers parse and project HTTP DTOs, then call application or service boundaries; handlers must not own domain policy or persistence decisions.

    '
  conversion_rule: 'Request and response conversion lives in surface wire/request modules or generated contract crates, not inside repository or storage code.

    '
  repository_rule: 'Persistence-specific SQLx and memory storage details stay behind repository and storage modules.

    '
  future_split_rule: 'Move storage adapters to dedicated crates only when server adapter growth creates cross-surface coupling or repeated persistence logic.

    '
  thin_handler_markers:
  - parse_pds_openapi_body
  - statement_body_from_openapi_contract
  - request_models_from_contract
  adapter_roots:
  - crates/kiva-server/src/surfaces/xapi
  - crates/kiva-server/src/surfaces/pds
  - crates/kiva-server/src/surfaces/confidential
architecture_domain_model:
  root_type: ArchitectureDomainModel
  domain_count: 4
  reduction_rule: every source layer maps to one of contracts, operations, assurance, or governance; compatibility lifecycle ownership reduces to governance.
  domains:
    contracts:
      description: External contracts and generated transport DTO boundary evidence.
      source_layers:
      - contract
      owns:
      - OpenAPI contracts
      - generated contract DTO maps
      - generated schema artifacts
    operations:
      description: Public operation algebra, workflow bindings, resource families, and route coverage.
      source_layers:
      - operation
      owns:
      - SurfaceOperation algebra
      - application operation catalog
      - PDS resource-family ledger
      - route coverage
    assurance:
      description: Claims, evidence packages, verification ledgers, and release-readiness gates.
      source_layers:
      - assurance
      owns:
      - public claim catalog
      - confidential assurance package
      - CI evidence checks
      - formal verification evidence
    governance:
      description: Architecture metamodel, projection behavior, executable drift guards, compatibility lifecycle overlays, and CI runtime manifests.
      source_layers:
      - governance
      owns:
      - architecture policy fragments
      - ProjectionSpec source-to-projection behavior
      - compiled architecture IR
      - boundary hygiene rules
      - compatibility-surface retirement ledgers
      - compatibility deletion-readiness evidence
