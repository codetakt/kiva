description: >
  Included architecture boundary rules split from the root manifest for
  focused review. The root manifest remains the executable index.

module_structure_rules:
  - id: app-root-declares-application-modules
    path: crates/kiva-server/src/app.rs
    modules:
      - { name: confidential, visibility: "pub(crate)" }
      - { name: pds, visibility: "pub(crate)" }
  - id: policy-root-declares-policy-modules
    path: crates/kiva-policy/src/policy/mod.rs
    modules:
      - { name: core, visibility: private }
      - { name: data_products, visibility: private }
      - { name: decision, visibility: private }
      - { name: delegation, visibility: private }
      - { name: governance, visibility: private }
      - { name: lifecycle, visibility: private }
  - id: confidential-differential-privacy-owner-keeps-private-review-units
    path: crates/kiva-confidential/src/mechanism/differential_privacy.rs
    modules:
      - { name: budget, visibility: private }
      - { name: errors, visibility: private }
      - { name: noise, visibility: private }
      - { name: policy, visibility: private }
      - { name: release, visibility: private }
  - id: confidential-root-declares-only-namespace-and-primitive-modules
    path: crates/kiva-confidential/src/lib.rs
    modules:
      - { name: mechanism, visibility: pub }
      - { name: primitive, visibility: pub }
  - id: secret-provider-contract-root-owns-provider-vocabulary-only
    path: crates/kiva-secret-provider-contract/src/lib.rs
    modules:
      - { name: kind_registry, visibility: private }
  - id: confidential-mechanism-root-keeps-family-facades
    path: crates/kiva-confidential/src/mechanism/mod.rs
    modules:
      - { name: additive, visibility: pub }
      - { name: core, visibility: "pub(crate)" }
      - { name: differential_privacy, visibility: pub }
      - { name: fhe, visibility: pub }
      - { name: frost, visibility: pub }
      - { name: job, visibility: pub }
      - { name: provider, visibility: pub }
      - { name: psi, visibility: pub }
      - { name: registry, visibility: pub }
      - { name: shamir, visibility: pub }
      - { name: tee, visibility: pub }
      - { name: threshold, visibility: pub }
      - { name: workflow, visibility: pub }
  - id: confidential-provider-owner-keeps-private-review-units
    path: crates/kiva-confidential/src/mechanism/provider.rs
    modules:
      - { name: admission, visibility: private }
      - { name: binding, visibility: private }
      - { name: contract, visibility: private }
      - { name: digest, visibility: private }
      - { name: pipeline, visibility: private }
      - { name: runtime, visibility: private }
  - id: server-state-owner-keeps-private-context-modules
    path: crates/kiva-server/src/core/state.rs
    modules:
      - { name: authorization, visibility: private }
      - { name: http_context, visibility: private }
      - { name: surface_operation, visibility: private }
  - id: pds-command-owner-keeps-private-family-modules
    path: crates/kiva-pds/src/pds/commands.rs
    modules:
      - { name: consent, visibility: private }
      - { name: data_products, visibility: private }
      - { name: governance, visibility: private }
      - { name: lifecycle, visibility: private }
  - id: pds-event-owner-keeps-private-family-modules
    path: crates/kiva-pds/src/pds/events.rs
    modules:
      - { name: consent, visibility: private }
      - { name: data_products, visibility: private }
      - { name: governance, visibility: private }
      - { name: lifecycle, visibility: private }
  - id: pds-application-owner-keeps-private-review-units
    path: crates/kiva-application/src/pds.rs
    modules:
      - { name: capabilities, visibility: private }
      - { name: commands, visibility: private }
      - { name: model, visibility: private }
      - { name: queries, visibility: private }
      - { name: workflow, visibility: "pub(crate)" }
  - id: application-root-declares-public-application-modules
    path: crates/kiva-application/src/lib.rs
    modules:
      - { name: confidential, visibility: pub }
      - { name: operation_catalog, visibility: pub }
      - { name: pds, visibility: pub }
      - { name: runtime, visibility: pub }
  - id: application-runtime-owner-keeps-private-review-units
    path: crates/kiva-application/src/runtime.rs
    modules:
      - { name: workflow, visibility: private }
  - id: application-runtime-workflow-owner-keeps-private-review-units
    path: crates/kiva-application/src/runtime/workflow.rs
    modules:
      - { name: admission, visibility: private }
      - { name: audit, visibility: private }
      - { name: context, visibility: private }
      - { name: executor, visibility: private }
