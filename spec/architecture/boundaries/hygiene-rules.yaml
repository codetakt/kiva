retired_tokens:
  - ReleaseArtifactRegistry
  - ReleaseSourceRegistry
  - surfaces/pds/read_model.rs
  - release_sources.rs


forbidden_source_patterns:
  - paths:
      - crates/kiva-server/src/surfaces/xapi/handlers.rs
      - crates/kiva-server/src/surfaces/xapi/handlers
      - crates/kiva-server/src/surfaces/pds/handlers.rs
      - crates/kiva-server/src/surfaces/pds/handlers
      - crates/kiva-server/src/surfaces/confidential/handlers.rs
      - crates/kiva-server/src/surfaces/confidential/handlers
    patterns:
      - "State<AppState>"
    regexes:
      - 'state\.auth\b'
      - 'state\.limits\b'
  - paths:
      - crates/kiva-server/src/surfaces/xapi/routes.rs
      - crates/kiva-server/src/surfaces/pds/routes.rs
      - crates/kiva-server/src/surfaces/confidential/routes.rs
    patterns:
      - "Router<AppState>"
