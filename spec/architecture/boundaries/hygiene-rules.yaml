description: >
  Included architecture boundary rules split from the root manifest for
  focused review. The root manifest remains the executable index.

wildcard_import_rules:
  - id: application-and-core-use-explicit-imports
    description: Application orchestration and core composition files use explicit imports.
    paths:
      - crates/kiva-server/src/app
      - crates/kiva-server/src/core
  - id: xapi-request-use-explicit-imports
    description: xAPI request parsing files use explicit imports because they define the public contract boundary.
    paths:
      - crates/kiva-server/src/surfaces/xapi/request


