schema_version: 1
kind: kiva-surface-family-source
status: active
description: Canonical public HTTP surface-family descriptions shared by xAPI, PDS, and confidential-computation routes.
implementation_anchor_policy:
  role: review-anchors-not-assignment-inputs
  assignment_fields:
    - source_pds_resource_family
    - path_prefixes
  review_anchor_fields:
    - implementation_files
  description: >
    Surface-family ownership is assigned only by PDS resource-family inheritance
    or OpenAPI path prefixes. implementation_files are review anchors carried
    into generated ledgers; they do not participate in route classification.
surface_families:
- id: analytics.aggregate-products
  surface: analytics
  openapi_contract: spec/openapi/kiva-analytics.yaml
  description: Governed aggregate product metadata and admitted release payloads.
  path_prefixes:
  - /analytics/products
  implementation_files:
  - crates/kiva-application/src/analytics.rs
  - crates/kiva-server/src/app/analytics.rs
  - crates/kiva-server/src/surfaces/analytics/routes.rs
  - crates/kiva-server/src/surfaces/analytics/handlers.rs
  - crates/kiva-server/src/surfaces/analytics/wire.rs
