schema_version: 1
kind: kiva-operation-ownership-source
status: active
description: Human-owned operation ownership overlay keyed by OpenAPI contract and operationId. HTTP method, path, and required scopes are derived from the OpenAPI HTTP operation catalog.
source_of_truth:
