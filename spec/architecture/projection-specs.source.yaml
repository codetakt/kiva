      check_id: surface-catalog-projections
    - group: openapi-contract
      check_id: surface-families
  surface_catalog:
    projection_id: surface-sources-to-generated-surface-catalog
    projection_kind: generated-ledger
    source: split surface source ledgers
    projection_sources:
    - scripts/ci/generate_surface_catalog_bundle.py
    - scripts/ci/generate_surface_catalog_projections.py
    projection_source_refs:
    - surface_operation_overlay
    - surface_projection_review_policy
    - surface_operation_model
    - surface_generation_policy
    - surface_implementation_policy
