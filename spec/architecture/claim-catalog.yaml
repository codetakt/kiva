schema_version: 1
kind: kiva-architecture-claim-catalog
status: active
description: >
  Reviewable catalog of public implementation claims and the repository
  evidence that supports each claim.
source_paths:
  - README.md
  - docs/README.md
  - docs/architecture/system-design.md
  - docs/architecture/assurance-and-confidential-computation.md
  - docs/architecture/analytics-claim-boundary.md
  - docs/architecture/reference-reporting-deployments.md
  - spec/architecture/claim-maturity.yaml
  - spec/architecture/claim-catalog.yaml
entries:
  - id: reference-reporting-deployments
    status: internally-verified
    claim_maturity: reference-fixture
    claim: >
      Kiva provides validated reference reporting deployments for schools and
      corporate training as external consumers of the governed analytics API.
    boundary: analytics-serving
    readiness_requirement:
      evidence_mode: projection-backed
      minimum_projection_matches: 1
      minimum_evidence_check_matches: 1
      rationale: >
        BI2 consists of schema-checked, vendor-neutral deployment guidance.
        It does not host a BI product, extend the xAPI LRS conformance claim,
        provide legal advice, or claim production analytics correctness.
    evidence_paths:
      - spec/analytics/reporting-templates.yaml
      - spec/analytics/schemas/reporting-template-catalog.schema.json
      - scripts/ci/validate_analytics_reporting_templates.py
      - spec/analytics/publication-milestones.yaml
      - generated/architecture/operation-kernel.yaml
      - spec/openapi/kiva-analytics.yaml
      - docs/architecture/reference-reporting-deployments.md
  - id: governed-aggregate-analytics-serving
    status: internally-verified
    claim_maturity: governed-serving
    claim: >
      Kiva provides analytics-ready governed aggregate serving for institutional
      reporting.
    boundary: analytics-serving
    readiness_requirement:
      evidence_mode: projection-backed
      minimum_projection_matches: 1
      minimum_evidence_check_matches: 1
      rationale: >
        BI1 is limited to a read-only HTTP surface over approved PDS products
        and currently admitted confidential aggregate releases. It excludes raw
        Statements, individual-level data, and a hosted reporting product.
    evidence_paths:
      - spec/openapi/kiva-analytics.yaml
      - crates/kiva-application/src/analytics.rs
      - crates/kiva-server/src/app/analytics.rs
      - crates/kiva-server/src/surfaces/analytics/handlers.rs
      - crates/kiva-server/src/tests/helpers/analytics.rs
      - scripts/ci/validate_analytics_openapi.py
      - spec/analytics/publication-milestones.yaml
      - docs/architecture/analytics-claim-boundary.md
  - id: governed-analytics-serving-boundary
    status: internally-verified
    claim_maturity: boundary-definition
    claim: >
      Analytics serving is a governed read boundary over approved data
      products, separate from the xAPI LRS conformance surface.
    boundary: analytics-serving
    readiness_requirement:
      evidence_mode: projection-backed
      minimum_projection_matches: 1
      minimum_evidence_check_matches: 1
      rationale: >
        BI0 records a reviewed architecture boundary and milestone ledger. It
        does not claim that an analytics serving API has been implemented.
    evidence_paths:
      - spec/analytics/publication-milestones.yaml
      - docs/architecture/analytics-claim-boundary.md
      - spec/architecture/claim-catalog.yaml
      - spec/architecture/claim-maturity.yaml
  - id: ieee-xapi-lrs-aligned-interface
    status: internally-verified
    claim_maturity: internal-alignment
    claim: >
      Kiva exposes an IEEE/ISO/IEC 39274-1-1:2025 aligned xAPI LRS
      interface with OpenAPI, conformance-aid, memory, and PostgreSQL
      evidence.
    boundary: xapi-lrs
    readiness_requirement:
      evidence_mode: projection-backed
      minimum_projection_matches: 1
      minimum_evidence_check_matches: 1
      rationale: >
        The public xAPI LRS claim must be backed by generated contract,
        conformance, and CI projection evidence.
    evidence_paths:
      - spec/openapi/kiva-xapi.yaml
      - generated/architecture/operation-catalog.yaml
      - tools/xapi-lrs-conformance/src/lib.rs
      - scripts/ci/validate_conformance_evidence_bundle.py
      - docs/architecture/conformance-claim.md
  - id: pds-governed-metadata-platform
    status: internally-verified
    claim_maturity: control-plane
    claim: >
      Kiva implements PDS metadata governance for consent, access audit,
      lifecycle, retention, public-sector governance, approved data products,
      and provider-binding registry metadata.
    boundary: personal-data-store
    readiness_requirement:
      evidence_mode: projection-backed
      minimum_projection_matches: 1
      minimum_evidence_check_matches: 1
      rationale: >
        The PDS governance claim crosses HTTP contracts, implementation
        resources, and CI-checked projection ledgers.
    evidence_paths:
      - spec/openapi/kiva-pds.yaml
      - crates/kiva-pds/src/pds/mod.rs
      - crates/kiva-server/src/surfaces/pds/routes.rs
      - crates/kiva-server/src/surfaces/pds/handlers/provider_bindings.rs
      - crates/kiva-server/src/surfaces/pds/storage/postgres/provider_bindings.rs
      - docs/architecture/pds-milestones.md
  - id: learner-principal-consent-agency
    status: internally-verified
    claim_maturity: control-plane
    claim: >
      Kiva supports a learner-principal deployment profile in which the
      authenticated data subject directly exercises consent grant and
      revocation, record inventory, and metadata export over their own PDS
      metadata through subject-bound OAuth/OIDC resource-server scopes.
    boundary: personal-data-store
    readiness_requirement:
      evidence_mode: projection-backed
      minimum_projection_matches: 1
      minimum_evidence_check_matches: 1
      rationale: >
        The learner-agency claim must be backed by the PDS plane model
        projection, the validated deployment template, and the subject-bound
        token flow tests recorded for milestone M15.
    evidence_paths:
      - spec/pds/core-planes.source.yaml
      - spec/pds/deployment-templates.yaml
      - spec/pds/publication-milestones.yaml
      - crates/kiva-server/src/tests/helpers/learner_principal.rs
      - crates/kiva-server/src/tests/pds_memory/learner_principal.rs
      - docs/architecture/pds-public-sector-deployment-templates.md
  - id: learner-initiated-data-portability
    status: internally-verified
    claim_maturity: control-plane
    claim: >
      Kiva supports learner-initiated data portability through a subject-bound,
      audited export of accepted Statement JSON and PDS metadata.
    boundary: personal-data-store
    readiness_requirement:
      evidence_mode: projection-backed
      minimum_projection_matches: 1
      minimum_evidence_check_matches: 1
      rationale: >
        M17 is limited to an exact-IFI subject partition, bounded pages, stored
        Statement JSON, and durable PDS audit evidence. It does not extend the
        xAPI LRS conformance surface or imply identity equivalence.
    evidence_paths:
      - spec/openapi/kiva-pds.yaml
      - spec/pds/publication-milestones.yaml
      - crates/kiva-application/src/pds/workflow/queries.rs
      - crates/kiva-server/src/surfaces/pds/handlers/portability.rs
      - crates/kiva-server/src/surfaces/xapi/storage/statement_postgres.rs
      - crates/kiva-server/src/tests/pds_memory/portability.rs
      - crates/kiva-server/src/tests/postgres.rs
      - docs/architecture/learner-data-portability-export.md
  - id: production-oauth-oidc-idp-connectivity
    status: internally-verified
    claim_maturity: deployment-integration
    claim: >
      Kiva connects to production OAuth/OIDC identity providers.
    boundary: identity-provider-deployment-adapter
    readiness_requirement:
      evidence_mode: projection-backed
      minimum_projection_matches: 1
      minimum_evidence_check_matches: 1
      rationale: >
        M16 is a deployment-edge integration backed by adapter and server
        contract tests plus CI-enforced architecture dependency rules. It does
        not assert that an identity provider or the complete authentication
        deployment is production-ready.
    evidence_paths:
      - crates/kiva-idp-adapter/src/lib.rs
      - crates/kiva-idp-adapter/src/tests.rs
      - crates/kiva-server/src/core/auth.rs
      - spec/architecture/boundaries.yaml
      - spec/architecture/boundaries/dependency-rules.yaml
      - docs/architecture/oauth-oidc-resource-server-binding.md
  - id: confidential-provider-contract-boundary
    status: internally-verified
    claim_maturity: review-gated-external-runtime
    claim: >
      Kiva admits secret/confidential-compute provider metadata through a
      typed provider contract and review gates before PDS registry persistence.
    boundary: confidential-computation
    readiness_requirement:
      evidence_mode: projection-backed
      minimum_projection_matches: 1
      minimum_evidence_check_matches: 1
      rationale: >
        Provider-boundary claims must be tied to the confidential mechanism
        catalog, provider contract, and assurance validation checks.
    evidence_paths:
      - spec/confidential/secret-compute-provider-contract.yaml
      - crates/kiva-secret-provider-contract/src/lib.rs
      - crates/kiva-confidential/src/mechanism/provider.rs
      - crates/kiva-confidential/src/mechanism/provider/binding.rs
      - crates/kiva-confidential/src/mechanism/provider/runtime.rs
      - scripts/ci/validate_secret_compute_provider_contract.py
      - docs/architecture/secret-compute-provider-integration.md
  - id: reference-provider-experiment-boundary
    status: internally-verified
    claim_maturity: reference-fixture
    claim: >
      Kiva includes deterministic reference primitive providers for
      experiments, fixtures, tests, and formal boundary work; these providers
      do not support production security claims.
    boundary: confidential-reference-primitives
    readiness_requirement:
      evidence_mode: path-only
      minimum_projection_matches: 0
      minimum_evidence_check_matches: 0
      rationale: >
        Reference primitives are deterministic fixtures and formal-boundary
        anchors. They are intentionally not a production-security projection
        and may be admitted by path evidence without projection/check matches.
    evidence_paths:
      - crates/kiva-secret-provider-contract/src/lib.rs
      - crates/kiva-confidential/src/mechanism/provider/runtime.rs
      - crates/kiva-confidential/src/mechanism/core/tests/provider.rs
      - crates/kiva-server/src/tests/pds_memory/provider_bindings.rs
      - scripts/ci/validate_confidential_computation_assurance_package.py
      - docs/architecture/assurance-and-confidential-computation.md
  - id: evidence-gated-release-posture
    status: internally-verified
    claim_maturity: evidence-gated-release
    claim: >
      Kiva release confidence is gated by Rust tests, PostgreSQL checks,
      OpenAPI validation, conformance evidence, Kani/Tamarin/F* artifacts for
      selected narrow boundaries, and Nix CI checks.
    boundary: verification-and-evidence
    readiness_requirement:
      evidence_mode: projection-backed
      minimum_projection_matches: 1
      minimum_evidence_check_matches: 1
      rationale: >
        Release-posture claims must be backed by the CI evidence manifest,
        projection graph, and executable verification gates.
    evidence_paths:
      - spec/ci/evidence-checks.yaml
      - scripts/ci/run_evidence_checks.py
      - scripts/ci/run_kani_verification.sh
      - scripts/ci/run_tamarin_verification.sh
      - scripts/ci/run_fstar_verification.sh
      - docs/operations/ci-gates.md
