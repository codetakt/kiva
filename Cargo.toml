[workspace]
resolver = "3"
members = [
    "crates/kiva-analytics-openapi-contract",
    "crates/kiva-application",
    "crates/kiva-confidential",
    "crates/kiva-confidential-core",
    "crates/kiva-confidential-contract",
    "crates/kiva-domain",
    "crates/kiva-http-core",
    "crates/kiva-idp-adapter",
    "crates/kiva-identity",
    "crates/kiva-pds",
    "crates/kiva-pds-openapi-contract",
    "crates/kiva-policy",
    "crates/kiva-release-artifacts",
    "crates/kiva-secret-provider-contract",
    "crates/kiva-server",
    "crates/kiva-xapi",
    "crates/kiva-xapi-openapi-contract",
    "tools/kiva-rust-use-scan",
    "tools/xapi-lrs-conformance",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/conceptual-systems/kiva"
readme = "README.md"
keywords = ["xapi", "lrs", "privacy", "analytics", "confidential-computing"]
categories = ["web-programming", "authentication", "cryptography"]
publish = false

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.5", default-features = false, features = ["derive", "help", "std", "usage"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc", "fast", "std", "zeroize"] }
getrandom = "0.3"
http = "1.3"
iri-string = { version = "0.7.14", default-features = false }
jsonwebtoken = { version = "9.3", default-features = false, features = ["use_pem"] }
quote = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["json", "macros", "postgres", "runtime-tokio-rustls", "time", "uuid"] }
syn = { version = "2.0", features = ["full", "visit"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(kani)"] }
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev]
debug = 1
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
